 français]\". Her mouth moves only for this line. [Character B] is not in the frame. Fixed camera. Ambient noise: [ambiance discrète]. [PHRASE DE STYLE de ma série].\n```\n\nTraduction : avec les images fournies de \\[personnage A\\], \\[personnage B\\] et \\[lieu\\], crée un plan moyen centré sur \\[personnage A\\]. Elle dit d'une voix calme et grave : « \\[réplique\\] ». Sa bouche ne bouge que pour cette réplique. \\[Personnage B\\] n'est pas dans le cadre. Caméra fixe. Ambiance : \\[…\\]. \\[Style\\].\n\n**4. Deux personnages dans le cadre, un seul parle.**\n\n```\nMedium two-shot of [character A] on the left and [character B] on the right. Only [character A] speaks and says, \"[réplique]\". [Character B] listens in silence, mouth closed, with only small eye and head movements. Fixed camera. [PHRASE DE STYLE de ma série].\n```\n\nTraduction : plan moyen de \\[A\\] à gauche et \\[B\\] à droite. Seul \\[A\\] parle et dit : « \\[réplique\\] ». \\[B\\] écoute en silence, la bouche fermée, avec seulement de petits mouvements des yeux et de la tête. Caméra fixe. Si les deux bouches bougent quand même, reviens au modèle précédent (un plan par personnage) : c'est le réglage le plus fiable.\n\n**5. Dialogue à plusieurs voix (modèle Kling).**\n\n```\n[Character A] says in a relaxed tone, \"[réplique A]\". Then [character B] responds in a low, flat voice, \"[réplique B]\". Keep each voice attached to its own character.\n```\n\nTraduction : \\[A\\] dit d'un ton décontracté : « \\[réplique A\\] ». Puis \\[B\\] répond d'une voix basse et plate : « \\[réplique B\\] ». Garde chaque voix liée à son personnage. Kling précise que le prompt doit nommer clairement qui parle. Les langues prises en charge par Kling 3.0 Omni sont le chinois, l'anglais, le japonais, le coréen et l'espagnol : pour le français, tu devras probablement passer par une voix synthétique séparée ou vérifier le résultat en écoutant. C'est une limite à tester dans ton outil avant de t'engager.\n\n**6. Vérification de cohérence des voix.**\n\n```\nVoici les fiches de voix de mes personnages : [colle]. Voici le script de l'épisode : [colle]. Vérifie : 1) chaque réplique convient à la fiche de voix du personnage, 2) aucun clip ne contient deux personnages qui parlent en même temps, 3) le ton ne change pas sans raison d'un plan à l'autre, 4) toutes les répliques font 20 mots maximum. Liste les problèmes numérotés avec le plan concerné et la correction proposée.\n```\n\n**Sources consultées le 30 septembre 2026.** [ElevenLabs, bonnes pratiques de synthèse vocale](https://elevenlabs.io/docs/overview/capabilities/text-to-speech/best-practices) · [ElevenLabs, synthèse vocale](https://elevenlabs.io/docs/overview/capabilities/text-to-speech) · [Google Cloud, guide Veo 3.1](https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1) · [Kling, guide de l'audio et du lip-sync de Kling 3.0 Omni](https://kling.ai/blog/kling-video-3-omni-native-lip-sync-audio-guide) · [Kling, guide du lip-sync](https://kling.ai/quickstart/ai-lip-sync-guide). Les prompts C3 à C5 assemblent ces consignes avec mes propres formulations (bouche fermée, plan sur un seul personnage) : aucun guide officiel ne les garantit, teste-les."}, {"id": "aJ", "n": "J", "title": "Annexe J. Prompts universels pour Claude, Gemini, ChatGPT et Grok", "phase": 5, "sum": "Les quatre assistants ont des points communs dans leurs guides officiels : dire clairement ce qu'on veut, donner le contexte, montrer un ou plusieurs...", "md": "Les quatre assistants ont des points communs dans leurs guides officiels : dire clairement ce qu'on veut, donner le contexte, montrer un ou plusieurs exemples, séparer les parties du prompt avec des balises ou des titres, préciser le format de la réponse et itérer. Le modèle ci-dessous applique ces points et fonctionne tel quel dans les quatre.\n\n### A. Le modèle universel\n\n```\n<role>\nTu es scénariste et storyboarder de séries animées verticales pour TikTok et YouTube Shorts.\n<\/role>\n\n<constraints>\n- Réponds en français, sauf les prompts d'image et de vidéo qui sont en anglais.\n- Deux personnages au maximum par plan, un seul parle à la fois.\n- Répliques de 20 mots maximum.\n- Aucune marque, aucun logo, aucun nom de personnage ou de studio existant.\n- Si une information manque, pose-moi la question avant d'inventer.\n<\/constraints>\n\n<context>\nMa série : [titre et résumé en une phrase]. Mon style visuel : [PHRASE DE STYLE de ma série]. Mes personnages : [colle les fiches]. Mes décors : [colle les descriptions]. Mes voix : [colle les fiches de voix].\n<\/context>\n\n<task>\n[ce que tu veux, en une phrase claire, avec un verbe d'action]\n<\/task>\n\n<examples>\n[colle un exemple de résultat que tu as déjà validé, s'il existe]\n<\/examples>\n\n<output_format>\n[tableau, liste numérotée ou texte prêt à copier]\n<\/output_format>\n```\n\nPourquoi ce modèle fonctionne : c'est la structure rôle, instructions, contexte, exemples, format que recommandent Anthropic (balises XML, rôle, exemples) et OpenAI (identité, instructions, exemples, contexte), et le gabarit rôle, contraintes, format de sortie que propose Google pour Gemini. Tu n'as pas besoin de comprendre les balises : remplace seulement ce qui est entre crochets.\n\n### B. Ce que dit le guide de chaque assistant, et l'ajustement à faire\n\n| Assistant | Ce que recommande son guide officiel | Ajustement pour ta série |\n| --- | --- | --- |\n| Claude (Anthropic) | Être clair et direct, expliquer pourquoi (le contexte aide), donner 3 à 5 exemples dans des balises, séparer les parties avec des balises XML, donner un rôle, mettre les longs documents en haut du prompt, formuler positivement (« écris en paragraphes fluides » plutôt que « pas de liste »). | Colle ta bible et tes fiches en haut du prompt, ta demande en bas. Explique la raison d'une règle (« les répliques sont lues par une voix de synthèse, donc pas de points de suspension »). Demande d'agir (« écris le script ») plutôt que de suggérer (« peux-tu proposer »). |\n| Gemini (Google) | Instructions précises et directes, toujours donner quelques exemples, séparateurs cohérents (XML ou titres), contraintes essentielles au tout début, contexte d'abord et question tout à la fin, gabarit rôle, contraintes, format de sortie. | Place le bloc contraintes avant le contexte. Mets toujours un exemple validé dans exemples. Garde la tâche à la toute fin. |\n| ChatGPT (OpenAI) | Structure identité, instructions, exemples, contexte, titres et listes pour organiser, balises pour délimiter, des adjectifs pour le ton, corriger par petites itérations. | Décris le ton voulu avec des adjectifs (chaleureux, rythmé, drôle). Si le résultat ne convient pas, change un seul élément de la consigne et redemande. |\n| Grok (xAI) | Je n'ai pas trouvé de guide officiel général. Le guide de xAI pour son modèle de code, rapporté par un article secondaire, conseille : essayer vite puis affiner, structurer avec des balises ou des titres, être précis, ne donner que le contexte utile. | Commence par une version courte, puis affine. Ne colle que les fiches des personnages et des décors du plan concerné, pas toute la bible. |\n\nLa méthode est donc la même partout. L'ordre des blocs change un peu : Claude aime les longs documents en haut, Gemini veut les contraintes en premier et la question en dernier. Si un assistant ne suit pas une règle, déplace ce bloc au début ou à la fin et redemande.\n\n### C. Les prompts universels de ton projet\n\nTous les prompts de ce guide restent valables dans les quatre assistants. Voici les modèles de base, réécrits dans la structure universelle. Remplace les crochets, colle le tout.\n\n**1. Les instructions permanentes (à mettre une seule fois dans l'espace d'instructions de ton assistant : projet ou réglage équivalent).**\n\n```\n<role>\nTu m'aides à produire les images, les vidéos, les voix et les scripts d'une série animée verticale. Les informations de ce projet sont la source de vérité.\n<\/role>\n\n<constraints>\n- Ne change jamais l'apparence ni la voix d'un personnage.\n- Reprends mot pour mot la description visuelle fixe des personnages et des lieux dans chaque prompt d'image et de vidéo.\n- Un seul style pour toute la série : [PHRASE DE STYLE de ma série].\n- Deux personnages au maximum par plan, un seul parle à la fois.\n- Aucune marque, aucun logo, aucun texte imprimé, aucun nom de personnage ou de studio existant.\n- Si un détail manque, demande-le avant d'inventer.\n<\/constraints>\n\n<context>\nMa série : [résumé]. Ma bible : [colle ou joins]. Mes fiches de voix : [colle ou joins].\n<\/context>\n\n<output_format>\nRéponds en français. Écris les prompts d'image et de vidéo en anglais, chacun dans un bloc de code, suivis d'une courte traduction en français.\n<\/output_format>\n```\n\n**2. Créer la bible.**\n\n```\n<task>\nCrée la bible de la saison 1 à partir de mon concept.\n<\/task>\n\n<context>\nConcept : [colle]. Univers : [colle]. Style visuel : [PHRASE DE STYLE de ma série].\n<\/context>\n\n<output_format>\n- 5 personnages : nom, rôle, caractère en 3 mots, désir, peur, secret, façon de parler, phrase culte, liens avec les autres, et une description visuelle fixe en anglais de 40 à 60 mots qui se termine par la phrase de style.\n- 3 lieux du quotidien avec une description visuelle fixe en anglais.\n- L'arc de la saison en 10 épisodes, une ligne par épisode.\n- Une liste de choses interdites.\n<\/output_format>\n```\n\n**3. Écrire un script.**\n\n```\n<task>\nÉcris le script de l'épisode [numéro] : [résumé en 3 phrases].\n<\/task>\n\n<constraints>\nDurée cible : 70 secondes. Structure : accroche de 3 secondes, rappel de 5 secondes (sauf épisode 1), conflit, révélation, cliffhanger. Deux personnages maximum par scène, un seul parle à la fois. Répliques de 20 mots maximum. Ne résous pas le conflit principal de la saison.\n<\/constraints>\n\n<output_format>\nUn tableau : minutage, lieu, personnage qui parle, réplique, action visible.\n<\/output_format>\n```\n\n**4. Découper en storyboard.**\n\n```\n<task>\nTransforme le script ci-dessous en storyboard de 10 plans plus 2 plans de réserve.\n<\/task>\n\n<output_format>\nUn tableau avec : numéro, durée (5 à 8 secondes), lieu, personnage qui parle, réplique (20 mots maximum), action visible (une seule), cadrage, émotion, \"Prompt image\" (en anglais, avec la description fixe reprise mot pour mot) et \"Prompt vidéo\" (en anglais, uniquement ce qui bouge : un mouvement, une expression, un mouvement de caméra). Le plan 1 accroche en 3 secondes, le dernier plan est le cliffhanger.\n<\/output_format>\n\n<script>\n[colle le script]\n<\/script>\n```\n\n**5. Créer une image ou une vidéo à partir d'un plan.**\n\n```\n<task>\nÉcris le prompt d'image, puis le prompt image vers vidéo, pour le plan [numéro] : [colle la ligne du storyboard].\n<\/task>\n\n<constraints>\nLe prompt d'image suit l'ordre : décor, sujet, détails clés, lumière, cadrage, phrase de style, vertical 9:16, no text, no logo. Le prompt vidéo décrit seulement le mouvement (caméra puis sujet), sans décrire l'image. Utilise mot pour mot les descriptions fixes de mon projet.\n<\/constraints>\n```\n\n**6. Vérifier avant de générer.**\n\n```\n<task>\nVérifie ce storyboard avant que je génère quoi que ce soit.\n<\/task>\n\n<constraints>\nContrôle : la description des personnages est identique mot pour mot dans tous les prompts, il n'y a pas plus de deux personnages par plan, un seul personnage parle par plan, chaque plan est animable en 5 à 8 secondes, aucune marque ni aucun logo. Liste les erreurs numérotées avec la correction.\n<\/constraints>\n\n<storyboard>\n[colle le storyboard]\n<\/storyboard>\n```\n\n**Sources consultées le 30 septembre 2026.** [Anthropic, bonnes pratiques de prompt pour Claude](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) · [Google, stratégies de prompt pour Gemini](https://ai.google.dev/gemini-api/docs/prompting-strategies) · [OpenAI, bonnes pratiques pour ChatGPT](https://help.openai.com/en/articles/10032626-prompt-engineering-best-practices-for-chatgpt) · [OpenAI, prompt engineering (API)](https://developers.openai.com/api/docs/guides/prompt-engineering) · [xAI, documentation](https://docs.x.ai/overview) · [PromptLayer, résumé du guide xAI pour le modèle de code (source secondaire)](https://blog.promptlayer.com/xais-prompt-engineering-guide-for-grok-code-fast-1/). Les modèles des parties B et C sont mes adaptations de ces recommandations à ton projet."}, {"id": "aK", "n": "K", "title": "Annexe K. Astuces récentes des guides, des blogs et des forums", "phase": 5, "sum": "Cette partie rassemble des techniques trouvées fin septembre 2026 qui ne figuraient pas encore dans le guide. Pour chaque astuce, j'indique d'où elle...", "md": "Cette partie rassemble des techniques trouvées fin septembre 2026 qui ne figuraient pas encore dans le guide. Pour chaque astuce, j'indique d'où elle vient. Une source officielle vient de l'éditeur de l'outil (Kling, Midjourney, YouTube). Une source officieuse est un blog, un outil concurrent ou un site de tutoriels : l'astuce y est souvent bonne, mais elle n'est garantie par personne, donc teste-la. Les forums Reddit n'ont pas pu être lus directement : les conseils de la communauté viennent ici des blogs qui les reprennent.\n\n### A. Stabiliser l'animation : visages qui dérivent, mains, scintillement\n\n**1. Produis d'abord le plan le plus difficile.** Le plan à deux personnages, celui où quelqu'un court, celui où un objet passe de main en main : génère-le en premier. Si l'outil n'y arrive pas, tu réécris la scène avant d'avoir dépensé tes crédits sur les plans faciles. (Blog Higgsfield, officieux.)\n\n**2. Décris un mouvement comme un trajet : position de départ, mouvement, position d'arrivée.** Plutôt que « she stands up », écris où elle commence et où elle finit. L'outil invente moins, donc déforme moins. (Blog Higgsfield et guide Kapwing pour Hailuo, officieux.)\n\n```\nThe girl starts seated at the table, both hands resting on it. She slowly pushes the chair back and stands up. She ends standing still, facing the window. Fixed camera.\n```\n\nTraduction : la fille est d'abord assise à la table, les deux mains posées dessus. Elle recule lentement la chaise et se lève. Elle finit debout, immobile, face à la fenêtre. Caméra fixe.\n\n**3. La formule anti scintillement : un sujet, un petit mouvement, un mouvement de caméra simple, un détail d'ambiance.** Quand l'image « fond » ou clignote, c'est souvent qu'on demande trop de choses à la fois. (Blog Quest Studio, officieux.)\n\n```\nThe boy blinks and slowly lifts his head. Slow push in. Soft dust drifting in the window light.\n```\n\nTraduction : le garçon cligne des yeux et relève lentement la tête. Lent travelling avant. Un peu de poussière qui flotte dans la lumière de la fenêtre. Choisis un seul effet d'ambiance (brume légère ou poussière), jamais une tempête de particules.\n\n**4. Ajoute des mots de rythme et dis ce qui reste immobile.** Un mouvement saccadé vient souvent d'un mouvement trop grand ou mal décrit. Ajoute `gentle`, `steady` ou `slowly`, décris une seule action, et précise ce qui ne bouge pas : `static subject, slow camera push in` (sujet immobile, lent travelling avant). Si le personnage reste instable, supprime le mouvement de caméra. (Morphic et Quest Studio, officieux.)\n\n**5. Donne aux mains une pose simple.** Les mains sont petites, rapides et se plient de façon complexe : c'est pour ça qu'elles déraillent. Demande `hands resting on the table` (mains posées sur la table) ou `holding a cup with both hands` (tient une tasse à deux mains) plutôt qu'un geste compliqué. (Morphic, officieux.)\n\n**6. Un détail ignoré mérite sa propre phrase.** Si l'outil oublie le foulard rouge, c'est souvent qu'il est noyé dans un prompt trop chargé. Mets le sujet et l'action en premier, le décor et le style ensuite, et donne au détail têtu une phrase à lui, ou une image de référence. (Morphic, officieux.)\n\n**7. Joins aussi l'image du décor, pas seulement celle du personnage.** Sans référence de lieu, l'outil réinvente le fond à chaque plan. (Higgsfield, officieux, et cohérent avec les guides Runway et Google déjà cités.)\n\n**8. Pose la caméra.** Kling conseille d'ajouter des mots qui ancrent la physique de la scène : `fixed lens` (objectif fixe), `tripod` (trépied), `35mm`. Évite les rotations rapides et les changements de direction : fabrique l'énergie au montage, par le rythme des coupes. (Blog Kling, officiel, et Higgsfield.)\n\n**9. Le filtre anti scintillement du montage ne répare pas tout.** Un filtre de lissage (deflicker) corrige une légère pulsation de luminosité ou une texture qui frémit. Il ne répare jamais un visage qui change ou un objet qui se tord : là, il faut regénérer. (Quest Studio, officieux.)\n\n**10. Pour un visage fidèle, cadre plus serré.** Plus le visage est grand dans l'image, mieux il est conservé. Garde les plans larges pour les moments où l'expression compte peu. (Guide Kapwing pour Hailuo, officieux.)\n\n### B. Les nouvelles fonctions de référence des outils\n\nLes outils changent tous les mois. Vérifie dans l'outil lui-même le prix et la disponibilité avant de t'abonner.\n\n**1. Nano Banana Pro (Google) : l'ancre d'identité et la phrase de verrouillage.** D'après un blog de tutoriels, l'outil accepte jusqu'à 5 personnes à partir de 14 images de référence au maximum (le guide officiel de Google cité plus haut confirme les 14 images). Commence avec une seule référence forte, de face, bien éclairée, expression neutre, et n'en ajoute que si un angle manque : plus d'images n'est pas mieux si elles ne se ressemblent pas parfaitement. Préfère une retouche ciblée à une nouvelle génération complète. Modèle en quatre parties : ancre, sujet et action, composition, verrouillage.\n\n```\nUse the attached image as the reference character. Keep her exact facial features, skin tone, hairstyle and body proportions identical. She is watering plants on a small balcony, medium shot, vertical 9:16, [PHRASE DE STYLE de ma série]. Do not change her face or identity, only change the setting and pose.\n```\n\nTraduction : utilise l'image jointe comme personnage de référence. Garde exactement ses traits, sa couleur de peau, sa coiffure et ses proportions. Elle arrose des plantes sur un petit balcon, plan moyen, vertical 9:16. Ne change pas son visage ni son identité, change seulement le décor et la pose. (Blog UD, officieux.)\n\n**2. Midjourney : l'Omni Reference.** D'après la documentation officielle de Midjourney, le paramètre `--oref` suivi d'une image garde un personnage ou un objet d'une image à l'autre. Une seule image par référence. Le paramètre `--ow` règle la force de la référence de 1 à 1 000 (100 par défaut) : reste sous 400, au-delà les résultats deviennent imprévisibles. La fonction marche avec la version 7, coûte deux fois plus de temps de calcul, et n'est pas compatible avec certaines fonctions de retouche (Vary Region, Pan, Zoom Out). Les petits détails (taches de rousseur, motif sur un vêtement) peuvent ne pas être reproduits exactement. Pour la version 8, Midjourney recommande plutôt son outil d'édition (Edit Model). Exemple :\n\n```\nthe character reading a letter in a small kitchen, medium shot, [PHRASE DE STYLE de ma série] --oref [lien de l'image de référence] --ow 100 --ar 9:16\n```\n\n**3. Hailuo (MiniMax H3) : dire à quoi sert chaque référence.** D'après le guide de Kapwing (officieux), la version H3 génère des clips de 5 à 15 secondes et accepte jusqu'à 12 fichiers de référence. L'ordre conseillé du prompt : références, ce qu'il faut garder, scène, déroulement dans le temps, caméra, son, contraintes. Le point le plus utile, valable dans tous les outils : dire pour chaque image ce qu'elle contrôle et ce qu'il faut ignorer.\n\n```\nImage 1 defines the character: fully preserve her face, hairstyle and outfit. Ignore the grey background and the lighting of image 1. Image 2 defines the location. She walks slowly from the door to the window, then stops. Slow dolly in, eye level. Ambient noise: distant traffic.\n```\n\nTraduction : l'image 1 définit le personnage : garde entièrement son visage, sa coiffure et sa tenue. Ignore le fond gris et la lumière de l'image 1. L'image 2 définit le lieu. Elle marche lentement de la porte à la fenêtre, puis s'arrête. Lent travelling avant, à hauteur des yeux. Ambiance : circulation lointaine.\n\n**4. Seedance 2.0 : plusieurs plans numérotés dans un seul prompt.** D'après le guide de Higgsfield (officieux), on indique tout en haut la structure (nombre de plans), la durée totale et le format, puis on décrit chaque plan numéroté. On appelle l'image de référence avec `@image`. Astuce reprise par plusieurs blogs : dire ce que la caméra ne fait pas (`no cuts, no zoom`) pour éviter les changements d'angle en cours de clip.\n\n```\n3 shots, 10 seconds total, vertical 9:16. @image is the character and style reference.\nShot 1: medium shot, the boy opens the fridge and freezes.\nShot 2: close-up of his surprised face, no cuts, no zoom.\nShot 3: wide shot, he slowly closes the fridge and looks at the camera.\n```\n\nTraduction : 3 plans, 10 secondes au total, vertical 9:16. @image est la référence du personnage et du style. Plan 1 : plan moyen, le garçon ouvre le frigo et se fige. Plan 2 : gros plan sur son visage surpris, sans coupe ni zoom. Plan 3 : plan large, il referme lentement le frigo et regarde la caméra.\n\n**5. Kling : le contrôle du mouvement (Motion Control).** D'après le blog officiel de Kling, tu peux transférer le mouvement d'une vidéo de référence (par exemple toi qui fais un geste) sur ton personnage, jusqu'à 30 secondes d'action continue quand le personnage suit l'orientation de la vidéo, et jusqu'à 10 secondes quand il garde celle de l'image. Conseils : une vidéo de référence cadrée comme ton image (buste pour un buste, en pied pour un en pied), une silhouette bien visible sur un fond simple, des mouvements calmes et réguliers plutôt que des tours rapides. Utile pour une danse, un geste précis ou une mimique que le texte décrit mal. Ne filme que toi ou une personne qui a donné son accord.\n\n### C. Montage et son\n\n**1. Harmonise les couleurs avec la correspondance de couleur de CapCut.** Les clips générés séparément n'ont jamais exactement la même teinte. Dans CapCut, sélectionne un clip, onglet `Ajustement`, outil `Color match` (correspondance de couleur), puis choisis comme référence une image de ton clip le plus réussi. Fais-le pour chaque clip du même décor, puis affine si besoin avec les roues chromatiques ou les courbes. (Page officielle de CapCut ; le nom exact du menu peut varier selon ta version et ta langue.)\n\n**2. Construis le son en couches.** L'ordre conseillé par Kling : d'abord l'ambiance du lieu, puis les petits bruits qui correspondent aux gestes à l'écran (pas, porte, tasse posée), puis la voix, qui reste la priorité. (Blog Kling, officiel.)\n\n**3. Baisse la musique quand quelqu'un parle (ducking).** Le ducking baisse automatiquement la musique pendant la voix. Kling indique une musique et des bruits de fond à environ 20 à 30 % du volume de la voix ; ce guide conseillait 10 à 20 % plus haut. Il n'y a pas de chiffre unique : reste entre 10 et 30 %, puis écoute l'épisode sur ton téléphone, haut-parleur intégré, sans casque. Si une seule syllabe se perd, baisse encore.\n\n**4. Des virgules pour faire respirer la voix.** Kling rappelle que la ponctuation évite l'effet robot (voir aussi la partie sur les voix).\n\n### D. La série et la publication\n\n**1. Donne à ta série une identité reconnaissable dans le fil.** Un générique court et toujours identique, une couverture toujours construite de la même façon (même police, même place pour le numéro), une numérotation uniforme (ÉP. 01, ÉP. 02). Le public doit reconnaître ta série avant même de lire le titre. (Blog Anijam, officieux.)\n\n**2. Écris pour la caméra, pas pour un roman.** « Gros plan sur sa main qui tremble pendant qu'elle lit la lettre » se filme. « Elle lit, nerveuse » ne se filme pas. Dans ton script, chaque émotion doit devenir un geste ou un cadrage. (Blog Anijam, officieux.)\n\n**3. Une idée par épisode, et 5 à 10 épisodes prévus d'avance.** Prévoir la suite évite les contradictions et permet de semer des indices que les fidèles repéreront. (Blog Anijam, officieux.)\n\n**4. Un style stylisé pardonne plus qu'un style photoréaliste.** Sur des dizaines d'épisodes, un rendu dessin, peinture ou 3D cache mieux les défauts de l'IA qu'un rendu qui imite une vraie photo. C'est un argument de plus pour bien choisir ton style dès le départ. (Blog Anijam, officieux.)\n\n**5. Les listes de lecture TikTok.** TikTok permet de ranger des vidéos en listes de lecture (playlists) visibles sur le profil, ce qui aide le public à trouver l'épisode suivant. Un article de 2023 indiquait un nom limité à 15 caractères et un accès réservé à certains créateurs au départ. Vérifie dans ton application : profil, puis ta vidéo, puis l'option d'ajout à une playlist. Sinon, écris « Ép. 2 » dans le titre et épingle l'épisode 1 sur ton profil.\n\n### E. Étiquetage IA : les précisions officielles de YouTube\n\nLa page d'aide de YouTube précise quand il faut cocher la case « contenu modifié ou synthétique ». C'est obligatoire quand le contenu a l'air réel et qu'on pourrait le prendre pour vrai : une vraie personne qui dit ou fait quelque chose qu'elle n'a pas fait, un vrai lieu ou un vrai événement modifié, une scène réaliste qui n'a jamais eu lieu. Ce n'est pas obligatoire pour un contenu clairement irréaliste (l'exemple de YouTube : quelqu'un qui chevauche une licorne dans un monde fantastique), ni pour l'aide à la production (script, titre, miniature faits avec l'IA), ni pour ta propre voix clonée. Si tu ne déclares pas alors qu'il le fallait, YouTube peut ajouter l'étiquette lui-même, retirer la vidéo ou suspendre ta participation au Programme Partenaire.\n\nCe que ça veut dire pour toi : un dessin animé plat ou des fruits qui parlent sont clairement irréalistes. Une 3D semi-réaliste qui montre un enfant dans une vraie maison peut être prise pour une vraie scène : coche la case. En cas de doute, coche-la, puisque c'est l'oubli qui est sanctionné. Pour TikTok, plusieurs sites spécialisés indiquent que la plateforme détecte et étiquette déjà automatiquement une partie des contenus IA grâce aux métadonnées des fichiers (Content Credentials) : je n'ai pas pu lire la page officielle de TikTok pour le confirmer, donc continue d'activer toi-même l'étiquette IA comme le guide l'explique plus haut.\n\n**Sources consultées le 30 septembre 2026.** Officielles : [Kling, corriger la dérive et garder la cohérence](https://kling.ai/blog/fix-ai-video-drift-consistency-guide) · [Kling, ajouter bruitages et voix off](https://kling.ai/blog/add-ai-video-sound-effects-voiceovers) · [Midjourney, Omni Reference](https://docs.midjourney.com/hc/en-us/articles/36285124473997-Omni-Reference) · [CapCut, correspondance de couleur](https://www.capcut.com/tools/match-color-with-ai) · [YouTube, déclaration de contenu modifié ou synthétique](https://support.google.com/youtube/answer/14328491). Officieuses : [Higgsfield, 10 astuces contre les déformations](https://higgsfield.ai/blog/how-to-avoid-distortions-ai-videos) · [Higgsfield, guide de prompt Seedance 2.0](https://higgsfield.ai/blog/seedance-prompting-guide) · [Morphic, 5 défauts et leurs solutions](https://morphic.com/resources/how-to/ai-video-troubleshooting) · [Quest Studio, réduire le scintillement](https://queststudio.io/blog/reduce-flicker-melting-artifacts) · [Kapwing, prompts pour MiniMax H3](https://www.kapwing.com/resources/how-to-prompt-minimax-h3-hailuo-3-0-a-guide-for-ai-video-creators/) · [UD, personnages cohérents avec Nano Banana Pro](https://www.ud.hk/en/blogs/insight/article/2026-06-29-nano-banana-consistent-characters) · [Anijam, créer une série IA](https://www.anijam.ai/blog/how-to-make-ai-series/) · [Business of Apps, listes de lecture TikTok (2023)](https://www.businessofapps.com/news/tiktok-adds-playlist-feature/) · [Storrito, règles d'étiquetage IA de TikTok](https://storrito.com/resources/tiktoks-2026-ai-labeling-rules-and-what-they-signal-for-platform-governance/). Les exemples de prompts de cette partie sont mes adaptations à ta série."}, {"id": "aL", "n": "L", "title": "Annexe L. Sous-titres, couvertures et accroches : les réglages précis", "phase": 5, "sum": "Le guide expliquait déjà comment créer des sous-titres automatiques, les placer dans la zone sûre (2 lignes, 35 caractères par ligne) et choisir une...", "md": "Le guide expliquait déjà comment créer des sous-titres automatiques, les placer dans la zone sûre (2 lignes, 35 caractères par ligne) et choisir une couverture lisible. Cette partie ajoute les chiffres et les techniques trouvés fin septembre 2026. Comme plus haut, chaque point indique si la source est officielle ou officieuse.\n\n### A. Où placer le texte sur un écran 9:16\n\nSur TikTok, YouTube Shorts et Instagram, des boutons et des textes recouvrent ta vidéo : le nom du compte et la description en bas, les boutons j'aime, commentaire et partage à droite, parfois le titre en haut. Les sites spécialisés (officieux, aucune plateforme ne publie de gabarit officiel au pixel près) donnent ces repères pour une vidéo de 1080 sur 1920 pixels :\n\n- Évite le haut de l'écran, environ 20 %.\n- Évite le bas de l'écran, environ 25 %. Sur TikTok, place les sous-titres un peu plus haut que sur Instagram, car la description qui s'ouvre en bas les recouvre.\n- Évite le tiers droit, où sont les boutons.\n- La zone de texte sûre sur TikTok fait environ 1080 sur 1420 pixels, centrée.\n\nEn pratique : garde les sous-titres, le visage qui parle et les objets importants dans le centre de l'écran. Au moment de créer une image, demande `leave empty space in the lower third for subtitles` (laisse de la place dans le tiers bas pour les sous-titres), puis place les sous-titres juste au-dessus de la zone interdite du bas. Certains sites proposent un calque gratuit à poser sur ta vidéo pour vérifier. (Kreatli et OpusClip, officieux.)\n\n### B. Des sous-titres faciles à lire\n\n- **Longueur.** 32 à 42 caractères par ligne au maximum, soit environ 5 à 7 mots, et jamais plus de 2 lignes à la fois. La règle de ce guide (35 caractères) est dans cette fourchette. (OpusClip, officieux.)\n- **Rythme.** Fais apparaître le sous-titre 0,1 à 0,3 seconde avant la voix, et laisse-le 1,5 à 3 secondes selon le nombre de mots. Repère : 0,3 seconde par mot plus une demi-seconde. (OpusClip, officieux.)\n- **Contraste.** Texte blanc sur fond foncé, ou jaune sur bleu foncé. Si l'image est chargée, ajoute un rectangle noir semi-transparent (opacité 60 à 80 %) derrière le texte. Évite le rouge sur vert, illisible pour les daltoniens. (OpusClip, officieux, d'après les normes d'accessibilité WCAG.)\n- **Une couleur par personnage.** Pour un dialogue, donne à chaque personnage sa couleur de sous-titre, toujours la même d'un épisode à l'autre (le garçon en bleu clair, sa sœur en jaune). Le public suit qui parle même sans le son. (OpusClip, officieux.)\n- **Les bruits entre crochets.** Écris les sons importants pour l'histoire : \\[porte qui grince\\], \\[téléphone qui vibre\\]. Beaucoup de gens regardent sans le son. (OpusClip, officieux.)\n- **Sur YouTube, ajoute aussi un fichier de sous-titres.** En plus des sous-titres incrustés dans l'image, tu peux importer un fichier .srt dans YouTube Studio : il sert à l'accessibilité et le texte peut être lu par YouTube. CapCut permet d'exporter les sous-titres dans ce format (option à vérifier dans ta version). (OpusClip, officieux.)\n- **TikTok le confirme pour la publicité.** Dans ses conseils officiels pour les publicités, TikTok indique que le texte à l'écran augmente le temps de visionnage et la mémorisation, et rappelle l'existence de ses sous-titres automatiques. Ces chiffres concernent les publicités, pas les séries, mais la logique est la même. (TikTok For Business, officiel.)\n\n### C. La couverture (ou miniature)\n\n**Ce qui a changé sur YouTube.** Depuis juillet 2026, YouTube permet aux membres du Programme Partenaire d'importer une miniature personnalisée pour un Short, et propose trois images au choix sur ordinateur. Sur téléphone, tu peux toujours choisir n'importe quelle image de la vidéo. YouTube prévoit d'ouvrir l'import à plus de créateurs plus tard. Tant que tu n'es pas partenaire, prévois donc dans ton montage une image qui fait une bonne couverture, idéalement dans la première seconde. (Blog officiel de YouTube, 24 juillet 2026.)\n\n**Les règles d'une bonne couverture (officieux).**\n\n- **Lisible en format timbre-poste.** Ta couverture s'affiche en tout petit dans la grille du profil. Regarde-la en réduction avant de la valider.\n- **3 à 5 mots maximum** de titre, en gros.\n- **Le centre de l'image.** Garde le visage et le titre au centre, avec une marge autour, pour que rien ne soit coupé dans la grille.\n- **Une émotion forte.** Un visage expressif (surprise, peur, colère) qui regarde vers la caméra attire plus l'œil qu'un plan large.\n- **Un code par série.** Chaque série a sa couleur, son icône ou sa mise en page. Si tu lances une deuxième série, on doit les distinguer d'un coup d'œil dans ton profil.\n\n(Miraflow, officieux.)\n\n**Prompt pour créer une image de couverture.**\n\n```\nVertical 9:16 cover image. Close-up of [description fixe du personnage], looking straight at the camera with a strong expression of [surprise / fear / anger], face centered in the upper half of the frame. Simple, uncluttered background in [couleur de la série]. Leave a large empty area in the center of the lower half for a title. [PHRASE DE STYLE de ma série]. No text, no logo.\n```\n\nTraduction : couverture verticale 9:16. Gros plan sur \\[personnage\\], qui regarde droit vers la caméra avec une forte expression de \\[surprise, peur, colère\\], visage centré dans la moitié haute. Fond simple, sans détails, dans \\[couleur de la série\\]. Laisse une grande zone vide au centre de la moitié basse pour un titre. \\[Style\\]. Sans texte ni logo. Tu ajoutes ensuite le titre et le numéro d'épisode dans CapCut ou Canva, toujours avec la même police et au même endroit, et tu restes au centre de l'image, loin des bords.\n\n### D. Les accroches des trois premières secondes\n\nLes blogs spécialisés décrivent trois grandes formules d'accroche (OpusClip, officieux). Elles viennent de vidéos de conseils, pas de fiction. Voici comment je les adapte à une série :\n\n| Formule des blogs | Principe | Version fiction pour ta série |\n| --- | --- | --- |\n| Rupture (pattern interrupt) | Un mouvement, une image ou une phrase inattendue qui casse le défilement | Ouvrir en pleine action, sans explication : le garçon court dans le couloir, une porte claque. |\n| Question | Créer un manque d'information que le cerveau veut combler | Une réplique qui pose une question : « Qui a laissé cette lettre sous ma porte ? » |\n| Promesse | Annoncer ce que le public va obtenir | Annoncer l'enjeu : « Ce soir, l'une d'elles va trahir les autres. » |\n\nD'autres techniques d'ouverture propres à la fiction, à tester (ma méthode, pas une source) :\n\n- **Le saut en avant.** Montre 2 secondes du moment le plus fort de l'épisode, puis « 3 heures plus tôt », et raconte depuis le début.\n- **La réponse au cliffhanger.** Pour l'épisode 2 et les suivants, ouvre sur la dernière image de l'épisode précédent et donne la réponse, ou une partie, dans les 3 premières secondes.\n- **L'anomalie visuelle.** Un détail qui cloche dans une image normale : une chaise qui bouge seule, un personnage qui porte les vêtements d'un autre.\n\n**Comment savoir si ton accroche marche.** Dans les statistiques de ta vidéo, regarde combien de personnes regardent encore après 3 secondes. Un blog propose 60 % comme seuil : en dessous, change d'accroche (officieux, ce n'est pas une norme officielle). Change une seule chose à la fois pour savoir ce qui a marché. TikTok, dans ses conseils officiels pour les publicités, rappelle aussi que l'essentiel de l'effet se joue dans les 6 premières secondes.\n\n**Prompt pour trouver des accroches.**\n\n```\n<task>\nPropose 6 accroches de 3 secondes pour l'épisode [numéro] de ma série.\n<\/task>\n\n<context>\nRésumé de l'épisode : [colle]. Cliffhanger de l'épisode précédent : [colle]. Personnages : [colle les fiches].\n<\/context>\n\n<constraints>\n2 accroches par formule : rupture en pleine action, question posée par une réplique, promesse de l'enjeu. Chaque accroche tient en une image et au plus une réplique de 10 mots. Pas de fausse promesse : l'épisode doit répondre à l'accroche.\n<\/constraints>\n\n<output_format>\nUn tableau : formule, ce qu'on voit, réplique ou texte à l'écran, prompt image en anglais.\n<\/output_format>\n```\n\n**Sources consultées le 30 septembre 2026.** Officielles : [YouTube, nouvelles miniatures dans YouTube Studio (24 juillet 2026)](https://blog.youtube/news-and-events/youtube-studio-custom-thumbnail-updates/) · [TikTok For Business, bonnes pratiques créatives](https://ads.tiktok.com/business/en-US/blog/creative-best-practices-top-performing-ads). Officieuses : [OpusClip, sous-titres des Shorts](https://www.opus.pro/blog/youtube-shorts-caption-subtitle-best-practices) · [OpusClip, formules d'accroche](https://www.opus.pro/blog/youtube-shorts-hook-formulas) · [Kreatli, zone sûre TikTok](https://kreatli.com/guides/tiktok-safe-zone) · [Miraflow, couvertures TikTok](https://miraflow.ai/blog/tiktok-cover-image-strategy-2026-profile-grid-convert). Les adaptations à la fiction et les deux prompts sont de moi."}, {"id": "aM", "n": "M", "title": "Annexe M. Cours gratuits en français pour aller plus loin", "phase": 5, "sum": "Ces cours sont généraux : ils t'aident à comprendre l'IA et la monétisation, pas à utiliser un outil vidéo précis. Pour l'outil, les guides officiels...", "md": "Ces cours sont généraux : ils t'aident à comprendre l'IA et la monétisation, pas à utiliser un outil vidéo précis. Pour l'outil, les guides officiels ci-dessus restent la meilleure source. Chaque page a été ouverte le 30 septembre 2026.\n\n| Cours | Organisme | Durée | Prix | Ce que tu y apprends |\n| --- | --- | --- | --- | --- |\n| [Monétisation pour créateurs de contenu](https://novasavo.com/course/monetisation-pour-createurs-de-contenu) | NovaSavo | 12 heures environ | Cours gratuit, certificat payant (55 $) que tu n'es pas obligée d'acheter | Construire une audience, monétisation des plateformes, affiliation, partenariats, produits numériques, abonnements, fiscalité |\n| [Formation gratuite sur l'IA générative](https://www.data-bird.co/cours-gratuit/gen-ai) | DataBird | 1 h 30 | Gratuit, inscription requise | Vocabulaire de l'IA, prompts, création de documents, prompts pour générer des images |\n| [Formations IA de Google (Grow with Google)](https://grow.google/intl/be-fr/ai-trainings/) | Google | Par exemple 10 heures pour « Principes essentiels de l'IA » | Gratuit, certificat partageable | Bases de l'IA, introduction à l'IA générative. C'est la page belge en français : l'offre peut différer en France |\n\nLa liste de formations IA gratuites de [Jedha](https://www.jedha.co/formation-ia/formation-ia-gratuite) cite aussi Elements of AI, Objectif IA (environ 6 heures, initiative publique) et FunMOOC, que je n'ai pas ouverts un par un. Pour la monétisation, vérifie toujours les conditions dans les pages officielles de chaque plateforme : un cours général peut être en retard sur les règles de TikTok ou de YouTube."}, {"id": "aN", "n": "N", "title": "Annexe N. Ce que les bibliothèques de prompts sur GitHub apportent", "phase": 5, "sum": "GitHub est un site où des développeurs et des créateurs partagent des fichiers. On y trouve des « listes » de prompts et de ressources sur la vidéo...", "md": "GitHub est un site où des développeurs et des créateurs partagent des fichiers. On y trouve des « listes » de prompts et de ressources sur la vidéo IA. J'en ai lu cinq en détail le 30 septembre 2026. Voici ce qu'elles valent, et ce qu'on en garde pour ta méthode.\n\n### Ce que valent ces bibliothèques\n\n| Dépôt | Ce qu'on y trouve vraiment | Utile pour toi ? |\n| --- | --- | --- |\n| [geekjourneyx/awesome-ai-video-prompts](https://github.com/geekjourneyx/awesome-ai-video-prompts) | Un sommaire prometteur (modèles, caméra, son, guides officiels), mais les pages sont vides : « contenu à compléter » | Non, pour l'instant |\n| [cliprise/awesome-ai-video-generator-prompts](https://github.com/cliprise/awesome-ai-video-generator-prompts) | Une formule de prompt claire, des modèles par usage, une checklist avant génération. C'est aussi une vitrine publicitaire pour un site payant | Oui, pour la méthode |\n| [WaveSpeedAI/awesome-kling-api](https://github.com/WaveSpeedAI/awesome-kling-api) | Des prompts de la communauté écrits en format structuré (JSON), presque tous publicitaires avec des marques connues. Vitrine pour une offre payante | Oui pour la forme, jamais pour le contenu |\n| [Fourques/awesome-ai-video](https://github.com/Fourques/awesome-ai-video) | Une liste à jour des outils vidéo et image, avec les nouveautés | Oui, pour la veille des outils |\n| ViMax, AIDrama Studio et autres « générateurs de micro-dramas » | Des chaînes entièrement automatisées pour développeurs (installation sur ordinateur, accès payants aux IA) | Non en l'état, mais leurs étapes confirment celles de ce guide |\n\n**Deux mises en garde.** Ne recopie jamais un prompt qui contient une marque, un logo ou un personnage connu : plusieurs exemples de ces bibliothèques en sont pleins. Et n'installe rien depuis GitHub : certains projets sont recopiés sous plusieurs comptes inconnus, ce qui sert parfois à diffuser des logiciels piégés. On lit, on s'inspire, on n'exécute rien.\n\n### A. La formule en six lignes\n\nC'est la formule la plus claire trouvée dans ces bibliothèques. Elle sépare bien ce qui bouge et ce qui doit rester fixe, ce qui manque souvent aux prompts de débutants.\n\n```\nA [durée]-second vertical 9:16 video of [personnage] doing [action claire] in [lieu].\nCamera: [mouvement, angle, cadrage].\nLighting: [lumière].\nStyle: [PHRASE DE STYLE de ma série].\nMotion: [ce qui bouge, à quelle vitesse, et ce qui reste immobile].\nRestrictions: [ce qu'il faut éviter, 3 ou 4 éléments maximum].\n```\n\nExemple pour une série :\n\n```\nA 6-second vertical 9:16 video of an 8-year-old boy in a light blue sweater slowly opening a small white door in a bedroom wall at night.\nCamera: slow push in, eye level, medium shot.\nLighting: cold moonlight and a small yellow night light.\nStyle: [PHRASE DE STYLE de ma série].\nMotion: the door opens slowly, the boy leans forward; the room and the furniture stay perfectly still.\nRestrictions: no text, no extra people, no face distortion.\n```\n\nTraduction : une vidéo verticale de 6 secondes d'un garçon de 8 ans en pull bleu ciel qui ouvre lentement une petite porte blanche dans le mur d'une chambre, la nuit. Caméra : lent travelling avant, à hauteur des yeux, plan moyen. Lumière : clair de lune froid et petite veilleuse jaune. Mouvement : la porte s'ouvre lentement, le garçon se penche ; la pièce et les meubles restent parfaitement immobiles. Restrictions : pas de texte, pas de personne en plus, pas de visage déformé.\n\n**Version image vers vidéo** (quand tu joins l'image du plan) :\n\n```\nUsing the provided image as the exact visual reference, create a [durée]-second video where [personnage] stays exactly the same while [mouvement]. Camera: [mouvement]. Restrictions: preserve identity, preserve clothes and colors, avoid distortion, no text.\n```\n\n### B. Les prompts structurés en JSON\n\nDans la communauté, beaucoup de créateurs écrivent leurs prompts vidéo sous forme de fiche à champs, dans un format appelé JSON (des accolades, des guillemets, un nom de champ puis sa valeur). L'outil lit ces champs comme du texte. L'avantage : chaque information est bien rangée, rien n'est oublié, et on change un champ sans réécrire tout le prompt.\n\n**À savoir honnêtement** : aucun guide officiel que j'ai lu (Google, Runway, Kling, OpenAI) ne dit que le JSON donne de meilleurs résultats que des phrases. C'est une pratique de la communauté. Teste les deux sur le même plan et garde ce qui marche le mieux dans ton outil.\n\nModèle adapté à un plan de série :\n\n```\n{\n  \"duration\": \"8 seconds\",\n  \"format\": \"vertical 9:16\",\n  \"scene\": \"[lieu, moment de la journée]\",\n  \"characters\": \"[description fixe du ou des personnages]\",\n  \"action\": \"[ce qui se passe, dans l'ordre]\",\n  \"camera\": \"[cadrage et mouvement]\",\n  \"lighting\": \"[lumière]\",\n  \"style\": \"[PHRASE DE STYLE de ma série]\",\n  \"dialogue\": \"0:02 [personnage] (whispering): \\\"[réplique]\\\"\",\n  \"audio\": \"[bruitages et ambiance]\",\n  \"subtitles\": \"off\",\n  \"text_on_screen\": \"none\",\n  \"avoid\": \"extra people, face distortion, logos\"\n}\n```\n\nDeux champs de ce modèle règlent des problèmes fréquents : `\"subtitles\": \"off\"` demande à l'outil de ne pas incruster de sous-titres (tu les ajoutes au montage), et le minutage dans `\"dialogue\"` place la réplique au bon moment du clip. Ce format est aussi celui qui se remplit le plus facilement de façon automatique, à partir d'un formulaire ou d'un tableur.\n\n### C. Texte vers vidéo ou image vers vidéo : la règle simple\n\n| Utilise le texte vers vidéo quand | Utilise l'image vers vidéo quand |\n| --- | --- |\n| Tu explores une idée ou une ambiance | Un personnage récurrent doit rester identique |\n| L'apparence exacte n'a pas d'importance | Tu as déjà une image de plan validée |\n| Tu cherches une surprise créative | Un objet ou un décor doit rester le même d'un plan à l'autre |\n\nPour une série, la règle est donc presque toujours l'image vers vidéo. Le texte vers vidéo sert aux essais d'ambiance et aux plans sans personnage (un ciel, une rue vide).\n\n### D. La checklist avant de générer\n\nDouze questions à se poser avant de dépenser un crédit (traduites et adaptées de la bibliothèque Cliprise) :\n\n- [ ] Le sujet est-il précis (qui, avec quelle apparence) ?\n- [ ] L'action est-elle claire et unique ?\n- [ ] Le mouvement de caméra est-il réaliste et simple ?\n- [ ] La lumière est-elle définie ?\n- [ ] La phrase de style est-elle présente ?\n- [ ] La durée est-elle indiquée ?\n- [ ] Le format 9:16 est-il indiqué ou choisi dans l'outil ?\n- [ ] Les restrictions sont-elles là, sans en mettre trop ?\n- [ ] Ce qui doit rester identique (visage, vêtements, décor) est-il dit clairement ?\n- [ ] Le prompt est-il surchargé (plusieurs actions, plusieurs mouvements) ?\n- [ ] L'image vers vidéo serait-elle plus sûre que le texte vers vidéo ?\n- [ ] Ai-je prévu de garder le prompt s'il marche (carnet de production) ?\n\n### E. Générer des variantes utiles\n\nPour les plans importants (l'accroche, la révélation, le cliffhanger), génère deux ou trois versions volontairement différentes plutôt que trois fois la même : un plan serré, un plan large, une version plus calme. Au montage, tu choisis celle qui sert le mieux le rythme. Pour les plans secondaires, une seule version suffit : garde tes crédits.\n\n### F. Les restrictions : peu, mais bien choisies\n\nLes bibliothèques recommandent de ne pas empiler les interdits. Choisis 3 ou 4 éléments selon le plan, dans cette liste : `no text`, `no extra people`, `no face distortion`, `no extra fingers`, `no flicker`, `no warped furniture`, `no logo`. Rappel : Google conseille plutôt de décrire ce que tu veux (« an empty street » plutôt que « no cars »), voir l'annexe G.\n\n### G. Les nouveautés des outils repérées dans ces listes\n\n- **Seedance 2.5** (ByteDance, sorti le 31 juillet 2026, d'après la [page officielle](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5)) : jusqu'à 30 secondes par génération, prolongeable en plusieurs fois en gardant les personnages et les décors, jusqu'à 30 images, 10 vidéos et 10 sons de référence, et des voix de plusieurs personnages gardées stables. La page officielle le dit disponible sur des applications chinoises (Jimeng, Doubao), l'accès international arrivant plus tard : vérifie avant de compter dessus.\n- **Des références minutées** : Seedance comme Veo encouragent à découper le clip par secondes (0 à 3 s, 3 à 6 s…) et à citer chaque image jointe par un nom (@Image1).\n- **D'autres nouveautés annoncées par la liste Fourques, non vérifiées sur les sites officiels** : des pinceaux de mouvement chez Runway (on peint la zone qui doit bouger), une piste audio partagée entre plusieurs plans chez Kling 3.0, et Veo 3.1 utilisable aussi dans l'application Gemini.\n\n### H. Une idée reprise des chaînes automatisées\n\nLes outils automatiques pour développeurs commencent tous par la même étape : ils lisent le script et en extraient la liste des personnages, des lieux, des objets et des plans. Tu peux faire la même chose à la main avec ton assistant, juste après avoir écrit un épisode :\n\n```\n<task>\nLis le script de mon épisode et fais-en l'inventaire de production.\n<\/task>\n\n<context>\nScript : [colle-le]. Bible : [colle le résumé et les fiches].\n<\/context>\n\n<output_format>\nQuatre listes : 1) personnages présents, avec les scènes où ils apparaissent ; 2) lieux, avec l'heure de la journée ; 3) objets importants à créer en image à part ; 4) éléments qui n'existent pas encore dans ma bible (nouveau personnage, nouveau lieu, nouvel objet). Termine par le nombre de plans probable.\n<\/output_format>\n```\n\nCe prompt t'évite de découvrir en plein tournage qu'il te manque l'image d'un objet ou d'un lieu.\n\n**Sources consultées le 30 septembre 2026.** [geekjourneyx/awesome-ai-video-prompts](https://github.com/geekjourneyx/awesome-ai-video-prompts) · [cliprise/awesome-ai-video-generator-prompts](https://github.com/cliprise/awesome-ai-video-generator-prompts) · [WaveSpeedAI/awesome-kling-api](https://github.com/WaveSpeedAI/awesome-kling-api) · [Fourques/awesome-ai-video](https://github.com/Fourques/awesome-ai-video) · [HKUDS/ViMax](https://github.com/hkuds/vimax) · [EvoLinkAI/ai-short-drama](https://github.com/EvoLinkAI/ai-short-drama) · [Seedance 2.5, page officielle](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5). Les exemples de prompts sont mes adaptations à une série animée."}, {"id": "sources", "n": "S", "title": "Sources consultées et date de vérification", "phase": 5, "sum": "Toutes les vérifications de ce guide datent du 29 septembre 2026. Les prix, les crédits, les seuils et les règles des plateformes changent souvent :...", "md": "Toutes les vérifications de ce guide datent du **29 septembre 2026**. Les prix, les crédits, les seuils et les règles des plateformes changent souvent : reprends chaque chiffre important sur la page officielle avant de payer ou de t'organiser autour de lui.\n\n### Note sur la déclaration des revenus (information générale)\n\nDès que ta série te rapporte de l'argent (monétisation, sponsoring, ventes), ces revenus sont à déclarer en France. Selon ta situation, cela passe le plus souvent par un statut d'indépendante (par exemple la micro-entreprise, qui se déclare via le guichet unique des formalités d'entreprises) ou par la déclaration de revenus annexes. La nature du revenu (bénéfices non commerciaux ou industriels et commerciaux), les cotisations et les seuils dépendent de ton cas. **Vérifie sur le site officiel de l'URSSAF et des impôts, ou demande à un professionnel**, avant ta première rémunération. Ne mets pas cette démarche de côté : elle protège ton activité.\n\n### Informations moins sûres, à confirmer\n\n| Sujet | Pourquoi c'est incertain |\n| --- | --- |\n| Conditions du programme de rémunération TikTok | Pages officielles bloquées à la lecture : sourc S.ctx = function () { return "Ma série : " + kp(2) + "\nStyle visuel (phrase fixe) : " + S.sty() + "\n"; };
function has(v) { return String(v || "").trim().length > 0; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
var tt = 0;
function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3000); }
function copyText(text, el, msg) {
  function ok() { toast(msg || "Copié."); }
  function fb() {
    var done = false;
    try { if (el.select) { el.focus(); el.select(); el.setSelectionRange(0, text.length); } else { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } done = document.execCommand("copy"); } catch (e) {}
    toast(done ? (msg || "Copié.") : "Texte sélectionné : appuie longuement dessus puis choisis Copier.");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
}
function chap(id) { return GUIDE.filter(function (c) { return c.id === id; })[0]; }
function chIndex(id) { for (var i = 0; i < GUIDE.length; i++) if (GUIDE[i].id === id) return i; return -1; }

/* ---------- mini rendu du texte du guide ---------- */
function inline(s) {
  s = esc(s);
  var codes = [];
  s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {
    if (u.charAt(0) === "#") { var id = LINKMAP[u.slice(1)]; return id ? '<a href="#" class="ilink" data-ch="' + id + '">' + t + '</a>' : t; }
    if (/^https?:\/\//.test(u)) return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
    return t;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + codes[+i] + "</code>"; });
}
function cellsOf(r) { return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); }); }
function tableHtml(rows) {
  var head = cellsOf(rows[0]), sep = rows[1] && /^\|?\s*:?-{2,}/.test(rows[1]), body = rows.slice(sep ? 2 : 1), h = '<div class="tw"><table><thead><tr>';
  head.forEach(function (c) { h += "<th>" + inline(c) + "</th>"; });
  h += "</tr></thead><tbody>";
  body.forEach(function (r) { h += "<tr>" + cellsOf(r).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; });
  return h + "</tbody></table></div>";
}
function listHtml(lines) {
  var items = [], pos = 0;
  lines.forEach(function (l) {
    var m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(l);
    if (m) items.push({ ind: m[1].length, ord: /\d/.test(m[2]), t: m[3] }); else if (items.length) items[items.length - 1].t += " " + l.trim();
  });
  function level(ind) {
    var tag = items[pos].ord ? "ol" : "ul", h = "<" + tag + ">";
    while (pos < items.length && items[pos].ind >= ind) {
      var it = items[pos];
      if (it.ind > ind) { h += "<li>" + level(it.ind) + "</li>"; continue; }
      pos++; h += "<li>" + inline(it.t);
      if (pos < items.length && items[pos].ind > ind) h += level(items[pos].ind);
      h += "</li>";
    }
    return h + "</" + tag + ">";
  }
  return level(items[0].ind);
}
function md(src) {
  var L = src.split("\n"), out = [], i = 0, m;
  while (i < L.length) {
    var ln = L[i];
    if (/^```/.test(ln)) { var b = []; i++; while (i < L.length && !/^```/.test(L[i])) { b.push(L[i]); i++; } i++; out.push('<div class="code"><button type="button" class="copy" data-act="copycode">Copier</button><pre><code>' + esc(b.join("\n")) + '</code></pre></div>'); continue; }
    if (/^\s*$/.test(ln)) { i++; continue; }
    if ((m = /^(#{2,4})\s+(.*)$/.exec(ln))) { out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
    if (/^---+\s*$/.test(ln)) { out.push("<hr>"); i++; continue; }
    if (/^>/.test(ln)) { var q = []; while (i < L.length && /^>/.test(L[i])) { q.push(L[i].replace(/^>\s?/, "")); i++; } out.push("<blockquote>" + md(q.join("\n")) + "</blockquote>"); continue; }
    if (/^\|/.test(ln)) { var t = []; while (i < L.length && /^\|/.test(L[i])) { t.push(L[i]); i++; } out.push(tableHtml(t)); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(ln)) { var li = []; while (i < L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && li.length))) { li.push(L[i]); i++; } out.push(listHtml(li)); continue; }
    var p = [];
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^(```|#{2,4}\s|>|\||---+\s*$)/.test(L[i]) && !/^\s*([-*]|\d+\.)\s+/.test(L[i])) { p.push(L[i]); i++; }
    if (!p.length) { p.push(ln); i++; }
    out.push("<p>" + inline(p.join(" ")) + "</p>");
  }
  return out.join("\n");
}

/* ---------- logique des prompts ---------- */
function answers(n) { var st = STEPS[n - 1], a = S.ans[n] || [], o = []; for (var i = 0; i < st.q.length; i++) o.push((a[i] || "").trim()); return o; }
function active(n, i) { var q = STEPS[n - 1].q[i]; return !q.when || q.when(answers(n)); }
function missing(n) {
  var st = STEPS[n - 1], a = answers(n), q = [], c = [];
  st.q.forEach(function (x, i) { if (active(n, i) && !a[i]) q.push("question " + (i + 1)); });
  (REQ[n] || []).forEach(function (k) { if (!has(k === "style" ? S.style : S[k])) c.push(CTXNAME[k]); });
  return { q: q, c: c };
}
function tidy(t) { return t.replace(/^Mes règles tirées de la veille : *\n/m, ""); }
function ensuiteText(s) { return s.replace(/« Ce que je retiens »( plus bas)?/g, "« Ma série » (onglet en bas)").replace(/ avec le bouton plus bas/, ""); }
function serieCount() { return [S.style, S.concept, S.bible].filter(has).length; }

/* ---------- navigation ---------- */
var $v = document.getElementById("view");
function go(tab) { R.tab = tab; R.type = 0; R.ch = null; R.chs = []; render(); window.scrollTo(0, 0); }
function openType(n) { R.tab = "create"; R.type = n; R.ch = null; R.chs = []; R.copied = false; render(); window.scrollTo(0, 0); }
function openChapter(id, keep) { if (R.ch && keep) R.chs.push(R.ch); else if (!keep) R.chs = R.ch ? R.chs : []; R.ch = id; render(); window.scrollTo(0, 0); }
function closeChapter() { R.ch = R.chs.length ? R.chs.pop() : null; render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll(".dock button").forEach(function (b) { if (b.getAttribute("data-tab") === R.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (R.ch) return renderReader();
  if (R.tab === "create") return R.type ? renderType() : renderCreate();
  if (R.tab === "serie") return renderSerie();
  renderGuide();
}

/* ---------- Créer : accueil ---------- */
function renderCreate() {
  var done = serieCount(), h = '<header class="hero"><span class="kicker">Atelier Série</span><h1>Que veux-tu créer aujourd\'hui ?</h1>' +
    '<p class="muted">Choisis une tâche. Réponds à quelques questions, copie le prompt, colle-le dans Gemini.</p></header>';
  if (done < 3) {
    h += '<div class="glass banner"><b>Commence par Ma série</b><p class="small muted">' + done + ' sur 3 éléments de départ remplis : ton style, ton concept et tes descriptions fixes. Les prompts s\'en servent pour que tout reste cohérent.</p>' +
      '<div class="bar"><i style="width:' + Math.round(done / 3 * 100) + '%"></i></div><button type="button" class="btn big" data-act="tab" data-v="serie">Remplir Ma série</button></div>';
  }
  GROUPS.forEach(function (g) {
    h += '<section class="group"><h2>' + esc(g.name) + '</h2><div class="tiles">';
    g.items.forEach(function (n) {
      var t = TYPES[n - 1];
      h += '<button type="button" class="glass tile" data-act="type" data-v="' + n + '"><span class="num">' + n + '</span><b>' + esc(t.t) + '</b><span class="d">' + esc(t.d) + '</span></button>';
    });
    h += '</div></section>';
  });
  $v.innerHTML = h;
}

/* ---------- Créer : une tâche ---------- */
function renderType() {
  var n = R.type, st = STEPS[n - 1], t = TYPES[n - 1];
  if (!S.ans[n]) S.ans[n] = [];
  var h = '<button type="button" class="back" data-act="home">‹ Toutes les tâches</button>' +
    '<header class="hero"><span class="kicker">Tâche ' + n + ' sur 14</span><h1>' + esc(t.t) + '</h1></header>' +
    '<div class="pills" id="pills"></div>' +
    '<div class="glass card"><h3>Ce que tu fais</h3><p>' + esc(st.fais) + '</p></div>' +
    '<div class="warnbox"><h3>Erreur à éviter</h3><p>' + esc(st.erreur) + '</p></div>';
  if (t.tip) h += '<div class="glass card"><h3>Bon à savoir</h3><p>' + esc(t.tip) + '</p></div>';
  h += '<section class="glass card"><h2>1. Tes réponses</h2>';
  st.q.forEach(function (q, i) {
    if (!active(n, i)) return;
    h += '<div class="fld"><label class="q" for="q' + i + '">' + esc(q.l) + (q.h ? '<span class="q-hint">' + esc(q.h) + '</span>' : '') + '</label>';
    if (q.t === "choice") h += '<div class="chips" role="group" aria-label="' + esc(q.l) + '">' + q.o.map(function (o) { return '<button type="button" class="chip" data-act="choose" data-q="' + i + '" data-v="' + esc(o) + '" aria-pressed="' + (S.ans[n][i] === o) + '">' + esc(o) + '</button>'; }).join("") + '</div>';
    else if (q.t === "line") h += '<input type="text" id="q' + i + '" data-q="' + i + '" autocomplete="off" value="' + esc(S.ans[n][i] || "") + '">';
    else h += '<textarea id="q' + i + '" data-q="' + i + '">' + esc(S.ans[n][i] || "") + '</textarea>';
    h += '</div>';
  });
  h += '</section><section class="glass card"><h2>2. Ton prompt</h2><div id="pwrap"></div></section>' +
    '<section class="glass card"><h2>3. Ensuite</h2><ol class="ens">' + st.ensuite.filter(function (x) { return x.indexOf("J'ai terminé") < 0; }).map(function (x) { return '<li>' + esc(ensuiteText(x)) + '</li>'; }).join("") + '</ol></section>' +
    '<section class="stack"><h2>Dans le guide</h2><p class="small muted">Tout ce qu\'il faut savoir sur cette tâche : les outils, les prix, les pas à pas.</p><div class="list">' +
    t.ch.map(function (id) { var c = chap(id); return c ? chRow(c) : ""; }).join("") + '</div></section>' +
    '<button type="button" class="btn ghost big" data-act="clear">Vider les réponses de cette tâche</button>';
  $v.innerHTML = h;
  updateType();
}
function updateType() {
  var n = R.type, st = STEPS[n - 1], m = missing(n), w = document.getElementById("pwrap"), ready = !m.q.length && !m.c.length;
  if (!w) return;
  var p = document.getElementById("pills");
  var s1 = ready ? "ok" : "on", s2 = ready ? (R.copied ? "ok" : "on") : "", s3 = R.copied ? "on" : "";
  p.innerHTML = '<div class="pill ' + s1 + '"><i>1</i>Réponds</div><div class="pill ' + s2 + '"><i>2</i>Copie</div><div class="pill ' + s3 + '"><i>3</i>Colle dans Gemini</div>';
  if (!ready) {
    var msg = "";
    if (m.q.length) msg += "Réponds à : <b>" + esc(m.q.join(", ")) + "</b>. ";
    if (m.c.length) msg += "Il manque dans <b>Ma série</b> : <b>" + esc(m.c.join(", ")) + "</b>.";
    w.innerHTML = '<div class="miss">Ton prompt apparaît dès que tout est rempli. ' + msg + '</div>' + (m.c.length ? '<button type="button" class="btn ghost big" style="margin-top:10px" data-act="tab" data-v="serie">Aller dans Ma série</button>' : '');
    return;
  }
  var text = tidy(st.prompt(answers(n), kp, S)), ta = w.querySelector("textarea");
  if (!ta) {
    w.innerHTML = '<div class="glass promptbox"><textarea id="ptext" readonly aria-label="Prompt à copier"></textarea></div>' +
      '<div class="stack" style="margin-top:10px"><button type="button" class="btn big" data-act="copy">Copier le prompt</button><a class="btn ghost big" href="' + GEMINI_URL + '" target="_blank" rel="noopener">Ouvrir Gemini</a></div>';
    ta = document.getElementById("ptext");
  }
  if (ta.value !== text) ta.value = text;
  ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 4, 520) + "px";
}

/* ---------- Ma série ---------- */
function fieldHtml(f) {
  return '<div class="fld"><label class="q" for="f-' + f.k + '"><span class="tick" id="t-' + f.k + '">✓</span>' + esc(f.label) + '<span class="q-hint">' + esc(f.hint) + '</span></label>' +
    '<textarea id="f-' + f.k + '" data-k="' + f.k + '" style="min-height:' + (f.rows * 24 + 36) + 'px">' + esc(S[f.k]) + '</textarea>' +
    (f.from ? '<button type="button" class="linkbtn" data-act="type" data-v="' + f.from + '">Pas encore ? Fais la tâche « ' + esc(TYPES[f.from - 1].t) + ' »</button>' : '') + '</div>';
}
function renderSerie() {
  var h = '<header class="hero"><span class="kicker">Une seule fois par série</span><h1>Ma série</h1><p class="muted">Remplis ces cases une fois. Les prompts s\'en servent tout seuls, et tout reste sur cet appareil.</p></header>' +
    '<div class="glass banner"><b id="sp-t"></b><div class="bar"><i id="sp-b"></i></div></div>' +
    '<section class="glass card"><h2><span class="tick" id="t-style">✓</span>Mon style visuel</h2><p class="small muted">Un seul style pour toute la série. Touche une fiche pour la lire et la choisir.</p><div class="stygrid">' +
    STYLES.map(function (s) { return '<button type="button" class="sty" data-act="style" data-v="' + s.id + '" aria-pressed="' + (S.style === s.id) + '"><b>' + esc(s.nom) + '</b><span class="diff">' + esc(s.diff) + '</span></button>'; }).join("") +
    '</div><div id="sty-info" class="small"></div></section>' +
    '<section class="glass card"><h2>Les éléments de départ</h2>' + SERIE_CORE.map(fieldHtml).join("") + '</section>' +
    '<section class="glass card"><h2>Ce qui change à chaque épisode</h2>' + SERIE_EP.map(fieldHtml).join("") + '</section>';
  $v.innerHTML = h;
  updateSerie();
}
function updateSerie() {
  var c = serieCount(), t = document.getElementById("sp-t");
  if (!t) return;
  t.textContent = c === 3 ? "Les 3 éléments de départ sont remplis" : c + " sur 3 éléments de départ remplis";
  document.getElementById("sp-b").style.width = Math.round(c / 3 * 100) + "%";
  ["style", "concept", "bible", "regles", "prev", "script", "board"].forEach(function (k) { var e = document.getElementById("t-" + k); if (e) e.className = "tick" + (has(k === "style" ? S.style : S[k]) ? " on" : ""); });
  var s = STYLES.filter(function (x) { return x.id === S.style; })[0], i = document.getElementById("sty-info");
  i.innerHTML = s ? '<b>' + esc(s.nom) + '</b> (difficulté : ' + esc(s.diff.toLowerCase()) + ')<br>' + esc(s.voit) + '<br><span class="muted">Idéal pour : ' + esc(s.ideal) + '</span>' : '<span class="muted">Aucun style choisi pour l\'instant.</span>';
  document.querySelectorAll(".sty").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-v") === S.style ? "true" : "false"); });
}

/* ---------- Guide ---------- */
function chRow(c) {
  return '<button type="button" class="glass chrow" data-act="chapter" data-v="' + c.id + '"><span class="n">' + esc(c.n) + '</span><span class="t"><b>' + esc(c.title.replace(/^\d+\.\s*/, "").replace(/^Annexe [A-N]\.\s*/, "")) + '</b><span>' + esc(c.sum) + '</span></span></button>';
}
var INDEX = null;
function renderGuide() {
  var h = '<header class="hero"><span class="kicker">Le guide complet</span><h1>Tout est ici</h1><p class="muted">Les ' + GUIDE.length + ' sections du guide, avec les outils, les prix, les pas à pas et tous les prompts.</p></header>' +
    '<div><label class="q" for="gq" style="margin-bottom:6px">Chercher dans le guide</label><input type="search" id="gq" placeholder="Exemple : ElevenLabs, budget, TikTok" autocomplete="off" value="' + esc(R.q) + '"></div>' +
    '<div class="chips scrollrow">' + SHORTCUTS.map(function (s) { return '<button type="button" class="chip small" data-act="chapter" data-v="' + s[0] + '">' + esc(s[1]) + '</button>'; }).join("") + '</div>' +
    '<div id="gres" class="stack"></div>';
  $v.innerHTML = h;
  guideList();
}
function guideList() {
  var box = document.getElementById("gres"), q = R.q.trim();
  if (!box) return;
  if (!q) {
    var h = "";
    PHASES.forEach(function (name, pi) {
      var items = GUIDE.filter(function (c) { return c.phase === pi; });
      h += '<details class="phase"' + (pi === 0 ? " open" : "") + '><summary>' + esc(name) + ' (' + items.length + ')</summary><div class="list">' + items.map(chRow).join("") + '</div></details>';
    });
    box.innerHTML = h; return;
  }
  if (!INDEX) INDEX = GUIDE.map(function (c) { return norm(c.title + " \n " + c.md); });
  var terms = norm(q).split(/\s+/).filter(Boolean), res = [];
  GUIDE.forEach(function (c, i) {
    var x = INDEX[i], all = terms.every(function (t) { return x.indexOf(t) >= 0; });
    if (!all) return;
    var at = x.indexOf(terms[0]), from = Math.max(0, at - 50), snip = (c.title + " \n " + c.md).slice(from, from + 150).replace(/[#*`|>\n]+/g, " ").trim();
    var inTitle = terms.some(function (t) { return norm(c.title).indexOf(t) >= 0; }) ? 1000 : 0, count = 0;
    terms.forEach(function (t) { count += x.split(t).length - 1; });
    res.push({ c: c, snip: snip, score: -(inTitle + count) });
  });
  res.sort(function (a, b) { return a.score - b.score; });
  if (!res.length) { box.innerHTML = '<div class="glass card"><b>Aucun résultat</b><p class="small muted">Essaie un mot plus court ou sans faute.</p></div>'; return; }
  box.innerHTML = '<p class="small muted">' + res.length + ' section' + (res.length > 1 ? 's' : '') + ' trouvée' + (res.length > 1 ? 's' : '') + '</p><div class="list">' + res.slice(0, 30).map(function (r) {
    return '<button type="button" class="glass chrow" data-act="chapter" data-v="' + r.c.id + '"><span class="n">' + esc(r.c.n) + '</span><span class="t"><b>' + esc(r.c.title) + '</b><span>…' + esc(r.snip) + '…</span></span></button>';
  }).join("") + '</div>';
}
function renderReader() {
  var c = chap(R.ch), i = chIndex(R.ch), prev = GUIDE[i - 1], next = GUIDE[i + 1];
  var h = '<button type="button" class="back" data-act="closech">‹ Retour</button>' +
    '<article class="glass reader stack"><span class="kicker">' + esc(PHASES[c.phase]) + '</span><h1>' + esc(c.title) + '</h1><div class="md">' + md(c.md) + '</div></article>' +
    '<div class="pager">' + (prev ? '<button type="button" class="btn ghost" data-act="goch" data-v="' + prev.id + '">‹ Précédent</button>' : '') + (next ? '<button type="button" class="btn ghost" data-act="goch" data-v="' + next.id + '">Suivant ›</button>' : '') + '</div>';
  $v.innerHTML = h;
}

/* ---------- événements ---------- */
$v.addEventListener("click", function (e) {
  var il = e.target.closest(".ilink");
  if (il) { e.preventDefault(); openChapter(il.getAttribute("data-ch"), true); return; }
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var a = b.getAttribute("data-act"), v = b.getAttribute("data-v");
  if (a === "tab") go(v);
  else if (a === "type") openType(+v);
  else if (a === "home") go("create");
  else if (a === "chapter") openChapter(v, true);
  else if (a === "goch") { R.ch = v; render(); window.scrollTo(0, 0); }
  else if (a === "closech") closeChapter();
  else if (a === "style") { S.style = v; save(); updateSerie(); toast("Style choisi : " + STYLES.filter(function (s) { return s.id === v; })[0].nom + "."); }
  else if (a === "choose") { S.ans[R.type][+b.getAttribute("data-q")] = v; R.copied = false; save(); renderType(); }
  else if (a === "copy") { var t = document.getElementById("ptext"); copyText(t.value, t, "Prompt copié. Colle-le dans Gemini."); R.copied = true; updateType(); }
  else if (a === "copycode") { var pre = b.parentNode.querySelector("pre"); copyText(pre.textContent, pre, "Prompt copié."); }
  else if (a === "clear") { S.ans[R.type] = []; R.copied = false; save(); renderType(); toast("Réponses vidées. Ma série est gardée."); }
});
$v.addEventListener("input", function (e) {
  var el = e.target;
  if (el.hasAttribute("data-q")) { S.ans[R.type][+el.getAttribute("data-q")] = el.value; R.copied = false; save(); updateType(); }
  else if (el.hasAttribute("data-k")) { S[el.getAttribute("data-k")] = el.value; save(); updateSerie(); }
  else if (el.id === "gq") { R.q = el.value; guideList(); }
});
document.querySelectorAll(".dock button").forEach(function (b) { b.addEventListener("click", function () { go(b.getAttribute("data-tab")); }); });

load();
render();
if (memOnly) setTimeout(function () { toast("Ce navigateur ne garde pas tes données entre deux visites."); }, 600);
</script>
