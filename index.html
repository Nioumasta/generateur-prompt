ch, [description de la voix]: \"[réplique]\". Soft ambience. No music.\n```\n\nTraduction : \\[Personnage\\] regarde la caméra et parle, les lèvres synchronisées avec les mots. Gros plan fixe. Son : dit en français, \\[voix\\] : « \\[réplique\\] ». Ambiance douce. Pas de musique.\n\n**14. Profil de voix**\n\n```\nCrée un profil de voix pour le personnage [nom, rôle, caractère]. Donne : âge fictif, hauteur, débit, énergie, articulation, tic de langage, émotion dominante, et une description de 25 mots en français pour un outil de création de voix. Ne demande l'imitation d'aucune personne réelle.\n```\n\n**15. Brief musical**\n\n```\nJe crée une série de fiction animée dans le style [ton style]. Ambiance : [ambiance]. Donne 5 mots-clés de recherche en anglais pour trouver de la musique libre de droits, la durée idéale, le tempo approximatif et les instruments. Ne cite aucun titre ni artiste réel.\n```\n\n**16. Plan sonore**\n\n```\nVoici le storyboard de mon épisode [colle-le]. Crée un tableau : numéro de plan, moment exact, bruitage nécessaire, mots-clés de recherche en anglais, volume relatif. Limite-toi à 12 bruitages et ajoute une ambiance continue.\n```\n\n### E. Montage et publication\n\n**17. Plan de montage**\n\n```\nVoici le storyboard et la durée de chaque clip [colle-les]. Crée un plan de montage CapCut : ordre, durée conservée, moment des coupes, bruitages, sous-titres, et un point de tension à la moitié. Objectif : vidéo verticale de 70 à 90 secondes.\n```\n\n**18. Découpage des sous-titres**\n\n```\nVoici les dialogues de mon épisode [colle-les]. Découpe-les en sous-titres de 2 lignes maximum, 35 caractères par ligne maximum. Indique le mot à mettre en couleur. Ne modifie pas le sens.\n```\n\n**19. Hooks**\n\n```\nVoici le résumé de mon épisode [colle-le] et son moment le plus fort [décris-le]. Propose 5 hooks de 3 secondes maximum : phrase parlée, texte à l'écran, image d'ouverture en anglais. Fidèles à l'épisode. Classe-les.\n```\n\n**20. Cliffhangers**\n\n```\nVoici l'arc de ma saison [colle-le] et le résumé de l'épisode [colle-le]. Propose 5 cliffhangers de 5 secondes maximum, chacun dans une forme différente, avec la dernière image, la dernière phrase, et la réponse dans l'épisode suivant.\n```\n\n**21. Descriptions de publication (toutes plateformes)**\n\n```\nRédige pour l'épisode [numéro] [résumé] : 3 descriptions TikTok, 3 titres YouTube Shorts (60 caractères maximum), 3 légendes Instagram, 3 descriptions Facebook. Chaque texte contient la mention « Série de fiction créée avec l'IA », 3 à 5 hashtags, et aucune promesse trompeuse.\n```\n\n### F. Contrôle, analyse et budget\n\n**22. Contrôle d'originalité**\n\n```\nVoici la fiche de mon personnage [colle-la]. Dis-moi quels éléments ressemblent trop à un personnage, une marque ou une série existante que tu connais, et propose des modifications. Précise que tu n'es pas juriste.\n```\n\n**23. Audit anti-contenu répétitif**\n\n```\nVoici les résumés de mes 10 derniers épisodes [colle-les]. Analyse-les comme un examinateur YouTube : risque de contenu répétitif ? Liste les ressemblances et propose 5 changements pour montrer plus de travail créatif. Sois franc.\n```\n\n**24. Lecture des statistiques**\n\n```\nVoici mon tableau de statistiques [colle-le]. Quels épisodes marchent le mieux et pourquoi ? Quelle est ma plus grosse fuite d'audience ? Propose 3 expériences, un seul paramètre à la fois. Dis-moi si les données sont insuffisantes.\n```\n\n**25. Coût par épisode**\n\n```\nVoici mes données du mois [abonnements, épisodes finis, crédits dépensés, heures]. Calcule le coût par épisode en argent et en heures, le nombre moyen d'essais par plan, et propose 3 changements pour réduire ce coût de 30 %. Montre ton calcul.\n```\n\n**26. Audit de mes erreurs**\n\n```\nVoici mon processus actuel [décris-le], mes outils, mon rythme et mes statistiques. Fais l'audit de mes erreurs probables (conception, production, publication, juridique, budget), classe-les de la plus grave à la moins grave, et dis-moi celle à traiter cette semaine.\n```\n\n**27. Message à une marque**\n\n```\nRédige un message de prospection de 120 mots maximum pour proposer un partenariat à la marque [nom]. Ma série : [description], créée avec l'IA, [nombre] vues moyennes par épisode (chiffre réel). Propose un placement dans un épisode et indique que la collaboration sera signalée conformément à la loi.\n```\n\n**À sauvegarder.** Cette section entière, copiée dans un document personnel, avec tes propres versions améliorées.\n\n**Si un prompt ne donne pas ce que tu veux.**\n\n- Relis-le : as-tu vraiment remplacé tous les crochets ?\n- Joins tes références maîtresses si c'est un prompt d'image.\n- Ne change qu'un mot ou une phrase à la fois.\n- Si le résultat reste mauvais après 3 essais, simplifie : moins d'éléments dans la scène, un seul personnage, un décor plus simple."}, {"id": "aA", "n": "A", "title": "Annexe A. Le style de ta série : à choisir d'abord", "phase": 5, "sum": "Ce guide fonctionne avec n'importe quel style de personnage et de rendu. Sur TikTok, les comptes IA en utilisent des dizaines : humains en 3D, fruits...", "md": "Ce guide fonctionne avec n'importe quel style de personnage et de rendu. Sur TikTok, les comptes IA en utilisent des dizaines : humains en 3D, fruits humanisés, poupées à grosse tête, personnages dont la tête est un objet (une claquette, un doigt), créatures hybrides, animaux, dessin animé plat, stop motion, images de caméscope ancien, et bien d'autres. Aucun n'est obligatoire et aucun n'est meilleur par nature. L'important est d'en choisir **un seul** par série et de le garder identique d'un épisode à l'autre.\n\nDans ce guide, les exemples et les prompts prennent la 3D semi-réaliste (proportions humaines, éclairage doux) comme **style d'exemple**, parce qu'il fallait un exemple concret. **Quand tu vois la phrase « semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16 » dans un prompt, remplace-la par la phrase de style de ton choix** (tableau « Choisir son style » plus bas). Le reste du prompt ne change pas.\n\n| Famille de personnage | Comment la reconnaître | Exemple |\n| --- | --- | --- |\n| Humain ordinaire | Visage, corps et vêtements humains, avec un signe distinctif simple (pull bleu, coiffure) | Un petit garçon aux cheveux bruns et au pull bleu qui vit des mini-mystères chez lui |\n| Peau de fruit | Visage humain complet, peau colorée et texturée comme le fruit | Madame Pomme : femme mûre à la peau rouge pomme brillante |\n| Tête de fruit | Corps humain, tête en forme de fruit avec tige ou feuille, yeux et bouche expressifs | Cerise : jeune femme à la tête de cerise, longue queue de cheval |\n| Tête d'objet | Corps de personnage, tête remplacée par un objet du quotidien (claquette, doigt, tasse) avec yeux et bouche | Un personnage à tête de claquette qui gère une cantine (exemple à inventer) |\n| Poupée ou jouet | Grosse tête, yeux brillants, peau de plastique lisse, tenue de poupée, look jouet | Une poupée à grosse tête qui vit dans une maison de poupée |\n| Animal ou bébé humanisé | Corps et gestes humains, tête d'animal ou visage de bébé, tenue du quotidien | Un chat détective en imperméable, un bébé qui gère la maison |\n| Créature hybride | Mélange absurde d'un animal et d'un objet ou d'un aliment | Un poisson à jambes qui porte un cartable (à inventer) |\n\n**Les règles de ce style.**\n\n- Un signe distinctif par personnage, reconnaissable en une seconde : une couleur dominante et un détail (pull bleu, tige de cerise, coiffure, texture de peau).\n- Corps, mains, vêtements et décors réalistes et cohérents d'un plan à l'autre. C'est ce qui donne l'impression d'une vraie série.\n- Deux personnages par image : c'est une règle de prudence pour débuter, pas une limite officielle. Les outils acceptent plus de références (Runway jusqu'à 3, Nano Banana jusqu'à 14 images d'objets ou de personnages), mais plus tu en ajoutes, plus les visages et les détails ont tendance à dériver. Commence à deux, puis teste trois.\n- L'histoire fait revenir le public, pas le style : chaque épisode a un conflit, une révélation et une fin qui donne envie de la suite.\n\n**Ce qu'il faut éviter, même si d'autres comptes le font.**\n\n- **Copier une série connue** : ni ses personnages, ni son nom, ni ses épisodes. Ce format a déjà vu des épisodes retirés après signalements (section 1).\n- **Mettre une marque ou un personnage existant sur un vêtement ou dans le décor.** Sur l'une de tes captures, un personnage porte un t-shirt à l'effigie d'un personnage de dessin animé très connu : c'est un risque de droits d'auteur (section 33). Demande toujours « plain clothing, no logo, no brand ».\n- **Des tenues très dénudées ou des corps mis en scène de façon suggestive.** Plusieurs comptes le font pour attirer le regard, mais les plateformes peuvent limiter la portée ou retirer ces vidéos, et les marques et les programmes de monétisation s'en éloignent. Choisis des tenues de la vie quotidienne.\n- **Caricaturer un groupe de personnes ou une personne réelle** à travers la couleur de peau ou les traits des personnages.\n\nLe bandeau « Contient des médias générés par IA » visible sur tes captures est le réglage d'étiquetage de TikTok. Tu dois toi aussi l'activer (section 32)."}, {"id": "aB", "n": "B", "title": "Annexe B. Tous les styles possibles et comment choisir", "phase": 5, "sum": "Aucun style n'est prioritaire. Choisis celui qui te plaît et qui reste cohérent d'une image à l'autre. Pour changer de style, remplace seulement la...", "md": "Aucun style n'est prioritaire. Choisis celui qui te plaît et qui reste cohérent d'une image à l'autre. Pour changer de style, remplace seulement la phrase de style (section 6) par l'une de celles du tableau et garde le reste du prompt. Ne change jamais de style en cours de série : le public reconnaît un personnage à son rendu.\n\n| Style | Ce qu'on voit | Phrase de style à copier | Difficulté |\n| --- | --- | --- | --- |\n| **3D semi-réaliste** | Humains, enfants, fruits ou animaux humanisés, lumière douce, décors réels | `semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16` | Moyenne : demande de bonnes images maîtresses |\n| 3D enfant, look film familial | Grands yeux, peau lisse, intérieurs chauds | `stylized 3D animated family film look, large expressive eyes, warm cozy interior, vertical 9:16` | Moyenne |\n| 2D cartoon plat | Aplats de couleur, contours épais | `flat 2D cartoon illustration, bold outlines, bright colors, simple shapes` | Facile |\n| Anime ou manga (chibi, kawaii) | Traits fins, grands yeux | `anime style illustration, clean line art, expressive eyes` | Moyenne : évite les personnages d'animes connus |\n| Livre pour enfants (aquarelle) | Pastel, textures de papier | `children's storybook watercolor illustration, soft pastel palette` | Facile |\n| Stop motion, pâte à modeler | Textures faites main, décor miniature | `claymation stop-motion look, handmade textures, tabletop miniature scene` | Moyenne |\n| BD ou webtoon animé | Cases fixes, petits mouvements de caméra | `comic book panel illustration, halftone shading, empty speech bubbles` | Facile (le moins cher) |\n| Pixel art rétro | Jeu vidéo 16 bits | `16-bit pixel art scene, limited color palette` | Facile |\n| Objets animés à visage | Nourriture, jouets, voitures qui parlent | `3D animated household object with a simple expressive face, soft lighting` | Facile |\n| Réaliste cinéma | Visages et décors quasi réels | `cinematic photorealistic, 35mm film look, shallow depth of field` | Difficile et sensible : étiquette IA très visible, jamais de vraie personne |\n\n**Autres styles et effets vus en veille.**\n\n- **Poupée ou jouet** : tête plus grosse que le corps, yeux brillants, peau de plastique. Phrase de style : `stylized 3D toy doll character, oversized head, glossy plastic skin, big shiny eyes, soft studio lighting`. Ne reproduis pas une marque de poupées existante.\n- **Tête d'objet** : `3D animated character with a [object] instead of a head, expressive eyes and mouth on the object, human body, everyday clothes`. Remplace \\[object\\] par claquette, doigt, tasse, etc.\n- **Caméscope ancien** : `1980s VHS camcorder footage, date stamp, grainy, faded colors`.\n- **Squish et élastique (ASMR)** : `glossy silicone, squished and stretched by hands, close macro, ASMR`.\n- **Figurine sous emballage ou miniature dans une paume** : `collectible action figure in a toy box, studio turntable` ou `tiny chibi figure standing in a giant palm`.\n- **Animal ou bébé debout qui parle** : `pet standing upright, speaking to camera`.\n\nCertaines tendances partent d'une photo de personne réelle. N'utilise que tes propres photos ou des personnages inventés, jamais la photo d'une autre personne sans son accord, et jamais celle d'un enfant.\n\n**Choisir ton style en 6 étapes.**\n\n1. Fais ta veille : repère 10 comptes et note pour chacun la famille de personnage, le style et le format.\n2. Envoie 3 captures de chaque compte à une IA avec le prompt du lexique plus bas.\n3. Garde 2 ou 3 styles qui te plaisent.\n4. Génère la même scène simple (un personnage debout dans une cuisine) dans chaque style.\n5. Garde le style qui reste le plus cohérent sur 5 images de suite.\n6. Note sa phrase de style dans ta bible de série (section 6) et ne la change plus.\n\n**Les genres d'histoires.**\n\n- **Mystère ou frisson du quotidien** : phénomènes étranges à la maison, secrets, séries en « partie 1, 2, 3 ».\n- **Drame de famille ou de couple** : secrets, trahisons, belle-famille, voisinage.\n- **Justice ou vengeance** : un personnage injustement traité s'en sort intelligemment.\n- **École et rentrée** : premières fois, amitiés, sujets sensibles traités avec douceur.\n- **Comédie** : gags courts avec un décor et des voisins qui reviennent.\n- **Romance**, **contes et fables** (avec une morale), **aventure**, **horreur douce**, **éducatif**, **motivation** (une leçon de vie racontée par un personnage).\n\n**Les façons de raconter.**\n\n- **Texte à l'écran sans voix** : le moins cher, aucun crédit vocal, très courant sur les comptes que tu as montrés.\n- **Voix off unique** avec une voix IA.\n- **Dialogues** avec plusieurs voix et synchronisation des lèvres : plus coûteux et plus long.\n- **Musique seule** pour les ambiances et les contes.\n\n**Une combinaison simple pour débuter.** Un style choisi, un héros unique, un mystère ou un drame du quotidien, du texte à l'écran, et des séries en trois parties. C'est la combinaison la plus économe (aucun crédit de voix) et la plus simple à rendre cohérente. Le style reste ton choix.\n\nExemple de description fixe d'un héros enfant (à garder identique dans tous tes prompts) :\n\n```\nA 6-year-old boy, short messy dark brown hair, large brown eyes, light blue knit sweater, beige trousers, small white sneakers, plain clothing, no logo, no brand, no printed text, semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16\n```\n\n**Trois points de vigilance pour la monétisation.**\n\n- **Héros enfant** : un personnage enfant n'est pas automatiquement un contenu « conçu pour les enfants », mais YouTube te demande de le préciser pour chaque vidéo. Ce statut désactive les commentaires et limite les publicités personnalisées, donc les revenus. Vérifie la règle en vigueur dans YouTube Studio.\n- **Sujets sensibles** : reste léger quand le héros est un enfant. Pas de violence, pas de maltraitance, pas de mineur en danger. Les plateformes sont très strictes sur ce point.\n- **Contenu répétitif** : YouTube peut refuser la monétisation de vidéos en série trop identiques (politique sur le contenu non authentique, à vérifier sur la page à jour). Varie les scènes, les décors et les scripts."}, {"id": "aC", "n": "C", "title": "Annexe C. Lexique des styles et des formats", "phase": 5, "sum": "Si tu ne connais pas les mots, tu ne peux pas décrire ce que tu vois ni le demander à l'IA. Ce lexique réunit les termes que les créateurs et les...", "md": "Si tu ne connais pas les mots, tu ne peux pas décrire ce que tu vois ni le demander à l'IA. Ce lexique réunit les termes que les créateurs et les outils utilisent. Il vient de guides d'outils vidéo IA, de Wikipédia et de Dexerto, consultés le 29 septembre 2026. Les performances annoncées par ces guides ne sont pas vérifiées : prends-les comme des idées, pas comme des promesses.\n\n**Les formats : la façon de raconter.**\n\n| Terme | Ce que c'est |\n| --- | --- |\n| Micro-drama (micro-série verticale) | Épisodes de 1 à 2 minutes, souvent 20 à 100 épisodes, un rebondissement toutes les 30 secondes environ et un cliffhanger à la fin de chaque épisode. C'est le format le plus proche de ce guide. |\n| Cliffhanger | La fin d'un épisode coupée au moment le plus tendu, pour donner envie de voir la suite. |\n| Story time | Une histoire complète racontée du début à la fin : un début, un retournement, une résolution. |\n| POV (point of view) | Le spectateur est dans la scène, en première personne. Exemple : « Mes parents m'ont menti. » |\n| Série numérotée | Une même histoire coupée en « Partie 1, Partie 2, Partie 3 ». |\n| Personnage récurrent | Le même héros revient dans chaque épisode. C'est ce qui fidélise. |\n| Animal point of view | L'histoire est racontée du point de vue d'un animal. |\n| Fausse bande-annonce | « Et si tel univers était une série ? » présenté comme une bande-annonce. |\n| What if | Un scénario hypothétique poussé jusqu'au bout. |\n| Formats de liste | Top 5 countdown, tier list (classement de S à F), ranking, VS (duel), this or that, would you rather, streak (faits en rafale). |\n| Bedtime story et sleep story | Histoire douce avec une morale, ou histoire lente pour s'endormir. |\n| Fairy tale remix et myth retelling | Un conte ou un mythe dont on change un détail important. |\n| Faceless | Chaîne sans personne réelle à l'écran : images IA, voix ou texte. C'est le mot générique de ce guide. |\n| UGC (user generated content) | Faux témoignage de client filmé en selfie, souvent dans les publicités. |\n\n**Les tendances IA que tu verras en veille.**\n\n- **AI slop** : nom souvent négatif donné au contenu IA produit en masse. Ce n'est pas un style, c'est l'étiquette que certains spectateurs collent. Des histoires variées et soignées te protègent de cette image.\n- **Fruits humanisés en émission de télé-réalité** : une série de ce type a dépassé 300 millions de vues en quelques jours en mars 2026, puis des épisodes ont été retirés par TikTok. Prends l'idée du format, jamais la série.\n- **Italian brainrot** : créatures absurdes qui mélangent un animal et un objet, avec une voix italienne synthétique. Deux studios se disputent les droits de certains personnages, ce qui montre que la propriété d'un personnage IA est encore floue.\n- **AI ASMR (glass fruit)** : un couteau qui coupe des fruits en verre, des textures satisfaisantes, des scènes de lave.\n- **Bébés qui jouent un podcast** : tendance de mai 2025, pas une série, un effet répété.\n- **Vlog d'un personnage de franchise** : je te le déconseille, ce sont des personnages protégés.\n\n**Les mots du look : à écrire dans le prompt.**\n\n| Famille | Terme | Ce qu'on voit | Mots à mettre dans le prompt |\n| --- | --- | --- | --- |\n| 3D | 3D stylisée façon film d'animation familial | Grands yeux, peau lisse, lumière douce | `3D animated character, smooth 3D, soft cinematic lighting, subsurface scattering` |\n| 3D | 3D semi-réaliste (style d'exemple du guide) | Proportions humaines, rendu plus réaliste | `semi-realistic stylized 3D animated character, human proportions` |\n| 3D | Low poly, voxel | Facettes géométriques ou petits cubes | `low poly 3D`, `voxel art` |\n| 3D | Isométrique, diorama | Vue fixe à 30 degrés, scène miniature | `isometric view, diorama` |\n| Matière | Claymation, stop motion | Pâte à modeler, traces de doigts | `claymation, plasticine texture, miniature set` |\n| Matière | Cutout, silhouette | Papier découpé, ombres contrastées | `paper cutout, silhouette, duotone` |\n| 2D | Dessin animé plat | Aplats de couleur, contours épais | `flat 2D cartoon, bold outlines` |\n| 2D | Anime, manga, kawaii | Traits fins, grands yeux | `anime style, cel shaded, kawaii` |\n| 2D | BD, webcomic | Cases, trames de points | `comic book style, halftone dots` |\n| Peinture | Aquarelle, huile | Pastel ou coups de pinceau | `watercolor, paper texture` |\n| Réaliste | Photoréaliste, cinema still | Image quasi réelle, image de film | `photorealistic, 35mm film, shallow depth of field, anamorphic lens` |\n| Ambiance | Cyberpunk, dark gothic, rétro | Néons, lieux sombres, années 80 | `cyberpunk neon city`, `dark gothic`, `retro 80s` |\n\nRègle importante : n'écris jamais de nom de studio, de film ou de personnage connu dans un prompt. Décris le rendu avec les mots du tableau à la place.\n\n**Comment décrire un compte que tu admires (méthode du novice).** Fais une capture d'écran de ses vidéos, envoie-la à une IA (Claude ou ChatGPT) et colle ce prompt :\n\n```\nVoici des captures d'un compte de vidéos IA. Décris pour moi : 1) le format (micro-série, story time, POV, etc.), 2) le style visuel avec les mots exacts que les créateurs utilisent, 3) une phrase de style en anglais à copier dans un prompt d'image, sans nom de studio ni de personnage connu, 4) les défauts à éviter pour ne pas copier ce compte.\n```\n\n**Six combinaisons prêtes à l'emploi.**\n\n| Combinaison | Format | Style | Phrase de style | Coût et difficulté |\n| --- | --- | --- | --- | --- |\n| 1. Le mystère du quotidien | Micro-série POV en 3 parties | 3D semi-réaliste | `semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16` | Faible : texte à l'écran, pas de voix |\n| 2. Le drame de voisinage | Micro-drama avec cliffhanger | 3D semi-réaliste, adultes ou fruits humanisés | même phrase | Moyen : dialogues et lèvres à synchroniser |\n| 3. Le conte du soir | Bedtime story | Livre pour enfants en aquarelle | `children's storybook watercolor illustration, soft pastel palette` | Faible : peu de mouvement |\n| 4. La série d'un animal | Animal point of view | 3D stylisée ou stop motion | `claymation stop-motion look, handmade textures` | Moyen |\n| 5. La BD animée | Story time ou horreur douce | Webcomic | `comic book panel illustration, halftone shading` | Faible : on anime très peu |\n| 6. Le classement | Tier list ou top 5 | 2D plat ou illustration | `flat 2D cartoon illustration, bold outlines, bright colors` | Faible |\n\nAvant de publier, garde ces trois réflexes : active l'étiquette « contenu généré par IA », varie les scènes d'un épisode à l'autre, et ne copie ni une série ni un personnage existant (section 33)."}, {"id": "aD", "n": "D", "title": "Annexe D. Catalogue image vers vidéo : genres, effets et mélanges", "phase": 5, "sum": "Les vidéos IA ne rentrent pas dans une seule case. Un même compte mélange un personnage, un style visuel, un format (la façon de raconter), un effet...", "md": "Les vidéos IA ne rentrent pas dans une seule case. Un même compte mélange un **personnage**, un **style visuel**, un **format** (la façon de raconter), un **effet** d'animation et une **ambiance**. Pense à un jeu de construction : tu choisis une brique dans chaque famille et tu les assembles.\n\n**La formule d'assemblage.** Personnage + style + format + effet + ambiance.\n\n- Exemple 1 : personnage à tête de claquette + style jouet 3D + micro-drama avec cliffhanger + gros plan sur le visage + cantine d'école.\n- Exemple 2 : poupée à grosse tête + images de caméscope des années 90 + story time + boucle courte + chambre d'enfant.\n- Exemple 3 : créature hybride + cinéma réaliste + scénario « et si » + voix off sérieuse + bureau.\n\nRègle simple : change **une seule brique à la fois** quand tu testes. Si tout change en même temps, tu ne sais plus ce qui marche.\n\n**Les effets d'animation prêts à l'emploi.** Des outils comme Pika, Kling ou Higgsfield proposent des effets qu'on applique à une image en un clic. Ils vont très vite à produire, mais ils font vite de la vidéo répétitive : utilise-les comme un accent dans un épisode, pas comme le cœur d'une série.\n\n| Effet | Ce que ça fait | Bon pour |\n| --- | --- | --- |\n| Squish | L'objet devient mou et se fait presser | ASMR, satisfaisant |\n| Melt, dissolve, vanish | L'objet fond, se dissout ou disparaît | Transitions, mode, scènes surréalistes |\n| Explode, crumble, particles | L'objet se désintègre en morceaux ou en particules | Fin d'une scène, effet spectaculaire |\n| Inflate, deflate | L'objet gonfle comme un ballon ou se dégonfle | Comique, pubs |\n| Crush | L'objet est écrasé par une presse | ASMR |\n| Cakeify | L'objet se coupe comme un gâteau, avec des couches à l'intérieur | Reveals d'objets, satisfaisant |\n| Levitate, floating | L'objet flotte et tourne lentement | Produits, ambiances magiques |\n| Clones | Des copies du personnage apparaissent | Scènes de foule, comédie |\n| Bullet time | Tout se fige et la caméra tourne autour | Moment fort d'une scène |\n| Earth zoom out | La caméra recule du sol jusqu'à l'espace | Ouverture ou clôture |\n| Retour dans le temps | Le personnage est placé dans une autre époque (années 90, enfance) | Nostalgie, séries de flash-back |\n| Comic, canvas | La scène prend l'aspect d'une BD ou d'un tableau | Changement de style ponctuel |\n\nJe ne recommande pas les effets violents (décapitation, explosion d'une personne) : les plateformes les limitent et ils font fuir les marques.\n\n**Les mélanges et les genres hybrides vus en veille.**\n\n- **Anime dans une scène réelle** : un personnage de style anime placé dans une vraie vidéo, avec une lumière assortie. Mots utiles : `live-action background, anime character, cel shading, matched lighting`.\n- **Objets qui parlent** : un objet du quotidien avec un visage humain expressif. Mots utiles : `photorealistic household object with an expressive human face, studio lighting`.\n- **Créatures hybrides absurdes** : animal plus objet ou aliment, avec un nom inventé et une voix synthétique. Invente les tiens, ne reprends pas ceux qui existent.\n- **Défauts d'IA volontaires** : mains à six doigts, visages qui fondent, utilisés comme humour. Le public doit comprendre que c'est voulu.\n- **Défilé de mode IA** : vêtements de créateur sur des corps impossibles, lumière latérale, ralenti.\n- **Scénario absurde filmé comme un documentaire** : un dauphin au bureau, traité avec sérieux.\n- **Clip musical complet** : chorégraphie, paroles et histoire générées à partir d'un script en plans.\n- **Boucles cosy (lo-fi)** : scène calme de 30 secondes qui se répète, pour l'ambiance ou le sommeil.\n- **Boucles narratives de 2 à 3 secondes** : une mini-histoire qui recommence parfaitement.\n- **Jeu d'acteur sur le visage** : micro-expressions en gros plan, très efficaces pour les histoires émotionnelles.\n- **Mémoire de série** : le personnage fait référence aux vidéos précédentes, ce qui crée une histoire continue.\n- **Montage « brainrot »** : écrans partagés, coupes très rapides (environ 0,8 seconde), sous-titres animés. C'est du montage, pas de la génération d'images.\n- **Personnage de collection en POV** : une figurine qui vit des situations inattendues. Invente ta figurine, ne copie pas une marque.\n- **Bébés qui dansent, enfant qui grandit en quelques secondes** : tendance très vue, mais elle repose souvent sur des photos d'enfants réels. Utilise seulement des personnages inventés.\n\n**Les personnages types (le lascar, la mamie, le beauf, etc.).** Beaucoup de comptes français jouent sur des personnages types du quotidien. Tu peux créer un personnage avec un caractère, une façon de parler, une tenue et des défauts attachants. Évite pourtant de te baser sur l'origine, la religion, le quartier ou le physique d'un groupe réel : c'est de la caricature, et les plateformes retirent les contenus jugés haineux ou discriminants. Crée plutôt **un individu inventé** (prénom, métier, qualité, défaut, phrase qu'il répète) qu'un « type ».\n\n**Prompt pour assembler ta combinaison.** Colle-le dans Claude ou ChatGPT après avoir rempli les crochets :\n\n```\nJe veux une série avec : personnage = [ex : personnage à tête de claquette], style = [ex : jouet 3D], format = [ex : micro-drama avec cliffhanger], effet = [ex : gros plan sur le visage], ambiance = [ex : cantine d'école]. Écris-moi : 1) une description fixe du personnage en anglais de 40 à 60 mots, 2) la phrase de style en anglais, 3) le prompt de la première image, 4) le prompt image vers vidéo de 5 secondes avec l'effet. Sans marque, sans logo, sans texte imprimé, sans nom de studio ni de personnage connu.\n```\n\n**Sources de ce catalogue** (consultées le 30 septembre 2026). Ce sont surtout des sites d'outils vidéo IA, qui vantent leurs propres effets : teste avant de payer.\n\n- [17 Viral AI Video Styles of 2026 (OpusClip)](https://www.opus.pro/blog/viral-ai-video-styles-2026)\n- [AI Video Styles Guide (LTX)](https://ltx.io/blog/ai-video-styles)\n- [Top Viral AI Video Trends (VidAU)](https://www.vidau.ai/all-viral-ai-video-trends-to-try-in-2026/)\n- [Top 6 Viral AI Video Effects (Vidguru)](https://www.vidguru.ai/blog/2026-top6-video-effects.html)\n- [Higgsfield Presets](https://higgsfield.ai/viral-presets)\n- [Pikaffects](https://pikaffects.org/)"}, {"id": "aE", "n": "E", "title": "Annexe E. Ce que disent les discussions et les rapports de 2026", "phase": 5, "sum": "Limites de cette veille. Reddit et les pages officielles de TikTok (règles du programme Creator Rewards) étaient inaccessibles au moment de la...", "md": "**Limites de cette veille.** Reddit et les pages officielles de TikTok (règles du programme Creator Rewards) étaient inaccessibles au moment de la recherche. Ce bloc repose sur un rapport chiffré (Kapwing, mai 2026), des articles de presse spécialisée, des retours de créateurs publiés sur des blogs et des forums d'entrepreneurs (Indie Hackers, Hacker News) et des analyses d'outils. Les chiffres de revenus donnés par les créateurs eux-mêmes ne sont pas vérifiés. Certains sites avancent aussi des chiffres très précis sans citer de source (par exemple sur la part de créateurs IA éligibles) : je ne les reprends pas.\n\n**1. Le marché est saturé sur certaines niches.** Kapwing a regardé 10 742 vidéos TikTok en mai 2026 et a suivi les 500 premières vidéos d'un nouveau compte : 59 % étaient du contenu IA de faible qualité (le rapport parle de « AI slop »), contre 21 % sur YouTube Shorts. La catégorie enfants monte à 57,4 %, et le mot-clé #cartoonkids à 97 % sur l'échantillon. Les catégories avec peu de contenu IA sont la mode (1,3 %), la musique (1,5 %) et le fitness (1,6 %). La définition de « slop » est celle de Kapwing (visuels IA évidents, ou compilations de faible qualité avec script et voix IA), donc prends ces pourcentages comme un ordre de grandeur.\n\n**2. Le public commence à rejeter l'IA de masse.** Des articles de presse en 2026 parlent de fatigue face au contenu IA et de demande de filtres. Conséquence pratique : une série qui ressemble à toutes les autres se noie, même si elle est bien faite. Ce qui se démarque : un personnage avec une personnalité, une histoire écrite avec soin, un univers reconnaissable, et une vraie conséquence à chaque épisode.\n\n**3. La monétisation TikTok pour l'IA est incertaine.** Les sources se contredisent, et je n'ai pas pu lire la page officielle :\n\n- Certaines disent qu'une vidéo IA peut rejoindre le programme Creator Rewards si elle est originale (critères cités : 10 000 abonnés, 100 000 vues sur 30 jours, vidéos d'au moins 60 secondes, 18 ans ou plus).\n- D'autres disent que le contenu entièrement généré par IA en est exclu, ou que les vidéos « peu transformées » sont refusées. Elles citent comme risque élevé les diaporamas d'images IA avec voix IA.\n- Des créateurs ont signalé en mai 2026 des exclusions du programme pour « contenu non original », même pour des contenus qu'ils disaient originaux, avec des appels rejetés en quelques heures. La procédure conseillée : faire appel depuis le tableau de bord, supprimer les vidéos signalées, publier trois nouvelles vidéos originales dans la semaine et attendre 30 jours.\n\n**4. L'étiquetage IA reste à faire.** Plusieurs sources disent que l'étiquette est obligatoire pour les personnes ou scènes réalistes, et pas pour les styles clairement artistiques (dessin animé, anime). Je te conseille de l'activer dans tous les cas : elle ne te coûte rien et te protège en cas de doute.\n\n**5. La cohérence bat la nouveauté.** Un guide d'outil affirme que maîtriser un format répétable marche mieux que suivre toutes les tendances. Les créateurs se plaignent surtout de la difficulté à garder le même personnage d'un épisode à l'autre, ce que le guide traite aux sections 6 et 16.\n\n**Ce que ça change pour toi.**\n\n- **Ne compte pas sur Creator Rewards** pour un compte 100 % IA : traite-le comme un bonus possible, pas comme ton revenu.\n- **Ajoute de l'humain dans chaque épisode** : un scénario écrit par toi, une voix que tu as choisie et retravaillée ou enregistrée, un montage soigné dans CapCut avec ton propre rythme. C'est ce que les sources appellent l'apport original.\n- **Évite les niches les plus saturées** (dessins animés pour enfants avec voix IA) ou fais-toi remarquer par un ton, un univers et un personnage que personne d'autre n'a.\n- **Prépare un plan B de revenus** : YouTube Shorts, Instagram, Facebook, liens d'affiliation, produits numériques. Un créateur cité sur Indie Hackers avance qu'un lien en bio avec un cadeau gratuit est la seule source de revenu disponible avant d'avoir des abonnés, mais ses chiffres sont déclaratifs.\n- **Traite les vidéos de plus d'une minute avec prudence** : elles sont exigées pour Creator Rewards, mais ce sont aussi celles qui sont le plus souvent signalées comme peu transformées.\n\n**Sources de cette veille** (consultées le 30 septembre 2026) :\n\n- [The TikTok AI Slop Report (Kapwing)](https://www.kapwing.com/resources/the-tiktok-ai-slop-report/)\n- [TikTok Shows 3x More AI Slop Than YouTube (Search Engine Journal)](https://www.searchenginejournal.com/tiktok-shows-3x-more-ai-slop-than-youtube-report-finds/579521/)\n- [Faceless AI TikTok playbook (Indie Hackers)](https://www.indiehackers.com/post/i-run-a-faceless-ai-tools-tiktok-just-shipped-the-playbook-with-the-actual-2026-monetization-stack-3-sourced-case-studies-6fe30c2f50)\n- [Can AI Videos Be Monetized on TikTok? 2026 Policy (MonetizedNow)](https://monetizednow.com/ai-tiktok-content-monetization)\n- [Can AI Generated Videos Get Monetised on TikTok in 2026? (Lilach Bullock)](https://www.lilachbullock.com/ai-generated-videos-monetised-tiktok/)\n- [What TikTok's AI monetization restrictions signal (Storrito)](https://storrito.com/resources/what-tiktoks-ai-monetization-restrictions-signal-for-creator-income/)\n- [TikTok Creator Rewards disqualification (Baller Alert, 6 mai 2026)](https://balleralert.com/tiktok-creator-rewards-disqualification/)\n- [Unoriginal content flag (Social Boost Digital, 24 mai 2026)](https://socialboostdigital.com/blog/tiktok-creator-rewards-unoriginal-content-flag)"}, {"id": "aF", "n": "F", "title": "Annexe F. Traduire un style connu en mots de prompt (poupée, espionnes 2D, banlieue 2D)", "phase": 5, "sum": "Beaucoup de comptes disent « style Barbie », « style Totally Spies » ou « style Lascars ». Ce sont des références de veille, pas des mots à écrire...", "md": "Beaucoup de comptes disent « style Barbie », « style Totally Spies » ou « style Lascars ». Ce sont des références de veille, pas des mots à écrire dans un prompt. Voici ce qu'elles désignent et comment décrire le même look avec tes propres mots.\n\n| Ce que tu vois ou entends | Ce que ça désigne | Mots à mettre dans le prompt (sans nom d'œuvre) |\n| --- | --- | --- |\n| « Style Barbie » | Esthétique de poupée mannequin : rose vif et pastel, peau lisse et brillante, cheveux très volumineux, yeux étincelants, décor de maison de poupée, parfois une boîte de jouet à fenêtre transparente | `glamorous fashion doll aesthetic, hot pink and pastel palette, glossy smooth skin, voluminous curls, sparkling eyes, dollhouse interior` ; pour la boîte : `generic toy box with a transparent window, no logo, no brand name, no printed text` |\n| « Style Totally Spies » | Dessin animé 2D du début des années 2000 : trois adolescentes espionnes en combinaisons de couleurs différentes, mélange d'action à l'américaine et de dessin d'inspiration japonaise, décors futuristes « Y2K » | `early 2000s Western teen spy cartoon look, anime-influenced 2D animation, bold clean outlines, glossy cel shading, big expressive eyes, colorful matching jumpsuits, Y2K retro-futuristic interior, saturated colors` |\n| « Style Lascars » | D'après mes connaissances, non vérifié ici : série d'animation française pour adultes, 2D plat, traits épais, personnages très caricaturaux dans un quartier populaire | `French adult animated comedy look, flat 2D, thick outlines, exaggerated expressive characters, apartment block courtyard setting` |\n| « Style poupée LOL » | D'après mes connaissances, non vérifié ici : poupées de collection à grosse tête, très brillantes et colorées | `collectible toy doll, oversized head, big glossy eyes, pastel glitter, kawaii, soft studio lighting` |\n| « Y2K » | Esthétique des années 2000 : plastique translucide, argent métallique, rose vif, textures brillantes | `Y2K aesthetic, translucent plastic, metallic silver and bright pink, glossy textures` |\n\n**Les règles à suivre avec ces styles.**\n\n- **Décrire un look n'est pas copier une œuvre.** Des traits épais, un rose vif ou une ambiance des années 2000 n'appartiennent à personne. En revanche, un personnage précis, son nom, son logo ou une poupée de marque peuvent être protégés. Ne génère jamais les héroïnes d'une série existante ni une poupée de marque. Invente tes propres héroïnes, avec chacune une couleur, un métier, une qualité et un défaut.\n- **N'écris jamais le nom d'une œuvre ou d'une marque** dans un prompt, un titre, une description ou un hashtag. Ce sont des marques déposées (le guide d'un outil sur le style poupée le rappelle lui-même).\n- **Tes personnages peuvent ne pas être protégés.** Un cabinet d'avocats américain (avril 2026) explique qu'un personnage créé uniquement par IA n'a pas de droit d'auteur aux États-Unis, faute d'auteur humain, et que rédiger un prompt ne suffit pas. Je n'ai pas vérifié le droit français. Pour te protéger, ajoute ta création propre (nom, histoire, dessins retravaillés, voix) et garde tes fichiers datés (section 46).\n- **Tenues des héroïnes jeunes** : combinaisons colorées, tenues de sport ou de tous les jours, jamais moulantes ni suggestives. C'est la même règle que dans le bloc sur le style.\n- **Le style « Lascars » repose sur la caricature d'un milieu.** Applique les conseils sur les personnages types : crée un individu inventé, pas un portrait d'un groupe réel.\n\n**Prompt pour créer tes propres héroïnes dans ce look.**\n\n```\nCrée 3 héroïnes originales pour une série, dans un look de dessin animé 2D d'espionnes des années 2000. Pour chacune : un prénom inventé, une couleur de combinaison différente, un métier de couverture, une qualité, un défaut et une phrase qu'elle répète. Écris pour chacune une description fixe en anglais de 40 à 60 mots, sans nom d'œuvre, sans marque, sans logo, sans texte imprimé, avec des tenues de tous les jours ou de sport.\n```\n\n**Sources** (consultées le 30 septembre 2026) : [Totally Spies! (Wikipedia)](https://en.wikipedia.org/wiki/Totally_Spies!), [AI Barbie Doll Filter, prompts et notes de marque (Nano Banana Pro)](https://nano-banana-pro.ai/blog/ai-barbie-doll-filter-free-prompts-guide), [Character Copyright Protection in the Age of Generative AI (Davis Wright Tremaine, 22 avril 2026)](https://www.dwt.com/insights/2026/04/character-copyright-protection-generative-ai)."}, {"id": "aG", "n": "G", "title": "Annexe G. Les techniques des guides officiels (Runway, Kling, Google)", "phase": 5, "sum": "Ces techniques viennent des guides gratuits publiés par les outils eux-mêmes, lus le 30 septembre 2026. Ils valorisent leur produit, mais leurs...", "md": "Ces techniques viennent des guides gratuits publiés par les outils eux-mêmes, lus le 30 septembre 2026. Ils valorisent leur produit, mais leurs conseils de prompts sont fiables. La page de documentation de Google sur les prompts vidéo n'a pas pu être lue en entier : j'ai utilisé à la place l'article de blog de Google sur Veo 3.1.\n\n**1. La formule d'un prompt image vers vidéo (Runway).** Comme l'image est déjà fournie, ne la décris pas : décris le **mouvement**. La structure conseillée est : la caméra \\[mouvement\\] pendant que le sujet \\[action\\], puis les détails. Les éléments possibles sont l'action du sujet, le mouvement de l'environnement, le mouvement de la caméra, le style et le rythme du mouvement, la direction et la vitesse. Tu n'as pas besoin de tout mettre : ce que tu ne précises pas, le modèle l'invente. Exemples adaptés à ta série :\n\n```\nThe camera slowly pushes in as the boy looks at the front door, his eyes widening.\nHandheld camera: the boy stands still while the light in the hallway flickers. Natural camera shake.\nThe camera slowly zooms out as the boy sits down on the sofa and picks up the remote.\n```\n\n**2. La formule de Google pour Veo 3.1.** Cinématographie + sujet + action + contexte + style et ambiance. Le vocabulaire utile :\n\n| Famille | Termes à utiliser |\n| --- | --- |\n| Mouvement de caméra | dolly shot (la caméra avance ou recule), tracking shot (elle suit le sujet), crane shot (elle monte ou descend), aerial view (vue aérienne), slow pan (panoramique lent), POV shot (vue du personnage) |\n| Composition | wide shot (plan large), close-up (gros plan), extreme close-up (très gros plan), low angle (contre-plongée), two-shot (deux personnages) |\n| Objectif et mise au point | shallow depth of field (arrière-plan flou), wide-angle lens (grand angle), soft focus (flou doux), macro lens (macro), deep focus (tout net) |\n\nExemple de prompt complet : `Medium shot, a young boy in a light blue sweater, staring at a television that turned on by itself, in a dim living room at night. The scene is lit by the blue light of the screen and a warm lamp in the corner. Semi-realistic stylized 3D animated character, soft cinematic lighting, vertical 9:16.`\n\n**3. Plusieurs plans dans un seul prompt (horodatage).** Google et Runway montrent qu'on peut découper un clip par secondes. Exemple pour un clip de 8 secondes :\n\n```\n[00:00-00:02] Wide shot of the boy standing in the hallway, the light flickering above him.\n[00:02-00:04] Close-up of the boy's face, eyes wide, holding his breath.\n[00:04-00:06] Over-the-shoulder shot of the front door slowly opening by itself.\n[00:06-00:08] Extreme close-up of the boy's eyes reflecting the light from the door. SFX: a soft creak.\n```\n\nD'après le guide de Google, les clips Veo 3.1 durent 4, 6 ou 8 secondes, en 720p ou 1080p, en 16:9 ou 9:16.\n\n**4. Dialogues et sons (Google).** Mets la parole entre guillemets (`A woman says, 'We have to leave now.'`), les bruitages après `SFX:` et le fond sonore après `Ambient noise:`. Utile si tu veux des voix générées avec la vidéo.\n\n**5. Image de début et image de fin, et images de référence (Google).** Deux fonctions utiles pour ta série. « First and last frame » : tu donnes une première image et une dernière image, et l'outil crée la transition entre les deux. « Ingredients to video » : tu fournis des images de référence (personnage, décor, objet, style) et l'outil garde le même aspect sur plusieurs plans. Le guide conseille de créer d'abord les images de référence du personnage et du décor, puis de réutiliser les mêmes pour chaque plan avec un prompt du type : `Using the provided images for the boy and the living room, create a medium shot of the boy sitting on the sofa. He looks at the television and whispers, 'Who turned it on?'`\n\n**6. Continuer une scène plus longtemps (Runway).** Avance la vidéo jusqu'à la fin, extrais la dernière image, et utilise-la comme point de départ d'un nouveau clip. Colle ensuite les deux clips dans CapCut.\n\n**7. Résoudre les problèmes courants (Runway).**\n\n| Problème | Solution |\n| --- | --- |\n| Le clip contient des coupures que tu n'as pas demandées | Enlève les mots qui suggèrent une transition et ajoute `Continuous, seamless shot` |\n| L'image contient du flou de mouvement ou une pose en plein mouvement, qui contredit ta demande | Refais l'image sans ces indices avant de l'animer |\n| La caméra bouge trop | Ajoute `The locked-off camera remains perfectly still.` et `Minimal subject motion only.` |\n| Tu veux une boucle | Ajoute `The camera must start and end on the exact same frame to create a perfect loop.` |\n\n**8. Garder le même personnage (Kling).** Le guide de Kling confirme la méthode de la section 6 :\n\n- **Description maître** : âge, genre, cheveux, yeux, teint, corpulence, dans un seul paragraphe que tu gardes.\n- **Toujours les mêmes mots** : si tu écris « shoulder-length brown hair », écris exactement cela dans chaque prompt, pas « brunette » ailleurs. Tiens un petit dictionnaire de tes mots.\n- **Toujours le même ordre** : personnage, puis action, puis décor, puis style et qualité.\n- **Précision** : « dark auburn hair » marche mieux que « red hair ». Précise la forme des yeux, la taille du nez, l'épaisseur des lèvres. Note les tenues et accessoires avec leurs couleurs. Décris la taille, la stature et la démarche.\n- **Attends-toi à 10 à 20 essais et 2 à 3 heures** pour fixer un personnage fiable la première fois.\n\nAttention aux prompts négatifs : Kling conseille de lister ce que tu ne veux pas (par exemple `no beard, no glasses`), alors que Google conseille de le formuler de façon descriptive (« a desolate landscape with no buildings or roads » plutôt que « no man-made structures »). Teste les deux dans ton outil. Les guides récents de Google, d'OpenAI et de Runway formulent tous les contraintes de façon positive (« change only the expression, keep everything else the same » plutôt qu'une liste d'interdits). Règle de ce guide : décris d'abord ce que tu veux, puis garde une courte contrainte finale du type « no text, no logo ».\n\n**9. Raconter en six étapes (Kling).** Adaptées à ta série :\n\n1. Fixe l'objectif et le format dès le début (par exemple 9:16 et 45 à 60 secondes), avec une phrase qui résume la promesse de l'épisode et une mesure de réussite (par exemple le taux de vision jusqu'à la fin).\n2. Rassemble tes références : une image de style (palette, lumière, textures) et les images maîtresses des personnages.\n3. Choisis la structure : problème puis solution, ou parcours de transformation. Pour un mystère du quotidien : mystère, enquête, révélation.\n4. Génère avec les bons réglages (30 images par seconde, synchronisation des lèvres si dialogues, images de référence) et écris des balises de structure dans ton plan : accroche, conflit, tournant, fin ouverte, avec les notes de caméra.\n5. Affine en 3 à 5 passes légères, compare plusieurs versions du même plan (graines différentes) et garde celle qui a le meilleur rythme.\n6. Termine en 1080p et 30 images par seconde, puis prépare les variantes pour chaque réseau.\n\n**10. Faire améliorer ton prompt par une IA (Google).** Google conseille de demander à son assistant IA d'enrichir un prompt simple avec un vocabulaire plus cinématographique. Prompt à copier :\n\n```\nVoici mon idée de plan : [décris le plan en une phrase]. Transforme-la en prompt image vers vidéo en anglais avec la formule : cinématographie + sujet + action + contexte + style et ambiance. Ajoute un mouvement de caméra simple, garde la description fixe de mon personnage telle quelle, et ne mets aucun nom de marque, de studio ou de personnage connu.\n```\n\n**Sources** (lues le 30 septembre 2026) : [Image to Video Prompting Guide (Runway)](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide), [AI Character Consistency Guide (Kling)](https://kling.ai/blog/ai-character-consistency-guide), [AI Video Storytelling Guide (Kling)](https://kling.ai/blog/kling-ai-video-storytelling-guide), [Ultimate prompting guide for Veo 3.1 (Google Cloud Blog)](https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1)."}, {"id": "aH", "n": "H", "title": "Annexe H. Les prompts des guides officiels et comment s'en servir", "phase": 5, "sum": "Cette partie rassemble les modèles de prompts publiés dans les guides officiels de Google (Veo 3.1, Gemini image, Nano Banana), de Runway (image vers...", "md": "Cette partie rassemble les modèles de prompts publiés dans les guides officiels de Google (Veo 3.1, Gemini image, Nano Banana), de Runway (image vers vidéo, Gen-4 References), de Kling et d'OpenAI (GPT Image). Ils sont adaptés à ton projet : les crochets \\[ \\] sont à remplacer, aucune marque n'y figure, et tu colles à la place de \\[PHRASE DE STYLE\\] la phrase de style de ta série. Tous les guides sont en anglais et les outils comprennent mieux l'anglais : garde les prompts en anglais, la traduction sert à comprendre. Guides consultés le 30 septembre 2026.\n\n**Deux idées communes à tous les guides.** D'abord, décris la scène comme on décrit une photo à quelqu'un, avec des phrases, pas une liste de mots isolés. Ensuite, dis à l'outil ce qui doit rester identique et ce qui doit changer : c'est la clé de la cohérence entre les plans.\n\n### A. Les prompts pour animer une image (image vers vidéo)\n\n**1. La formule de Google pour Veo 3.1.**\n\n```\n[Cinematography] + [Subject] + [Action] + [Context] + [Style & Ambiance]\n```\n\nÀ quoi ça sert : écrire un prompt complet en cinq blocs, dans cet ordre. Cinematography = le cadrage et le mouvement de caméra, Subject = qui est à l'écran, Action = ce qu'il fait, Context = le lieu et l'heure, Style & Ambiance = le look et l'atmosphère. Exemple appliqué :\n\n```\nMedium shot, slow push in. A boy in a blue sweater stands by a school locker and slowly turns his head toward the camera, then smiles. A bright school corridor, early morning. [PHRASE DE STYLE], soft warm light, calm mood.\n```\n\nTraduction : plan moyen, lent travelling avant. Un garçon en pull bleu se tient près d'un casier d'école, tourne lentement la tête vers la caméra, puis sourit. Un couloir d'école lumineux, tôt le matin. \\[Style\\], lumière douce et chaude, ambiance calme.\n\n**2. La structure de Runway pour l'image vers vidéo.**\n\n```\n[Camera motion]. [Subject motion].\n```\n\nÀ quoi ça sert : quand tu donnes déjà une image de départ, ne la décris pas : décris seulement ce qui bouge. Exemple :\n\n```\nSlow push in. The character blinks, then turns her head slightly to the left and smiles.\n```\n\nTraduction : lent travelling avant. Le personnage cligne des yeux, tourne légèrement la tête vers la gauche et sourit.\n\n**3. Les phrases de dépannage de Runway.** À ajouter à la fin d'un prompt quand le résultat pose un problème.\n\n- `Continuous, seamless shot` : pour éviter les coupes ou changements de plan non voulus dans le clip.\n- `The locked-off camera remains perfectly still.` : pour une caméra totalement fixe, quand elle bouge sans que tu l'aies demandé.\n- `Minimal subject motion only.` : quand le personnage s'agite trop ou se déforme.\n\n**4. Plusieurs plans dans un seul clip (horodatage).** Google et Runway montrent qu'on peut découper un clip par secondes. Utile pour tester une petite séquence sans générer trois clips. Exemple pour 8 secondes :\n\n```\n[00:00-00:03] Close-up of the character looking at a small box on the table, curious.\n[00:03-00:06] The character opens the box and her eyes widen in surprise.\n[00:06-00:08] Slow push in on her surprised face.\n[PHRASE DE STYLE], vertical 9:16.\n```\n\nTraduction : de 0 à 3 s, gros plan sur le personnage qui regarde une petite boîte, curieux. De 3 à 6 s, il ouvre la boîte et ses yeux s'écarquillent. De 6 à 8 s, lent travelling avant sur son visage surpris.\n\n**5. Dialogue et sons dans Veo 3.1.** Google indique de mettre les paroles entre guillemets, puis d'ajouter les bruitages avec `SFX:` et l'ambiance avec `Ambient noise:`.\n\n```\nThe girl looks at the camera and says: \"We have to leave before sunset.\" SFX: a door closing softly behind her. Ambient noise: distant market chatter.\n```\n\nTraduction : la fille regarde la caméra et dit : « Nous devons partir avant le coucher du soleil. » Bruitage : une porte qui se ferme doucement derrière elle. Ambiance : bavardage lointain de marché. Garde les répliques courtes : un clip fait 4, 6 ou 8 secondes.\n\n**6. Première et dernière image (First and Last Frame).** Tu donnes deux images : le début et la fin du clip, et l'outil invente le trajet entre les deux. Utile pour un changement précis : personnage qui passe de neutre à surpris, porte fermée puis ouverte, jour puis nuit. Prompt type :\n\n```\nSmooth transition from the first image to the last image. The character slowly turns and her expression changes from calm to surprised. Fixed camera.\n```\n\nTraduction : transition fluide de la première à la dernière image. Le personnage se tourne lentement et son expression passe du calme à la surprise. Caméra fixe.\n\n**7. Ingrédients vers vidéo (Ingredients to Video).** Tu donnes plusieurs images de référence (personnage, décor, objet) et un prompt qui dit comment les combiner. Utile pour garder le même personnage dans plusieurs décors sans passer par une image assemblée. Prompt type :\n\n```\nUsing the provided images of the character, the kitchen and the red teapot: the character walks to the table, picks up the teapot and pours tea. Medium shot, fixed camera. [PHRASE DE STYLE].\n```\n\nTraduction : avec les images fournies du personnage, de la cuisine et de la théière rouge : le personnage marche vers la table, prend la théière et verse le thé. Plan moyen, caméra fixe.\n\n**8. La méthode Kling pour la cohérence.** Kling conseille de rédiger une description maîtresse du personnage et de la recopier mot pour mot, dans le même ordre, dans tous les prompts. Compte 10 à 20 essais, soit 2 à 3 heures, pour trouver la bonne formulation d'un personnage. Kling accepte aussi une liste de ce que tu ne veux pas voir (negative prompt), par exemple :\n\n```\nNegative prompt: extra fingers, distorted face, blurry, text, watermark\n```\n\nTraduction : doigts en trop, visage déformé, flou, texte, filigrane. Google, lui, préfère une formulation positive : écris « an empty street » plutôt que « no cars ».\n\n**9. Le vocabulaire de caméra que les guides recommandent.** À glisser dans la partie Cinematography ou Camera motion : `wide shot` (plan large), `medium shot` (plan moyen), `close-up` (gros plan), `extreme close-up` (très gros plan), `low angle` (contre-plongée), `over-the-shoulder` (par-dessus l'épaule), `slow push in` (lent travelling avant), `slow pull back` (lent recul), `pan left` (panoramique vers la gauche), `tracking shot` (travelling d'accompagnement), `static shot` (plan fixe), `shallow depth of field` (arrière-plan flou).\n\n### B. Les prompts pour créer des images\n\n**1. Le modèle de scène réaliste (guide Google, Gemini image).**\n\n```\nA photorealistic [shot type] of [subject], [action or expression], set in [environment]. The scene is illuminated by [lighting], creating a [mood] atmosphere. Captured with a [camera/lens details], emphasizing [key textures and details]. The image should be in a [aspect ratio] format.\n```\n\nÀ quoi ça sert : une scène réaliste ou semi réaliste, avec la lumière et l'ambiance bien décrites. Pour ta série, remplace `photorealistic` par ta phrase de style. Exemple :\n\n```\nA [PHRASE DE STYLE] medium shot of a boy in a blue sweater, looking curiously at a small wooden box, set in a bright school corridor. The scene is illuminated by soft morning light from tall windows, creating a calm atmosphere. Shot with an 85mm lens, emphasizing the wool texture of the sweater. The image should be in a 9:16 vertical format.\n```\n\nTraduction : un plan moyen d'un garçon en pull bleu qui regarde avec curiosité une petite boîte en bois, dans un couloir d'école lumineux. La scène est éclairée par une lumière douce du matin venant de grandes fenêtres, ce qui crée une ambiance calme. Prise avec un objectif de 85 mm, en mettant en valeur la texture de laine du pull. L'image doit être au format vertical 9:16.\n\n**2. Le modèle de case de bande dessinée ou de storyboard.**\n\n```\nA single comic book panel in a [art style] style. In the foreground, [character description and action]. In the background, [setting details]. [Dialogue or caption, in quotes, if any]. [Aspect ratio].\n```\n\nÀ quoi ça sert : préparer le storyboard visuel d'un épisode, ou obtenir un plan de dessin animé 2D. Exemple :\n\n```\nA single comic book panel in a 2D cartoon spy style. In the foreground, a young woman in a purple jumpsuit crouches behind a cafe counter, holding a small device. In the background, a busy cafe with red stools and a large window. Vertical 9:16.\n```\n\nTraduction : une seule case de bande dessinée dans un style dessin animé 2D d'espionnes. Au premier plan, une jeune femme en combinaison violette est accroupie derrière le comptoir d'un café et tient un petit appareil. À l'arrière-plan, un café animé avec des tabourets rouges et une grande fenêtre. Format vertical 9:16.\n\n**3. Le modèle d'autocollant stylisé.**\n\n```\nA [style] sticker of [subject], [key features and colors], bold clean outlines, simple shading, on a white background.\n```\n\nÀ quoi ça sert : créer des icônes de personnage, des logos de série ou des vignettes de miniature à fond blanc que tu découpes facilement. Le guide Google donne ce type de structure pour les autocollants.\n\n**4. Le modèle de produit ou d'objet (photo commerciale).**\n\n```\nA high-resolution studio product photograph of [object] on a [surface], lit by [lighting setup], [camera angle], ultra sharp focus, [aspect ratio].\n```\n\nÀ quoi ça sert : créer un objet important de ton histoire (clé, carnet, boîte, bijou) en bel éclairage, pour l'utiliser ensuite comme référence. Exemple :\n\n```\nA high-resolution studio product photograph of an antique brass key with a red ribbon on a dark wooden table, lit by a soft three-point softbox setup, close-up from a slightly high angle, ultra sharp focus, vertical 9:16.\n```\n\nTraduction : une photo de studio en haute résolution d'une clé ancienne en laiton avec un ruban rouge sur une table en bois sombre, éclairée par un dispositif doux de trois softboxes, gros plan légèrement en plongée, netteté maximale, format vertical 9:16.\n\n**5. Le modèle de texte dans l'image.** Mets le texte exact entre guillemets et précise la police :\n\n```\nA storefront sign that reads \"BOULANGERIE\" in a clean bold sans-serif font, painted white on a dark green wooden board.\n```\n\nTraduction : une enseigne de magasin sur laquelle on lit « BOULANGERIE » dans une police sans empattement, nette et grasse, peinte en blanc sur une planche de bois vert foncé. Conseil de Google : décide le texte d'abord, puis demande l'image. Vérifie toujours l'orthographe : les IA se trompent encore souvent, et il vaut parfois mieux ajouter le texte au montage.\n\n**6. Le modèle de fond minimaliste avec espace vide.**\n\n```\nA minimalist composition featuring [subject] positioned in the [bottom-right / lower third] of the frame, with a large empty [color] background, soft light, vertical 9:16.\n```\n\nÀ quoi ça sert : créer une image de fond avec de la place pour tes sous-titres ou ton titre, très utile pour les miniatures et les fonds de vidéo.\n\n### C. Les prompts pour modifier une image existante\n\n**1. Ajouter ou retirer un élément.**\n\n```\nUsing the provided image, add [element] to [location]. Keep everything else in the image exactly the same, preserving the original style, lighting and composition.\n```\n\n```\nUsing the provided image, remove the [element]. Keep everything else in the image exactly the same, preserving the original style, lighting and composition.\n```\n\nTraduction : à partir de l'image fournie, ajoute \\[élément\\] à \\[endroit\\] (ou retire \\[élément\\]). Garde tout le reste exactement pareil, en préservant le style, la lumière et la composition d'origine.\n\n**2. Modifier une seule zone (inpainting).**\n\n```\nUsing the provided image, change only the [element] to [new element/description]. Keep everything else in the image exactly the same, preserving the original style, lighting, and composition.\n```\n\nÀ quoi ça sert : changer la couleur d'un pull, remplacer un objet, corriger un détail sans refaire l'image. C'est le prompt le plus utile pour garder un personnage identique. Exemple : change only the sweater color to red.\n\n**3. Changer le style.**\n\n```\nTransform the provided photograph of [subject] into the artistic style of [describe the style in words: flat colors, thick outlines, soft watercolor...]. Preserve the original composition but render it with [new stylistic elements].\n```\n\nÀ quoi ça sert : passer une même image d'un style à un autre pour comparer tes options. Décris le style avec des mots, jamais avec le nom d'une œuvre ou d'un artiste.\n\n**4. Assembler plusieurs images.**\n\n```\nUsing the first image as the character and the second image as the setting, place the character in the setting, standing near the window. Match the lighting of the setting. Keep the character exactly the same.\n```\n\nTraduction : avec la première image comme personnage et la seconde comme décor, place le personnage dans le décor, debout près de la fenêtre. Adapte la lumière à celle du décor. Garde le personnage exactement pareil.\n\n**5. Les formules de Google Cloud pour Nano Banana.**\n\n```\nText to image: [Subject] + [Action] + [Location/context] + [Composition] + [Style]\nWith reference images: [Reference images] + [Relationship instruction] + [New scenario]\n```\n\nExemple avec références :\n\n```\nUsing the attached character sheet and the attached kitchen image, show the character cooking at the counter. Same face, same outfit, same kitchen. Medium shot, [PHRASE DE STYLE], vertical 9:16.\n```\n\nTraduction : avec la fiche du personnage et l'image de cuisine jointes, montre le personnage en train de cuisiner au comptoir. Même visage, même tenue, même cuisine. Plan moyen, \\[style\\], vertical 9:16. Nano Banana accepte jusqu'à 14 images de référence. Quand tu modifies, dis toujours explicitement ce qui doit rester identique.\n\n**6. Les conseils de Nano Banana sur la lumière, la caméra et la matière.** Lumière : `three-point softbox lighting` (trois softboxes, doux et propre), `chiaroscuro` (fort contraste ombre et lumière), `golden hour backlighting` (contre-jour de fin de journée). Caméra : `85mm portrait lens` (portrait), `wide-angle` (grand angle), `macro` (très gros plan sur un détail). Couleur : `warm color grading` (étalonnage chaud), `pastel palette`. Matière : dis « navy blue tweed jacket » (veste en tweed bleu marine) plutôt que « jacket ».\n\n**7. Le modèle d'OpenAI (GPT Image).** OpenAI recommande toujours le même ordre : le décor ou la scène, puis le sujet, puis les détails clés, puis les contraintes, puis l'usage prévu.\n\n```\nScene: [setting, time of day, weather]. Subject: [who or what, pose, action]. Key details: [clothes, colors, textures, props]. Constraints: no text, no logo, no watermark. Use: [vertical 9:16 keyframe for an animated short].\n```\n\nTraduction : scène : \\[lieu, heure, météo\\]. Sujet : \\[qui ou quoi, pose, action\\]. Détails clés : \\[vêtements, couleurs, matières, accessoires\\]. Contraintes : pas de texte, pas de logo, pas de filigrane. Usage : \\[image clé verticale 9:16 pour une courte vidéo animée\\].\n\nLes autres exemples du guide OpenAI, à adapter avec les mêmes crochets :\n\n- **Le héros de livre pour enfants, puis la suite.** Première image : « A children's book illustration of \\[character description\\], standing in \\[setting\\], warm soft colors ». Ensuite, joins cette image et écris : « Continue the story with the same character, same outfit and same style: now he is \\[new action\\] in \\[new setting\\]. » Sert à faire une série d'images avec le même héros.\n- **La bande dessinée en 4 cases.** « A four-panel comic strip. Panel 1: \\[action\\]. Panel 2: \\[action\\]. Panel 3: \\[action\\]. Panel 4: \\[action\\]. Same characters in every panel. » Sert à visualiser tout un épisode d'un coup, avant de produire les images une par une.\n- **La figurine de collection.** « A collectible figure of \\[character\\], displayed in a clear window box packaging, plain background. » Sert à créer un visuel de produit dérivé fictif de ton personnage (sans logo ni marque).\n- **Retirer un objet.** « Remove the \\[object\\]. Change only that. Keep everything else the same. »\n- **Changer la météo ou la lumière.** « Change only the weather to light rain and the light to dusk. Keep the composition and the characters identical. »\n- **Changer l'intérieur.** « Change only the furniture: replace the sofa with a green armchair. Keep the room layout, the walls and the lighting the same. »\n- **Du croquis à l'image finale.** Joins un dessin au crayon et écris : « Turn this sketch into a finished image in \\[PHRASE DE STYLE\\], keep the composition exactly. »\n- **Détourer un objet.** « Isolate the \\[object\\] on a transparent background, clean edges, no shadow. » Sert à découper un objet pour le poser dans un autre plan.\n\nAutres réglages du guide : la qualité (low, medium, high : commence en low ou medium pour tester, passe en high pour l'image finale), le nombre de variations demandées en une fois, et l'option « input fidelity » élevée quand tu veux que l'outil respecte au maximum l'image jointe (visage du personnage). Le texte dans l'image se met entre guillemets, ou en MAJUSCULES.\n\n**8. Les prompts de Runway Gen-4 References.** Runway accepte jusqu'à 3 références actives dans un même prompt, que tu appelles avec @. Une référence neutre et bien éclairée sert de toile vierge. Décris toujours les vêtements pour les plans en pied.\n\n```\n@character sits at a table in @kitchen, eating breakfast. Medium shot, warm morning light, [PHRASE DE STYLE].\n```\n\nTraduction : @personnage est assis à une table dans @cuisine et prend son petit déjeuner. Plan moyen, lumière chaude du matin.\n\nPour ajouter un objet à un décor que tu as déjà enregistré :\n\n```\n@kitchen with a red teapot on the table, same lighting and same camera angle.\n```\n\nRunway conseille de changer un seul élément à la fois, de transformer les meilleurs résultats en nouvelles références, puis de les envoyer directement en vidéo. Limite reconnue par Runway : le résultat peut changer si tu modifies beaucoup de variables en même temps.\n\n### D. Réussir les décors, les objets et les accessoires\n\nLes guides officiels donnent des conseils précis pour tout ce qui n'est pas un personnage. Voici comment les appliquer à ta série.\n\n**1. Crée chaque décor récurrent une fois, sans personnage.** Génère une image de chaque lieu vide (cuisine, école, rue, chambre), avec le prompt d'ensemble suivant, puis garde-la comme référence :\n\n```\nEstablishing shot of [place], [main materials and colors], [three permanent objects with their position], [time of day and light], empty of characters, no text, no logo, [PHRASE DE STYLE], vertical 9:16.\n```\n\nTraduction : plan d'ensemble de \\[lieu\\], \\[matériaux et couleurs principaux\\], \\[trois objets permanents avec leur position\\], \\[heure et lumière\\], sans personnage, sans texte, sans logo, \\[style\\], vertical 9:16.\n\n**2. Donne des détails précis et des matières.** Écris « a small kitchen with a round oak table, yellow tiles and a copper pot on the shelf » plutôt que « a kitchen ». Nomme la matière (bois de chêne, carrelage jaune, laine, cuivre, verre dépoli) : c'est ce qui donne du réalisme et de la personnalité au décor.\n\n**3. Fixe trois objets repères par décor.** Un objet unique et reconnaissable, placé au même endroit, aide le public à identifier le lieu et t'aide à vérifier la cohérence (une théière rouge sur l'étagère de gauche, une horloge ronde au mur).\n\n**4. Décris la lumière et l'heure.** Une lumière change complètement l'ambiance : `soft morning light` (douce, matin), `warm late afternoon light` (chaude, fin d'après-midi), `cold moonlight through a window` (froide, nuit). Pour un même décor, fais une version jour et une version nuit dès le début.\n\n**5. Réserve de la place pour le personnage et les sous-titres.** Demande une composition avec un espace libre : « leave empty space in the lower third for subtitles ». En 9:16, garde la partie basse et le haut de l'écran dégagés, car les interfaces des applications les recouvrent.\n\n**6. Pour un objet, fais une image dédiée.** Génère l'objet seul sur fond neutre (modèle B4), puis joins-le comme référence. C'est plus fiable que de laisser l'IA le réinventer à chaque plan, surtout pour un objet qui passe de main en main.\n\n**7. Un objet qui apparaît dans un décor existant.** Utilise le prompt d'ajout (C1) ou la référence Runway : le décor reste identique, seul l'objet est ajouté. Précise « same lighting and same camera angle ».\n\n**8. Change une seule chose à la fois.** Si la lumière, les meubles et la caméra changent ensemble, l'outil dérive. Un changement, puis une vérification, puis le suivant. Si les détails dérivent au fil de la conversation, recommence une nouvelle conversation en collant à nouveau la description complète (conseil de Google).\n\n**9. Indique le format.** Écris toujours « vertical 9:16 » dans le prompt d'image. Google propose plusieurs formats, dont le 9:16, et des résolutions 1K, 2K ou 4K ; OpenAI produit souvent du 2:3 qu'on recadre.\n\n**10. Une image clé peut devenir une vidéo.** Google conseille de créer les images clés (début et fin d'un mouvement) avec Nano Banana, puis de laisser Veo générer le passage de l'une à l'autre (modèle A6). Pour un décor, c'est idéal : une image de la pièce fermée, une de la pièce ouverte, et la vidéo montre l'ouverture.\n\n**11. Vérifie la cohérence des décors avant de tourner.** Avant de produire un épisode, place les trois références (personnage, décor, objet) côte à côte et vérifie : même style, même palette, même échelle. Un décor plus réaliste que le personnage casse l'illusion.\n\n**Ce qui a été corrigé par rapport aux guides officiels.** Deux points de ce guide ont été précisés après lecture des guides : la règle des deux personnages par image est une règle de prudence et non une limite officielle (Runway accepte 3 références, Nano Banana jusqu'à 14), et les listes d'interdits (negative prompts) ne sont pas recommandées par tous : Google, OpenAI et Runway conseillent de formuler positivement, alors que Kling accepte une liste d'exclusions. Le reste de ce guide est cohérent avec leurs recommandations (décrire le mouvement plutôt que l'image dans un prompt image vers vidéo, changer un seul élément à la fois, clips de 4 à 10 secondes, garder les mêmes mots pour la description du personnage).\n\n**Sources consultées le 30 septembre 2026.** [Runway, guide de prompt image vers vidéo](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide) · [Runway, Gen-4 Image References](https://help.runwayml.com/hc/en-us/articles/40042718905875-Creating-with-Gen-4-Image-References) · [Google Cloud, guide de prompt Veo 3.1](https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1) · [Google Cloud, guide de prompt Nano Banana](https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-nano-banana) · [Google Developers, prompts pour Gemini image](https://developers.googleblog.com/how-to-prompt-gemini-2-5-flash-image-generation-for-the-best-results/) · [OpenAI, guide de prompt GPT Image](https://developers.openai.com/cookbook/examples/multimodal/image-gen-models-prompting-guide) · [OpenAI, image prompting](https://developers.openai.com/api/docs/guides/image-prompting). Les modèles marqués comme adaptés (autocollant, fond minimaliste, exemples OpenAI en liste) reprennent la logique des guides avec mes propres formulations : vérifie-les dans ton outil."}, {"id": "aI", "n": "I", "title": "Annexe I. Les voix : même voix, même ton, un seul personnage qui parle à la fois", "phase": 5, "sum": "C'est l'un des points qui trahit le plus vite une série faite à la va-vite : la voix d'un personnage change d'un plan à l'autre (plus aiguë, plus...", "md": "C'est l'un des points qui trahit le plus vite une série faite à la va-vite : la voix d'un personnage change d'un plan à l'autre (plus aiguë, plus lente, plus sèche), ou deux personnages remuent la bouche en même temps alors qu'un seul est censé parler. Cette partie s'appuie sur la documentation officielle d'ElevenLabs (voix de synthèse), de Google (Veo 3.1) et de Kling. Quand une consigne vient de ma propre méthode et non d'un guide officiel, je l'indique.\n\n### A. Ce que disent les guides officiels\n\n- **Choisis une voix dont le style est déjà celui que tu veux.** ElevenLabs explique qu'une façon de parler déjà présente dans les données d'entraînement de la voix (chuchoter, crier, une diction particulière) est plus facile à reproduire pour le modèle. Une voix sérieuse aura du mal à rire ou à faire l'enfant. Choisis donc la voix d'un personnage d'après son caractère, pas seulement d'après son timbre.\n- **Le débit dépend d'abord de la voix, puis du réglage de vitesse.** Selon ElevenLabs, le rythme d'une voix est fortement influencé par l'audio qui a servi à la créer. La vitesse par défaut est 1,0 et peut varier de 0,7 (le plus lent) à 1,2 (le plus rapide). Note la valeur choisie pour chaque personnage et ne la change plus.\n- **La ponctuation pilote le rythme.** ElevenLabs recommande d'écrire le texte comme un récit avec une vraie ponctuation. Les points de suspension ajoutent une pause et du poids, les majuscules ajoutent de l'emphase, un tiret court fait une petite pause. Trop de balises de pause dans une même génération peuvent rendre la voix instable : préfère la ponctuation.\n- **L'émotion passe par le texte.** ElevenLabs indique que le modèle comprend l'émotion à partir du contexte ou de balises comme \\[whispers\\] (chuchote), \\[excited\\] (enthousiaste), \\[sighs\\] (soupire). Utilise des balises compatibles avec le caractère de la voix.\n- **Écris les chiffres en toutes lettres.** ElevenLabs demande de développer les nombres, les prix et les abréviations (« 1 000 $ » devient « mille dollars »). Teste aussi les mots difficiles avec ta voix avant de produire.\n- **Pour plus de régularité.** La documentation d'ElevenLabs indique un paramètre de graine (seed) qui rend les résultats plus constants, même si de petites différences restent possibles, et, quand un long texte est découpé en morceaux, des paramètres de texte précédent et suivant pour garder une intonation continue. Les réglages Stability et Similarity servent à contrôler la régularité (je n'ai pas pu lire le détail de chaque curseur : note la valeur et ne la modifie plus d'un épisode à l'autre).\n- **Une voix reste liée à un personnage (Kling).** Kling permet d'associer une voix à un personnage pour que la voix reste attachée à lui. Pour un dialogue, il conseille de nommer clairement qui parle, d'écrire la réplique, puis de décrire l'émotion ou la façon de dire (« chuchote », « s'exclame », « répond d'une voix basse et plate »).\n- **Un plan par personnage qui parle (Google, Veo 3.1).** Dans l'exemple de dialogue de Google, chaque réplique a son propre plan : un prompt pour le détective qui parle, un autre pour la femme qui répond. Les paroles sont entre guillemets et la façon de parler est précisée (« in a weary voice », d'une voix fatiguée). La fonction Ingrédients vers vidéo garde aussi un son cohérent d'un plan à l'autre pour les mêmes personnages et les mêmes décors.\n- **Limites du lip-sync chez Kling.** La synchronisation des lèvres fonctionne avec des visages humains (réels, 3D ou 2D) dont le visage est complet et bien visible, pas avec des animaux. Si l'audio dépasse la durée de la vidéo, il est coupé. Pour un personnage à tête d'objet, teste d'abord sur un plan court.\n\n### B. Ma méthode pour que la voix ne saute pas et que personne ne parle en même temps\n\nCes règles ne viennent pas d'un guide officiel : ce sont des pratiques de montage qui découlent des points ci-dessus. Teste-les sur un épisode.\n\n1. **Crée une fiche de voix par personnage** avant le premier épisode : nom de la voix dans l'outil, vitesse, hauteur (grave, médium, aiguë), âge, accent, adjectif de ton habituel (calme, pressant, moqueur), longueur de phrase habituelle. Colle cette fiche dans chaque demande.\n2. **Génère toutes les répliques d'un même personnage dans la même session**, avec la même voix, la même vitesse et les mêmes réglages. Une voix générée un autre jour ou avec un autre réglage peut sonner différemment.\n3. **Une seule réplique par clip.** Chaque clip vidéo contient une réplique d'un seul personnage. Pas de réplique qui se croise. Le dialogue se construit au montage, en alternant les plans (champ, contrechamp).\n4. **Le personnage qui écoute reste silencieux.** Dans un plan où les deux sont visibles, dis explicitement lequel parle et que l'autre a la bouche fermée. C'est souvent là que l'IA fait bouger les deux bouches.\n5. **Garde le même ton d'un plan à l'autre.** Utilise toujours le même adjectif de ton pour un personnage dans un même moment de l'histoire (« calm, low voice »), et ne change de ton que quand l'histoire le demande.\n6. **Prépare le texte pour la voix.** Chiffres en toutes lettres, phrases courtes (20 mots maximum, comme partout dans ce guide), une virgule ou des points de suspension là où tu veux une pause, pas d'abréviation.\n7. **Écoute tout l'épisode d'une traite avant l'export.** Les sauts de ton s'entendent surtout quand on enchaîne les répliques. Si une réplique sonne différemment, refais-la avec les mêmes réglages plutôt que de régler tout l'épisode.\n8. **Si la voix intégrée à l'IA vidéo change trop d'un plan à l'autre**, coupe le son de la vidéo et ajoute les voix générées séparément (voix de synthèse puis lip-sync, ou simple voix off). C'est plus long mais la voix reste identique.\n\n### C. Les prompts pour les voix\n\n**1. La fiche de voix (à donner à ton assistant).**\n\n```\nCrée la fiche de voix du personnage [nom] : âge apparent, hauteur (grave, médium, aiguë), timbre, accent, vitesse de parole (lente, normale, rapide, avec un chiffre de 0,7 à 1,2), adjectif de ton par défaut, 3 adjectifs de ton pour les moments forts (colère, tristesse, joie), longueur habituelle des phrases, tics de langage. Termine par un texte de 40 mots en anglais que je pourrai coller dans un outil de voix pour décrire cette voix, sans nom de personne réelle ni de personnage existant.\n```\n\n**2. La préparation d'un texte pour la synthèse vocale.**\n\n```\nVoici les répliques de l'épisode [numéro], avec le nom du personnage devant chaque ligne : [colle]. Pour chaque réplique : écris les chiffres et les abréviations en toutes lettres, coupe les phrases de plus de 20 mots, ajoute la ponctuation qui donne le bon rythme (virgules, points de suspension pour une hésitation), ajoute au début une balise d'émotion en anglais entre crochets choisie parmi celles qui conviennent à la fiche de voix du personnage [colle la fiche]. Ne change pas le sens et ne rajoute aucun mot d'argot.\n```\n\n**3. Un plan, une réplique (prompt vidéo, modèle Veo 3.1).**\n\n```\nUsing the provided images for [character A], [character B] and [location], create a medium shot focusing on [character A]. She says in a calm, low voice, \"[réplique en
