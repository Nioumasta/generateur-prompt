<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0920">
<title>Atelier Série</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : fond en dégradé flou, cartes de verre dépoli, barre de navigation fixe en bas (Créer, Ma série, Guide). Violet et rose, jamais de vert ni de marron. */
:root {
  --bg: #ECE8FF;
  --blob1: rgba(255, 120, 190, .55);
  --blob2: rgba(110, 170, 255, .55);
  --blob3: rgba(255, 190, 120, .45);
  --blob4: rgba(170, 140, 255, .55);
  --fg: #1B1340;
  --muted: #55497E;
  --glass: rgba(255, 255, 255, .55);
  --glass-strong: rgba(255, 255, 255, .8);
  --glass-line: rgba(255, 255, 255, .8);
  --shadow: 0 10px 34px rgba(72, 46, 160, .16);
  --line: rgba(27, 19, 64, .14);
  --accent-a: #6D4AE8;
  --accent-b: #B5348F;
  --accent-fg: #FFFFFF;
  --accent-text: #5A38D4;
  --code-bg: rgba(27, 19, 64, .07);
  --warn-bg: rgba(255, 110, 120, .2);
  --warn: #9E1F2B;
  --hot-bg: rgba(255, 196, 92, .35);
  --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0920;
    --blob1: rgba(236, 72, 153, .42); --blob2: rgba(14, 165, 233, .36); --blob3: rgba(245, 158, 11, .22); --blob4: rgba(124, 58, 237, .55);
    --fg: #F1EEFF; --muted: #B9AFDF;
    --glass: rgba(255, 255, 255, .09); --glass-strong: rgba(28, 20, 60, .82); --glass-line: rgba(255, 255, 255, .2);
    --shadow: 0 10px 34px rgba(0, 0, 0, .45); --line: rgba(255, 255, 255, .16);
    --accent-text: #C2B0FF; --code-bg: rgba(0, 0, 0, .32); --warn-bg: rgba(255, 110, 120, .18); --warn: #FFB4BA; --hot-bg: rgba(245, 158, 11, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0920;
  --blob1: rgba(236, 72, 153, .42); --blob2: rgba(14, 165, 233, .36); --blob3: rgba(245, 158, 11, .22); --blob4: rgba(124, 58, 237, .55);
  --fg: #F1EEFF; --muted: #B9AFDF;
  --glass: rgba(255, 255, 255, .09); --glass-strong: rgba(28, 20, 60, .82); --glass-line: rgba(255, 255, 255, .2);
  --shadow: 0 10px 34px rgba(0, 0, 0, .45); --line: rgba(255, 255, 255, .16);
  --accent-text: #C2B0FF; --code-bg: rgba(0, 0, 0, .32); --warn-bg: rgba(255, 110, 120, .18); --warn: #FFB4BA; --hot-bg: rgba(245, 158, 11, .2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 18px 120px; min-height: 100%; }
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42% 34% at 12% 8%, var(--blob1), transparent 70%),
    radial-gradient(40% 36% at 92% 22%, var(--blob2), transparent 70%),
    radial-gradient(46% 38% at 20% 88%, var(--blob3), transparent 70%),
    radial-gradient(44% 40% at 90% 92%, var(--blob4), transparent 70%); }
#view, .dock { position: relative; z-index: 1; }
#view { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-a); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: .875rem; }
.kicker { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--glass-line); border-radius: 22px; box-shadow: var(--shadow); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-strong); } }
.card { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }

/* Boutons */
.btn { border: 0; border-radius: 16px; padding: 14px 18px; min-height: 50px; font-weight: 700; color: var(--accent-fg); background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 6px 20px rgba(109, 74, 232, .32); }
.btn.ghost { background: var(--glass); color: var(--fg); border: 1px solid var(--glass-line); box-shadow: none; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.btn.big { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.back { background: none; border: 0; color: var(--accent-text); font-weight: 700; padding: 8px 0; text-align: left; align-self: flex-start; min-height: 44px; }

/* Étapes 1-2-3 */
.pills { display: flex; gap: 8px; }
.pill { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 16px; font-size: .8rem; font-weight: 600; text-align: center; color: var(--muted); background: var(--glass); border: 1px solid var(--glass-line); }
.pill i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--code-bg); color: var(--fg); }
.pill.on { color: var(--fg); border-color: var(--accent-a); }
.pill.on i { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; }
.pill.ok i { background: var(--accent-a); color: #fff; }

/* Accueil : pastilles de tâches */
.group { display: flex; flex-direction: column; gap: 10px; }
.group h2 { padding-left: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { text-align: left; color: var(--fg); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 132px; border-radius: 20px; }
.tile .num { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-size: .85rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); font-variant-numeric: tabular-nums; }
.tile b { font-size: 1rem; line-height: 1.2; }
.tile span.d { font-size: .82rem; color: var(--muted); line-height: 1.35; }
.banner { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.bar { height: 8px; border-radius: 99px; background: var(--code-bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); }

/* Champs */
label.q { font-weight: 700; display: block; margin-bottom: 6px; }
.q-hint { display: block; font-size: .85rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
textarea, input[type="text"], input[type="search"] { width: 100%; font-size: 16px; color: var(--fg); background: var(--glass-strong); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus { border-color: var(--accent-a); outline: none; box-shadow: 0 0 0 3px rgba(109, 74, 232, .22); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--glass-strong); color: var(--fg); border-radius: 99px; padding: 10px 16px; min-height: 44px; font-weight: 600; text-align: left; }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; border-color: transparent; }
.scrollrow { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; } .scrollrow .chip { white-space: nowrap; flex: none; }
.chip.small { min-height: 38px; padding: 8px 14px; font-size: .88rem; }
.warnbox { background: var(--warn-bg); border-radius: 16px; padding: 12px 14px; }
.warnbox h3 { color: var(--warn); margin-bottom: 4px; }
.miss { background: var(--hot-bg); border-radius: 16px; padding: 12px 14px; }
.promptbox { padding: 12px; }
.promptbox textarea { background: transparent; border: 0; padding: 0; min-height: 200px; font-size: 15px; box-shadow: none; }
.ens { margin: 6px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

/* Lignes de chapitres */
.chrow { width: 100%; text-align: left; color: var(--fg); display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; min-height: 60px; }
.chrow .n { flex: none; min-width: 34px; height: 34px; padding-inline: 6px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: .85rem; background: var(--code-bg); color: var(--accent-text); font-variant-numeric: tabular-nums; }
.chrow .t { display: flex; flex-direction: column; min-width: 0; }
.chrow .t b { font-size: .98rem; line-height: 1.25; }
.chrow .t span { font-size: .82rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
details.phase > summary { font-weight: 700; padding: 10px 4px; cursor: pointer; }
details.phase[open] > summary { color: var(--accent-text); }
.list { display: flex; flex-direction: column; gap: 8px; }

/* Ma série : styles */
.stygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sty { text-align: left; color: var(--fg); background: var(--glass-strong); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-height: 76px; }
.sty[aria-pressed="true"] { border-color: var(--accent-a); box-shadow: 0 0 0 2px var(--accent-a) inset; }
.sty b { font-size: .95rem; line-height: 1.2; }
.diff { font-size: .72rem; font-weight: 700; color: var(--accent-text); }
.fld { display: flex; flex-direction: column; gap: 6px; }
.tick { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--code-bg); color: transparent; font-size: .7rem; margin-right: 6px; vertical-align: middle; }
.tick.on { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; }
.linkbtn { background: none; border: 0; color: var(--accent-text); font-weight: 700; padding: 6px 0; text-align: left; min-height: 36px; font-size: .9rem; }

/* Lecteur du guide */
.reader { padding: 18px 16px; background: var(--glass-strong); }
.reader h1 { font-family: var(--font-body); font-size: 1.5rem; }
.md { display: flex; flex-direction: column; gap: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.md h3 { font-size: 1.15rem; margin-top: 10px; }
.md h4 { font-size: 1rem; margin-top: 6px; color: var(--accent-text); }
.md ul, .md ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.md blockquote { margin: 0; padding: 10px 14px; border-radius: 14px; background: var(--code-bg); display: flex; flex-direction: column; gap: 6px; }
.md a { color: var(--accent-text); font-weight: 600; }
.md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.md hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
.tw { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); }
.tw table { border-collapse: collapse; min-width: 100%; font-size: .9rem; }
.tw th, .tw td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); min-width: 110px; }
.tw th { background: var(--code-bg); }
.code { position: relative; background: var(--code-bg); border-radius: 14px; padding: 12px; }
.code pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .86rem; line-height: 1.5; }
.code .copy { float: right; margin: 0 0 6px 8px; border: 1px solid var(--line); background: var(--glass-strong); color: var(--accent-text); border-radius: 10px; padding: 6px 12px; min-height: 36px; font-weight: 700; }
.pager { display: flex; gap: 10px; }
.pager .btn { flex: 1; }

/* Barre du bas */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 24px)); display: flex; gap: 4px; padding: 6px; border-radius: 26px; background: var(--glass-strong); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); border: 1px solid var(--glass-line); box-shadow: var(--shadow); z-index: 20; }
.dock button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 20px; padding: 8px 4px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .75rem; font-weight: 700; }
.dock button[aria-current="page"] { color: #fff; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); }
.dock svg { width: 22px; height: 22px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 440px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 14px 16px; font-weight: 600; z-index: 30; }
</style>

<style>body { margin: 0; }</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main id="view"></main>
<nav class="dock" aria-label="Navigation principale">
  <button type="button" data-tab="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Créer</button>
  <button type="button" data-tab="serie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 6l-2-3M12 6l-2-3M17 6l-2-3"/></svg>Ma série</button>
  <button type="button" data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6M9 11h6"/></svg>Guide</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
var GEMINI_URL = "https://gemini.google.com/app";
var MIN_CHARS = 1;
var STYLES = [
  { id: "S01", nom: "3D semi-réaliste", voit: "Personnages en 3D avec des proportions humaines, lumière douce, décors réalistes.", ideal: "Drames, mystères, histoires de famille. Le style le plus courant.", diff: "Moyenne", phrase: "semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16" },
  { id: "S02", nom: "3D film familial", voit: "Grands yeux, peau lisse, intérieurs chaleureux, comme un film d'animation pour toute la famille.", ideal: "Comédie, aventure, histoires tendres.", diff: "Moyenne", phrase: "stylized 3D animated family film look, large expressive eyes, warm cozy interior, vertical 9:16" },
  { id: "S03", nom: "2D dessin animé plat", voit: "Couleurs en aplat, contours épais, formes simples.", ideal: "Humour, gags courts, public jeune.", diff: "Facile", phrase: "flat 2D cartoon illustration, bold outlines, bright colors, simple shapes" },
  { id: "S04", nom: "Anime ou manga", voit: "Traits fins, grands yeux, visages très expressifs.", ideal: "Romance, école, aventure. Attention à ne pas ressembler à un anime connu.", diff: "Moyenne", phrase: "anime style illustration, clean line art, expressive eyes" },
  { id: "S05", nom: "Livre pour enfants (aquarelle)", voit: "Couleurs pastel, texture de papier, douceur.", ideal: "Contes, fables avec une morale, histoires calmes.", diff: "Facile", phrase: "children's storybook watercolor illustration, soft pastel palette" },
  { id: "S06", nom: "Pâte à modeler", voit: "Textures faites à la main, décor miniature posé sur une table.", ideal: "Comédie, histoires décalées.", diff: "Moyenne", phrase: "claymation stop-motion look, handmade textures, tabletop miniature scene" },
  { id: "S07", nom: "BD ou webtoon", voit: "Cases de bande dessinée presque fixes, petits mouvements de caméra.", ideal: "Mystère, drame. Le style le moins cher à produire.", diff: "Facile", phrase: "comic book panel illustration, halftone shading, empty speech bubbles" },
  { id: "S08", nom: "Pixel art rétro", voit: "Look de jeu vidéo ancien, peu de couleurs.", ideal: "Humour, aventure, public qui aime les jeux vidéo.", diff: "Facile", phrase: "16-bit pixel art scene, limited color palette" },
  { id: "S09", nom: "Objets avec un visage", voit: "Nourriture, jouets ou objets du quotidien qui parlent.", ideal: "Humour absurde, histoires très courtes.", diff: "Facile", phrase: "3D animated household object with a simple expressive face, soft lighting" },
  { id: "S10", nom: "Poupée ou jouet", voit: "Tête plus grosse que le corps, yeux brillants, peau de plastique.", ideal: "Drames et comédies du quotidien. Ne copie aucune marque de poupée.", diff: "Moyenne", phrase: "stylized 3D toy doll character, oversized head, glossy plastic skin, big shiny eyes, soft studio lighting" },
  { id: "S11", nom: "Tête d'objet", voit: "Corps humain, tête remplacée par un objet (tasse, claquette) avec des yeux et une bouche.", ideal: "Humour absurde, satire douce du quotidien.", diff: "Moyenne", phrase: "3D animated character with an everyday object instead of a head, expressive eyes and mouth on the object, human body, everyday clothes" },
  { id: "S12", nom: "Réaliste cinéma", voit: "Visages et décors presque réels.", ideal: "Drame sérieux. Déconseillé pour débuter : sensible, et l'étiquette IA est obligatoire.", diff: "Difficile", phrase: "cinematic photorealistic, 35mm film look, shallow depth of field" }
];

/* Chaque étape : q = questions, a = réponses de cette étape (tableau), k(n) = "Ce que je retiens" de l'étape n. */
var STEPS = [
  { nom: "Veille",
    fais: "Crée un compte TikTok à part pour la veille. Cherche ai series, #aiseries, #serieia, #animationia, #partie2. Regarde des séries IA en entier et note 10 comptes.",
    erreur: "Copier une histoire ou un personnage vu. On note comment ça marche, pas ce qui se passe.",
    q: [
      { t: "text", l: "Tes 10 comptes, un par ligne : nom du compte, type de personnages, style, durée, ce qui se passe dans les 3 premières secondes, comment ça finit." },
      { t: "text", l: "Ce que les gens demandent ou critiquent dans les commentaires (3 lignes)." }],
    prompt: function (a, k, S) {
      return "Tu es analyste de vidéos courtes. Voici mes notes sur 10 comptes de séries animées faites avec l'IA :\n" + a[0] + "\nCe que disent les commentaires : " + a[1] + "\n" +
        "1) Donne les 5 mécanismes qui expliquent leur succès (accroche, rythme, conflit, fin, format). " +
        "2) Liste ce que tous ces comptes font de la même façon, pour que je fasse autrement. " +
        "3) Propose 5 angles originaux en français. " +
        "4) Écris-moi 5 règles personnelles de 1 ligne chacune (exemple : le conflit arrive avant 10 secondes). " +
        "Sépare ce que mes notes montrent vraiment de ce qui est une supposition. Réponds court, en listes.";
    },
    ensuite: ["Lis la réponse de Gemini.", "Garde les 5 règles qui te parlent.", "Écris-les dans « Ce que je retiens » plus bas.", "Appuie sur « J'ai terminé cette étape »."],
    noter: "Tes 5 règles personnelles." },

  { nom: "Concept et style",
    fais: "Écris ton idée en une phrase qu'un inconnu pourrait répéter. Ton style se choisit une fois pour toute la série, dans l'onglet Ma série.",
    erreur: "Changer de style en cours de série, ou reprendre une série qui existe déjà.",
    style: true,
    q: [
      { t: "text", l: "Quel type de personnages ?", h: "Humains, animaux, objets avec un visage, poupées, créatures..." },
      { t: "text", l: "Le lieu du quotidien où tes personnages se croisent.", h: "Exemple : une laverie, un camping, un immeuble." },
      { t: "text", l: "Le conflit de départ : qui contre qui, et pour quoi." },
      { t: "text", l: "Le public et le ton.", h: "Exemple : ados et adultes, mystère avec humour." }],
    prompt: function (a, k, S) {
      return "Je crée une série animée courte en français (vidéos verticales de 65 à 75 secondes pour TikTok, YouTube Shorts, Instagram et Facebook).\n" +
        "Type de personnages : " + a[0] + "\nStyle visuel : " + S.sty() + "\nLieu : " + a[1] + "\nConflit de départ : " + a[2] + "\nPublic et ton : " + a[3] + "\n" +
        "Mes règles tirées de la veille : " + k(1) + "\n" +
        "Propose 5 concepts. Pour chacun : un titre de 2 à 4 mots, la phrase concept sur ce modèle « Dans [univers], [personnage] veut [objectif], mais [obstacle]. Et [secret] risque de tout changer. », " +
        "une règle spéciale propre à l'univers, et 10 épisodes possibles en une ligne chacun. " +

var GUIDE = [{"id": "intro", "n": "i", "title": "Avant de commencer : comment utiliser ce guide", "phase": 0, "sum": "Le mode d'emploi, le lexique du novice et la chaîne de fabrication en un coup d'œil.", "md": "Ce guide t'apprend, sans aucune connaissance préalable, à fabriquer, publier et rentabiliser une série animée avec l'intelligence artificielle, quel que soit son style : personnages 3D, dessin animé 2D, poupées, animaux, objets ou fruits humanisés. C'est ton process de référence, de la veille à la monétisation. Les tarifs, quotas et règles ont été vérifiés le 29 septembre 2026.\n\n**Ce que tu vas fabriquer.** Une série animée IA est une suite de courtes vidéos verticales, de 60 à 90 secondes, dans lesquelles des personnages récurrents, dans le style que tu as choisi, vivent des histoires à suivre : secrets, rivalités, révélations. Ce n'est pas une vidéo générée d'un seul clic. C'est une chaîne de production : idée, scénario, images, animation, voix, montage, publication. L'IA joue le rôle du studio. Toi, tu joues le rôle de la réalisatrice.\n\n**Comment chaque section est construite.** Les 50 sections suivent le même modèle, pour que tu saches toujours où regarder :\n\n- **Ce que tu vas faire** : le résultat concret de l'étape.\n- **Pourquoi cette étape existe** : ce qui se passe si tu la sautes.\n- **Avant de commencer** : ce qu'il faut avoir sous la main.\n- **Pas à pas** : les gestes à faire, dans l'ordre, en indiquant où cliquer.\n- **À sauvegarder** : les fichiers à garder pour ne rien perdre.\n- **Si le résultat est mauvais** : les corrections à essayer avant de tout recommencer.\n- **Prompt à copier** : le texte prêt à coller dans l'outil, avec sa traduction quand il est en anglais.\n\n**Trois règles pour ne pas te perdre.**\n\n1. **Avance une étape à la fois.** Ne passe à la suivante que lorsque tu as sauvegardé le résultat de celle-ci.\n2. **Les noms de boutons changent.** Les applications modifient leurs menus tous les mois. Quand ce guide dit « clique sur Créer une image », cherche le bouton qui ressemble le plus à cette idée, même s'il s'appelle autrement ou si son icône a changé.\n3. **Les prix et les quotas changent encore plus vite.** Les chiffres de ce guide sont exacts au 29 septembre 2026. Avant de payer quoi que ce soit, lis le prix affiché sur la page officielle de l'outil, sur ton écran de paiement.\n\n**Pourquoi certains prompts sont en anglais.** La plupart des générateurs d'images et de vidéos comprennent le français, mais ils respectent mieux les consignes détaillées en anglais. Tu n'as pas besoin de parler anglais : chaque prompt anglais est suivi de sa traduction, et tu peux demander à Claude ou ChatGPT de te traduire ou de rédiger ces prompts pour toi.\n\n**Ce que ce guide promet, et ce qu'il ne promet pas.** Il te donne une méthode complète pour produire une vraie série et une vérification honnête des règles de monétisation. Il ne promet aucun revenu. La plupart des comptes n'atteignent jamais les seuils de rémunération, et la section 34 à 37 explique pourquoi.\n\n### Lexique du novice\n\n| Terme | Ce que ça veut dire |\n| --- | --- |\n| Prompt | Le texte que tu écris à une IA pour lui dire ce que tu veux. |\n| IA générative | Une IA qui fabrique du contenu neuf : texte, image, vidéo, voix, musique. |\n| Crédits | La monnaie interne d'un outil. Chaque génération en consomme, même si le résultat est raté. |\n| Quota | Le nombre maximal de générations autorisées sur une période (jour, semaine, mois). |\n| Plan | Un morceau de vidéo continu, sans coupure, de 5 à 10 secondes ici. |\n| Scène | Plusieurs plans dans le même lieu et le même moment. |\n| Image vers vidéo | Tu donnes une image fixe à l'outil, il l'anime. C'est la méthode de base de ce guide. |\n| Bible de série | Le document qui fixe personnages, décors, style et règles, pour que tout reste identique d'un épisode à l'autre. |\n| Image maîtresse | L'image officielle d'un personnage ou d'un lieu, que tu réutilises comme référence. |\n| Cohérence | Le fait qu'un personnage garde le même visage, les mêmes couleurs et la même tenue partout. C'est la difficulté numéro un. |\n| Storyboard | La liste des plans d'un épisode, avec pour chacun l'image, l'action et la durée. |\n| Lip-sync | La synchronisation des lèvres du personnage avec la voix. |\n| Hook | Les 1 à 3 premières secondes, qui doivent donner envie de rester. |\n| Cliffhanger | La fin suspendue qui donne envie de voir l'épisode suivant. |\n| 9:16 | Le format vertical plein écran d'un téléphone (1080 pixels de large, 1920 de haut). |\n| Rétention | La part de la vidéo que les gens regardent avant de partir. |\n| Filigrane | Un petit logo incrusté dans l'image par certains outils. |\n| RPM | Ce que tu gagnes pour 1 000 vues (revenu pour mille). |\n\n### La chaîne de fabrication en un coup d'œil\n\n| Étape | Ce qu'on produit | Outil possible | Sections | Boîte à outils |\n| --- | --- | --- | --- | --- |\n| 1. Veille et idée | Un concept original, un style choisi | TikTok, un carnet, Claude | [1](#mvrm72sfxts.5259) à [4](#mvrm72sfxts.16210) | [Annexes A à F](#mvrm72sfxts.295667) |\n| 2. Bible, personnages, décors | Fiches et images maîtresses | Claude, ChatGPT, Gemini, Leonardo, banques de photos libres | [5](#mvrm72sfxts.19251) à [12](#mvrm72sfxts.45472) | [Annexe H](#mvrm72sfxts.296105), [annexe J](#mvrm72sfxts.296252) |\n| 3. Écriture | Saison, épisode, storyboard | Claude, ChatGPT, Grok | [13](#mvrm72sfxts.48830) à [15](#mvrm72sfxts.55309) | [Annexe J](#mvrm72sfxts.296252), [annexe L](#mvrm72sfxts.296381) |\n| 4. Images des plans et animatic | Une image par plan, un montage test | ChatGPT, Gemini, Leonardo, Midjourney, CapCut | [16](#mvrm72sfxts.58456) et [17](#mvrm72sfxts.61953) | [Annexe H](#mvrm72sfxts.296105) |\n| 5. Animation | Un clip par plan | Google Flow (Veo), Kling, Grok Imagine, Runway | [17](#mvrm72sfxts.61953) | [Annexes G](#mvrm72sfxts.296035), [H](#mvrm72sfxts.296105), [K](#mvrm72sfxts.296318) |\n| 6. Voix | Dialogues parlés | ElevenLabs, voix intégrée, ta voix | [18](#mvrm72sfxts.67889) à [20](#mvrm72sfxts.75311) | [Annexe I](#mvrm72sfxts.296171) |\n| 7. Son | Musique et bruitages | Bibliothèques libres | [21](#mvrm72sfxts.78287) et [22](#mvrm72sfxts.81269) | [Annexe K](#mvrm72sfxts.296318) |\n| 8. Montage | Épisode assemblé et exporté | CapCut | [23](#mvrm72sfxts.83036) à [27](#mvrm72sfxts.93767) | [Annexe L](#mvrm72sfxts.296381) |\n| 9. Publication | Vidéo en ligne, étiquetée IA | TikTok, YouTube, Instagram, Facebook | [28](#mvrm72sfxts.96529) à [33](#mvrm72sfxts.111467) | [Annexe K](#mvrm72sfxts.296318), [annexe L](#mvrm72sfxts.296381) |\n| 10. Argent et suivi | Revenus, statistiques | Studios des plateformes | [34](#mvrm72sfxts.115330) à [40](#mvrm72sfxts.135500) | [Annexe E](#mvrm72sfxts.295883) |\n| 11. Organisation | Budget, temps, fichiers, lancement | Tableur, dossiers | [41](#mvrm72sfxts.139285) à [50](#mvrm72sfxts.166762) | [Annexe M](#mvrm72sfxts.296451) |"}, {"id": "c1", "n": "1", "title": "1. Comprendre le concept", "phase": 0, "sum": "Comprendre ce qu'est vraiment une série animée IA, ce que sa fabrication demande, et fixer le cadre de ton projet en une page.", "md": "> [Ouvrir l'annexe M](#mvrm72sfxts.296451) : cours gratuits en français pour te former en parallèle.\n\n**Ce que tu vas faire.** Comprendre ce qu'est vraiment une série animée IA, ce que sa fabrication demande, et fixer le cadre de ton projet en une page.\n\n**Pourquoi cette étape existe.** Beaucoup de débutantes achètent des abonnements avant d'avoir compris le principe. Résultat : des vidéos jolies, mais sans histoire, que personne ne regarde jusqu'au bout.\n\n### Ce qu'est une série animée IA\n\nC'est une série de courts épisodes verticaux où des personnages récurrents (enfants ou adultes en 3D, héros de dessin animé 2D, poupées, animaux, objets ou fruits humanisés) se disputent, s'aiment, se trahissent et se réconcilient dans des scènes de la vie de tous les jours. Le format a explosé au printemps 2026 avec les fruits humanisés : selon la presse, une série de téléréalité de fruits sur TikTok a gagné environ 3 millions d'abonnés en quelques jours, puis a vu une partie de ses épisodes retirés après des signalements. Depuis, des milliers de comptes produisent la même chose. Deux leçons en découlent :\n\n- Le style attire l'œil, mais ce sont **l'histoire et les personnages** qui font revenir les gens.\n- Copier une série qui a marché ne marche plus. Ce qui marche, c'est un univers à toi.\n\n### Ce qu'on fabrique réellement\n\nUn épisode de 70 secondes se compose d'environ 10 plans de 5 à 8 secondes. Chaque plan est une image fixe, animée ensuite par une IA vidéo. On ajoute les voix, la musique et les sous-titres, puis on assemble le tout dans un logiciel de montage.\n\n| Plan | Durée | Contenu (exemple) |\n| --- | --- | --- |\n| 1 | 5 s | Hook : une lettre glisse sous la porte d'un étal |\n| 2 | 6 s | Gros plan sur le visage inquiet de Madame Pomme |\n| 3 | 7 s | Elle ouvre l'enveloppe |\n| 4 | 6 s | Basile Banane entre, le sourire figé |\n| 5 | 8 s | Dispute à voix basse |\n| 6 | 7 s | Cerise entend tout, cachée derrière les cagettes |\n| 7 | 8 s | Révélation : la lettre parle d'une vente secrète |\n| 8 | 7 s | Basile lance : « Tu aurais dû me le dire avant. » |\n| 9 | 8 s | Cerise recule, une cagette tombe |\n| 10 | 6 s | Cliffhanger : écran noir, « Qui a fait tomber la cagette ? » |\n\nSoit environ 68 secondes. Tous les exemples de ce guide se passent dans une même série fictive, **Rue des Vergers**, un quartier où vivent des habitants à la peau ou à la tête de fruit, autour d'un marché. Ce n'est qu'un exemple, dans un style parmi des dizaines (annexes A et B) : chaque fois que tu lis « fruit » dans un exemple, remplace-le par ce qui caractérise tes propres personnages. Tu peux la réutiliser pour t'entraîner, mais ta vraie série devra être la tienne.\n\n### Les quatre familles d'outils\n\n1. **Un assistant d'écriture** (Claude, ChatGPT, Grok) : idées, scénario, prompts.\n2. **Un générateur d'images** (ChatGPT, Gemini, Leonardo, Midjourney) : personnages et décors.\n3. **Un générateur de vidéo** (Google Flow, Kling, Grok Imagine, Runway) : l'animation.\n4. **Un logiciel de montage** (CapCut) : assemblage, sous-titres, export.\n\n**Avant de commencer.** Un ordinateur (plus confortable qu'un téléphone), une adresse mail, un compte Google, un compte TikTok, un dossier vide sur ton bureau nommé `MA_SERIE`.\n\n### Pas à pas\n\n1. Ouvre un document texte (Google Docs : docs.google.com, bouton **Document vierge**). Nomme-le `00_cadre_du_projet`.\n2. Écris **l'univers** en une phrase : le lieu et les personnages (exemple : un marché de quartier tenu par des fruits).\n3. Écris **le public visé** : adolescents, adultes, familles. Pour un drame de trahisons, vise les adultes et jeunes adultes.\n4. Écris **le format** : vertical 9:16, 60 à 90 secondes, 3 épisodes par semaine.\n5. Écris **la promesse** : « ce que le spectateur veut savoir », en une phrase (exemple : « Qui a vendu la moitié du marché ? »).\n6. Note **ton test limité** : 10 épisodes en 5 semaines, budget maximal 30 €. Tu décideras ensuite sur des chiffres réels.\n\n**À sauvegarder.** Le document `00_cadre_du_projet`, avec le nom provisoire de la série.\n\n**Si le résultat est mauvais.**\n\n- Tu n'arrives pas à écrire la promesse : ton concept est encore flou, passe à la section 2.\n- Tu veux acheter dix outils : ne le fais pas. Les sections 41 à 43 te disent quoi acheter et dans quel ordre.\n\n**Prompt à copier (Claude ou ChatGPT).**\n\n```\nExplique-moi comme à une débutante complète ce qu'est une série animée générée par IA sur TikTok, dans le style [ton style]. Dis-moi quelles sont les étapes de fabrication d'un épisode de 70 secondes, quels types d'outils il faut, et quels sont les trois pièges principaux. Réponds avec des phrases courtes et un exemple concret.\n```"}, {"id": "c2", "n": "2", "title": "2. Trouver une idée originale", "phase": 0, "sum": "Transformer une envie vague (« une série animée avec des personnages attachants ») en un concept précis, différent de tout ce qui existe, capable de...", "md": "**Ce que tu vas faire.** Transformer une envie vague (« une série animée avec des personnages attachants ») en un concept précis, différent de tout ce qui existe, capable de nourrir au moins 10 épisodes.\n\n**Pourquoi cette étape existe.** Une idée générique ne se mémorise pas. Une idée précise donne un titre, un décor, des personnages et une question qui relève chaque épisode.\n\n**Avant de commencer.** Un document texte vide, 30 minutes au calme, et l'autorisation de proposer des idées médiocres : on en écrit dix pour en garder une.\n\n### La formule qui structure tout\n\n> Dans \\[univers\\], \\[personnage\\] veut \\[objectif\\], mais \\[obstacle\\]. Et \\[secret\\] risque de tout changer.\n\nExemple : « Dans un marché de quartier tenu par des fruits, une jeune cerise veut prouver qu'elle mérite un étal, mais la patronne lui cache tout. Et une lettre secrète risque de faire fermer le marché. »\n\n### Pas à pas\n\n1. **Écris 10 lieux** possibles : un marché, une cantine, un camping, un cinéma de quartier, un salon de coiffure, une pharmacie, un immeuble, un hôtel, un village de montagne, une gare.\n2. **Écris 10 conflits** de départ : héritage caché, rivalité entre deux commerces, rumeur, disparition d'un objet, arrivée d'un nouveau venu, dette secrète, faux ami, concours truqué, tromperie, trahison d'un allié.\n3. **Associe un lieu et un conflit** au hasard trois fois. Note les trois combinaisons qui te donnent envie de savoir la suite.\n4. **Ajoute une règle propre à ton univers** : par exemple, « dans ce marché, un fruit qui ment devient trop mûr et change de couleur ». Une règle bizarre mais stable rend la série reconnaissable.\n5. **Passe le filtre anti-copie** avec ces cinq questions. Un seul « oui » impose de changer l'idée.\n   - Le titre contient-il le nom d'une émission ou d'une série existante ? (Ce nom peut être une marque déposée.)\n   - Un personnage ressemble-t-il à un personnage connu ?\n   - L'intrigue est-elle celle d'un épisode viral que tu as vu ?\n   - Le décor est-il celui d'une émission de téléréalité connue ?\n   - Pourrais-tu confondre ta série avec une autre en lisant seulement la description ?\n6. **Teste la durée de vie** : écris en une ligne 10 épisodes possibles. Si tu bloques à 4, l'idée est trop étroite.\n7. **Choisis une seule idée**, écris-la avec la formule, et donne-lui un titre provisoire de 2 à 4 mots faciles à retenir.\n\n**À sauvegarder.** Le fichier `01_idees_brutes` (les 10 lieux, 10 conflits, 3 combinaisons), le fichier `02_concept_final` (phrase concept + titre + 10 épisodes en une ligne).\n\n**Si le résultat est mauvais.**\n\n- Toutes tes idées ressemblent à des séries existantes : change le lieu en premier, ensuite le type de personnages, ensuite le conflit.\n- Tu as trop d'idées : garde celle que tu peux décrire en une phrase sans hausser le ton.\n- Les histoires de couples qui se trompent sont les plus saturées : essaie l'enquête, l'humour de voisinage, le mystère, l'entraide ou la rivalité de métiers.\n\n**Prompt à copier (Claude, ChatGPT ou Grok).**\n\n```\nJe veux créer une série courte en français pour TikTok, YouTube Shorts et Instagram : un feuilleton animé dans le style suivant : [décris ton style et ton type de personnages, voir les annexes A et B]. Drames du quotidien (couple, famille, voisinage, travail), tout public adulte, sans violence gratuite ni humiliation, sans scènes suggestives. Propose-moi 10 concepts originaux qui ne sont PAS une parodie de téléréalité et ne copient aucune série existante. Pour chacun : titre, lieu, 4 personnages principaux (avec leur signe visuel distinctif), conflit de départ, règle spéciale de l'univers, et pourquoi le public voudra voir la suite. Termine par un classement des 3 meilleurs avec les risques de chacun.\n```"}, {"id": "c3", "n": "3", "title": "3. Étudier TikTok sans copier", "phase": 0, "sum": "Regarder une trentaine de vidéos pour comprendre pourquoi certaines fonctionnent (rythme, accroche, fin), puis en tirer des règles personnelles sans...", "md": "> [Ouvrir l'annexe E](#mvrm72sfxts.295883) : ce que disent les rapports et les forums de 2026. Les hashtags à chercher sont dans cette section, après le pas à pas.\n\n**Ce que tu vas faire.** Regarder une trentaine de vidéos pour comprendre pourquoi certaines fonctionnent (rythme, accroche, fin), puis en tirer des règles personnelles sans reprendre aucune histoire.\n\n**Pourquoi cette étape existe.** Tu apprends les habitudes du public : combien de temps avant le premier conflit, comment les fins donnent envie de continuer. Ce sont des mécanismes, et personne n'en est propriétaire. Les histoires, les personnages et les vidéos, eux, appartiennent à leurs auteurs.\n\n**Avant de commencer.** L'application TikTok, un tableur vide (Google Sheets : sheets.google.com, **Feuille de calcul vierge**), 2 heures.\n\n### Pas à pas\n\n1. **Crée un compte de veille** séparé de ton compte personnel, pour que l'algorithme te propose surtout ce format. Tu pourras le supprimer plus tard.\n2. **Cherche** : touche la loupe, tape `ai series`, puis `ai animation`, `feuilleton IA`, `histoire ia`. Sur la page des résultats, choisis l'onglet **Vidéos**.\n3. **Regarde 30 vidéos en entier**, de 10 comptes différents. Regarde les 3 premières secondes une fois **sans le son** : si tu comprends ce qui se passe, le hook est bon.\n4. **Remplis ton tableur**, une ligne par vidéo, avec ces colonnes :\n\n| Colonne | Ce que tu notes |\n| --- | --- |\n| Compte et lien | Nom du compte, abonnés, adresse de la vidéo |\n| Durée | En secondes |\n| Hook | Ce qui se passe dans les 3 premières secondes |\n| Nombre de plans | Compte les changements d'image |\n| Conflit | Quand il apparaît (à quelle seconde) et de quoi il s'agit |\n| Fin | Cliffhanger, révélation, question, rien |\n| Style visuel | 3D brillant, pâte à modeler, dessin animé, réaliste |\n| Voix | Voix parlées, voix off, sous-titres seuls |\n| Commentaires | Les 3 demandes ou critiques qui reviennent |\n\n5. **Lis les commentaires** des vidéos les plus vues. Ce que les gens réclament (« la suite ! ») te dit ce qui accroche. Ce qu'ils critiquent te dit ce qu'il faut éviter.\n6. **Trouve les trous du marché** : y a-t-il des séries en français ? Avec un univers stable ? Avec un autre ton (humour, enquête, entraide) ?\n7. **Utilise les outils de recherche de TikTok** : dans TikTok Studio sur ordinateur, cherche la rubrique d'inspiration ou **Creator Search Insights**, qui montre les sujets recherchés et ceux qui manquent de vidéos. Le Creative Center (recherche `TikTok Creative Center` sur ton moteur de recherche) liste aussi les hashtags en tendance par pays. Les noms de menus peuvent changer.\n8. **Écris tes règles personnelles**, cinq lignes maximum. Exemple : « Le conflit arrive avant 10 secondes. Un seul plan de dialogue dure plus de 6 secondes. Chaque épisode finit sur une question. »\n\n**À sauvegarder.** Le tableur `03_veille_tiktok`, et tes cinq règles en haut de la feuille.\n\n**Si le résultat est mauvais.**\n\n- Ton fil ne montre que des vidéos hors sujet : cherche par hashtag (`#fruitdrama`) et regarde davantage de vidéos du bon type pour « éduquer » l'algorithme.\n- Tu as envie de refaire une histoire vue : écris uniquement le mécanisme (« un secret découvert par un témoin caché ») et invente tout le reste.\n- **Ne télécharge pas** les vidéos des autres pour les réutiliser, même en extrait. Ne recrée pas un personnage identifiable.\n\n**Les hashtags et mots-clés à chercher pendant ta veille.** Ce sont des pistes de recherche, pas des hashtags à copier dans tes descriptions : je n'ai pas pu vérifier leur volume actuel, et leur popularité change chaque semaine. Tape-les dans la recherche TikTok, ouvre l'onglet des hashtags pour voir le nombre de vues, puis l'onglet des vidéos pour les exemples, en privilégiant les plus récentes.\n\n| Ce que tu cherches | Hashtags à taper |\n| --- | --- |\n| Vidéos IA en général | `#aivideo` `#aianimation` `#aishortfilm` `#aistory` `#aifilm` `#madewithai` |\n| Séries et fiction courte | `#aiseries` `#aidrama` `#microdrama` `#minidrama` `#shortdrama` `#part2` `#episode1` |\n| En français | `#serieia` `#animationia` `#videoia` `#histoireia` `#feuilleton` `#miniserie` `#partie2` |\n| Par style | `#fruitdrama` `#aifruit` `#3danimation` `#3dcharacter` `#2danimation` `#cartoon` `#stopmotion` `#claymation` |\n| Par outil (pour voir ce qu'un outil sait faire) | `#klingai` `#veo3` `#runwayml` `#hailuo` `#seedance` `#midjourney` `#nanobanana` `#capcut` |\n\nTrois astuces : les hashtags du type `#part2` ou `#partie2` font remonter les comptes qui publient déjà en épisodes ; la recherche TikTok fonctionne aussi avec des mots sans dièse (par exemple « ai series fruit » ou « série ia épisode 1 »), essaie les deux ; enfin, quand une vidéo te plaît, note les hashtags qu'elle utilise et cherche-les à leur tour. N'utilise jamais de hashtag qui contient le nom d'une marque ou d'une œuvre connue.\n\n**Prompt à copier (Claude).**\n\n```\nTu es analyste de contenus courts. Voici mon tableau d'observation de 30 vidéos de séries animées IA : [colle ton tableau]. 1) Dis-moi les 5 mécanismes qui expliquent leur succès (accroche, rythme, type de conflit, fin, format). 2) Liste ce que tous ces comptes font de la même façon, pour que je fasse autrement. 3) Propose 5 angles originaux en français. 4) Sépare clairement ce que mes données montrent de ce qui est une hypothèse.\n```"}, {"id": "c4", "n": "4", "title": "4. Créer l'univers", "phase": 0, "sum": "Construire le monde dans lequel vivent tes personnages : où, quand, selon quelles règles, avec quel style visuel.", "md": "> [Ouvrir l'annexe A](#mvrm72sfxts.295667) : choisir le style de ta série.\n>\n> [Ouvrir l'annexe B](#mvrm72sfxts.295718) : tous les styles possibles.\n>\n> [Ouvrir l'annexe C](#mvrm72sfxts.295773) : le vocabulaire des styles et des formats.\n>\n> [Ouvrir l'annexe D](#mvrm72sfxts.295817) : les genres, les effets et les mélanges.\n>\n> [Ouvrir l'annexe F](#mvrm72sfxts.295947) : traduire un style connu en mots de prompt.\n\n**Ce que tu vas faire.** Construire le monde dans lequel vivent tes personnages : où, quand, selon quelles règles, avec quel style visuel.\n\n**Pourquoi cette étape existe.** Un univers stable rend l'écriture plus rapide (tu sais ce qui est possible) et les images plus cohérentes (mêmes lieux, mêmes couleurs). Sans univers, chaque épisode ressemble à une vidéo isolée.\n\n**Avant de commencer.** Ton fichier `02_concept_final` de la section 2, un document texte nommé `04_univers`.\n\n### Pas à pas\n\n1. **Choisis l'époque et le lieu.** Un présent contemporain est le plus simple : téléphones, caméras, réseaux sociaux existent, ce qui donne beaucoup d'occasions de révélations.\n2. **Décide du signe visuel qui rend chaque personnage reconnaissable.** Une coiffure, une couleur dominante, une tenue, une forme de tête ou un accessoire. Dans l'exemple Rue des Vergers : une peau ou une tête de fruit sur un corps humain. Note aussi ce qui reste interdit : par exemple, jamais de scène où un personnage mange un autre fruit (ça évite les questions gênantes et garde un ton tout public).\n3. **Écris 5 règles du monde.** Exemple : le marché ouvre à 7 h et ferme à 19 h ; personne ne quitte la rue des Vergers ; un fruit qui ment devient trop mûr ; la patronne a le dernier mot ; les rumeurs circulent plus vite que la livraison.\n4. **Choisis un ton.** Drame léger avec de l'humour, suspense, comédie de quartier. Un seul ton dominant.\n5. **Choisis un style visuel unique** et garde-le pendant toute la série : par exemple « film d'animation 3D semi réaliste, proportions humaines, peau brillante aux textures de fruit, lumière douce de cinéma ». Tous les styles possibles et leur phrase de prompt sont dans les annexes A et B. Changer de style en cours de route est l'erreur la plus fréquente.\n6. **Fixe une palette** de 5 couleurs maximum (deux couleurs principales, deux d'accent, un neutre) et note leurs noms.\n7. **Liste 5 lieux récurrents** (section 8 pour les créer en image). Un lieu principal, quatre lieux secondaires.\n8. **Écris la liste de ce qui n'existe pas** dans ton univers : pas de personnes réelles, pas de marques réelles, pas de violence, pas de scènes suggestives.\n\n| Rubrique | Exemple pour Rue des Vergers |\n| --- | --- |\n| Lieu | Un marché de quartier, une rue pavée, six étals |\n| Époque | Aujourd'hui |\n| Règle spéciale | Un fruit qui ment devient trop mûr |\n| Ton | Mystère de voisinage avec humour |\n| Style | Film d'animation 3D semi réaliste, humains à peau ou tête de fruit, lumière chaude |\n| Palette | Rouge pomme, jaune banane, vert feuille, crème, bleu nuit |\n| Lieux | Marché, arrière-boutique, bureau du comptable, café du coin, toit de l'immeuble |\n\n**À sauvegarder.** Le fichier `04_univers` avec le tableau ci-dessus rempli.\n\n**Si le résultat est mauvais.**\n\n- Tout te semble mélangé : réduis le nombre de styles, de couleurs et de lieux.\n- Tu hésites entre deux tons : choisis celui que tu peux tenir pendant 20 épisodes.\n\n**Prompt à copier (Claude).**\n\n```\nVoici le concept de ma série : [colle ton concept]. Crée la fiche univers : lieu et époque, le type de personnages et leur signe visuel distinctif, 5 règles du monde, ton dominant, style visuel unique (celui que j'ai choisi : [ton style], décrit pour un générateur d'images, en anglais), palette de 5 couleurs, 5 lieux récurrents du quotidien avec un objet permanent pour chacun, et une liste de choses interdites. Reste simple : je produis seule, avec des outils d'IA, et je dois pouvoir tenir la cohérence visuelle sur 10 épisodes.\n```"}, {"id": "c5", "n": "5", "title": "5. Créer la bible de série", "phase": 0, "sum": "Réunir dans un seul document tout ce qui ne doit jamais changer : personnages, lieux, style, règles, chronologie, vocabulaire.", "md": "**Ce que tu vas faire.** Réunir dans un seul document tout ce qui ne doit jamais changer : personnages, lieux, style, règles, chronologie, vocabulaire.\n\n**Pourquoi cette étape existe.** Les IA n'ont aucune mémoire d'un jour à l'autre et les générateurs d'images oublient tes personnages d'un plan à l'autre. La bible est ta mémoire : tu la colles dans chaque outil, et tu vérifies chaque épisode contre elle.\n\n**Avant de commencer.** Les fichiers des sections 2 et 4, un Google Doc vide nommé `05_bible_v01`.\n\n### Le plan de la bible\n\n1. **Page de concept** : titre, phrase concept, public, ton, promesse.\n2. **L'univers** : copie de la fiche de la section 4.\n3. **Les personnages** : une fiche par personnage (section 6).\n4. **Les lieux** : une fiche par lieu (section 8).\n5. **Le style visuel** : une phrase en anglais, réutilisée mot pour mot dans tous les prompts d'images.\n6. **La structure d'un épisode** : durée, nombre de plans, position du hook et du cliffhanger.\n7. **Les règles de continuité** : ce qui est verrouillé (couleur des yeux, tenue, voix) et ce qui peut changer (expression, éclairage).\n8. **La chronologie** : ce qui s'est passé dans chaque épisode, mise à jour après chaque publication.\n9. **Les choses interdites** : contenus, noms, marques, styles à ne jamais utiliser.\n\n### Pas à pas\n\n1. Dans Google Docs, crée un titre par rubrique (menu **Style de paragraphe**, puis **Titre 2**). Tu pourras naviguer grâce au plan qui s'affiche à gauche.\n2. Colle le prompt ci-dessous dans Claude, avec ton concept et ton univers.\n3. Relis la réponse avec un crayon critique : noms faciles à retenir, 4 à 6 personnages maximum, aucun personnage qui ressemble à une personne réelle.\n4. Colle le résultat corrigé dans ton Google Doc.\n5. **Verrouille** : en haut du document, écris la date et « version 01 ». Dès que tu changes une information importante, crée la version 02 (menu **Fichier**, puis **Créer une copie**), au lieu d'écraser l'ancienne.\n6. Crée un **résumé d'une page** de la bible avec les règles critiques. C'est lui que tu colleras quand un outil a une limite de longueur.\n\n**À sauvegarder.** `05_bible_v01`, sa version PDF (menu **Fichier**, **Télécharger**, **Document PDF**), et le résumé d'une page `05_bible_resume`.\n\n**Si le résultat est mauvais.**\n\n- L'IA invente des détails qui contredisent ta bible : recolle la règle critique dans le prompt et ajoute « n'invente rien qui ne figure pas dans la bible ».\n- Tu modifies un personnage en cours de série : note la raison de scénario (un nouveau vêtement peut s'expliquer par l'histoire), sinon garde l'ancien.\n\n**Prompt à copier (Claude).**\n\n```\nA partir du concept et de l'univers ci-dessous, crée la bible de la saison 1.\nConcept : [colle]. Univers : [colle].\n- 5 personnages : nom, signe visuel distinctif, rôle, caractère en 3 mots, désir, peur, secret, façon de parler, phrase culte, liens avec les autres. Chacun respecte le style et le type de personnages choisis dans mon univers.\n- Pour chaque personnage, une DESCRIPTION VISUELLE FIXE EN ANGLAIS de 40 à 60 mots : type de personnage, couleurs exactes, textures, âge apparent, forme du visage, yeux, cheveux, vêtements sans logo, accessoire signature. Termine chaque description par : \"[PHRASE DE STYLE de ma série]\".\n- 3 lieux du quotidien avec une description visuelle fixe en anglais.\n- L'arc de la saison en 10 épisodes, une ligne par épisode.\n- Une liste de choses interdites.\nAucune ressemblance avec une personne réelle ou un personnage existant. N'invente rien qui ne figure pas dans ce que je t'ai donné.\n```"}, {"id": "c6", "n": "6", "title": "6. Créer les personnages", "phase": 0, "sum": "Inventer 4 à 6 personnages que le public reconnaît en une seconde, et écrire pour chacun une fiche et une description visuelle qui ne changera plus.", "md": "> [Ouvrir l'annexe A](#mvrm72sfxts.295667) : les familles de personnages et leurs règles.\n>\n> [Ouvrir l'annexe J](#mvrm72sfxts.296252) : les prompts universels pour créer une fiche.\n\n**Ce que tu vas faire.** Inventer 4 à 6 personnages que le public reconnaît en une seconde, et écrire pour chacun une fiche et une description visuelle qui ne changera plus.\n\n**Pourquoi cette étape existe.** Les gens ne s'attachent pas à un style, ils s'attachent à une personnalité. Et un générateur d'images ne garde un visage identique que si tu lui redonnes exactement la même description à chaque fois.\n\n**Avant de commencer.** La bible commencée (section 5). Pense à des rôles qui s'opposent : une héroïne attachante, une figure d'autorité, un charmeur douteux, un allié comique, un personnage mystère.\n\n### Pas à pas\n\n1. **Choisis le rôle** de chaque personnage : héroïne, rival, mentor, allié, mystère. Pas plus de 6 personnages : au-delà, tu ne pourras pas garder la cohérence visuelle.\n2. **Associe un signe visuel à un caractère**. Exemple dans Rue des Vergers : la pomme (autorité, tradition) en peau rouge brillante, la banane (charme, glissant) en peau jaune lisse, la cerise (jeune, vive) en tête de cerise avec sa tige, le citron (acide, grincheux) en teint jaune texturé, la prune (curieuse, bavarde) en peau violette. Dans ton style, remplace le fruit par une couleur, une coiffure, un objet ou une forme de tête.\n3. **Remplis la fiche** ci-dessous pour chacun.\n4. **Choisis un accessoire signature bien visible** (lunettes rondes rouges, tablier jaune, carnet). C'est ce que l'œil reconnaît en premier, même quand le visage change un peu.\n5. **Rédige la description visuelle fixe** en anglais, de 40 à 60 mots, avec ces éléments dans cet ordre : type de personnage, couleurs exactes, textures (peau, matière, vêtements), âge apparent et morphologie, visage, yeux, cheveux, vêtements, accessoire, style. Termine toujours par la même phrase de style.\n6. **Écris 3 phrases typiques** du personnage. Elles serviront à garder sa façon de parler.\n7. **Choisis un profil de voix** (hauteur, rythme, tic de langage), voir section 19.\n\n| Rubrique | Exemple : Madame Pomme |\n| --- | --- |\n| Rôle | Patronne du marché |\n| Caractère (3 mots) | Autoritaire, drôle, secrète |\n| Ce qu'elle veut | Garder le marché dans la famille |\n| Ce qu'elle craint | Que son secret soit révélé |\n| Secret | Elle a vendu la moitié des étals |\n| Façon de parler | Grave, calme, phrases courtes |\n| Phrase culte | « Au marché, tout se sait. » |\n| Accessoire signature | Lunettes rondes rouges |\n\n**Exemple de description visuelle fixe (anglais)**\n\n```\nMadame Pomme, a woman in her fifties with a human body and face, glossy apple-red skin with a subtle sheen and tiny speckles, warm brown eyes, thin arched eyebrows, dark hair in a low bun with a small green leaf pin, calm confident smile, pearl necklace, cream silk blouse, round red glasses, semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16\n```\n\nTraduction : Madame Pomme, une femme d'une cinquantaine d'années au corps et au visage humains, peau rouge pomme brillante avec un léger éclat et de fines taches, yeux marron chaleureux, sourcils fins et arqués, cheveux foncés en chignon bas avec une petite épingle en forme de feuille verte, sourire calme et assuré, collier de perles, chemisier de soie crème, lunettes rondes rouges, personnage 3D animé stylisé semi réaliste, proportions humaines, lumière douce façon film, format vertical 9:16.\n\n```\nCerise, a young woman with a human body and a smooth glossy dark red cherry-shaped head with a green stem on top, large curious hazel eyes, long black hair in a high ponytail, gold hoop earrings, friendly open smile, mustard yellow apron over a white t-shirt, small notebook in her hand, semi-realistic stylized 3D animated character, human proportions, soft cinematic lighting, vertical 9:16\n```\n\nTraduction : Cerise, une jeune femme au corps humain et à la tête en forme de cerise rouge foncé lisse et brillante avec une tige verte au sommet, grands yeux noisette curieux, longs cheveux noirs en queue de cheval haute, créoles dorées, sourire ouvert et amical, tablier jaune moutarde sur un t-shirt blanc, petit carnet à la main, personnage 3D animé stylisé semi réaliste, proportions humaines, lumière douce façon film, format vertical 9:16.\n\n**À sauvegarder.** Une fiche par personnage dans la bible, et un fichier texte `06_descriptions_visuelles` qui contient uniquement les descriptions anglaises, prêtes à copier.\n\n**Si le résultat est mauvais.**\n\n- Deux personnages se ressemblent : change la forme du visage, la couleur dominante et l'accessoire de l'un des deux.\n- Le personnage est difficile à dessiner par l'IA (trop de détails) : supprime des accessoires et simplifie les vêtements.\n- Ne donne à aucun personnage le nom, la tête, la voix ou l'allure d'une personne réelle ou d'un personnage existant.\n\n**Prompt à copier (Claude).**\n\n```\nCrée la fiche du personnage suivant pour ma bible : [nom, signe visuel distinctif, rôle]. Le personnage respecte le style de ma série : [type de personnage : humain 3D, héros 2D, poupée, animal, objet, fruit humanisé...]. Donne : caractère en 3 mots, désir, peur, secret, façon de parler, 3 phrases typiques, profil de voix, et une description visuelle fixe en anglais de 40 à 60 mots (type de personnage, couleurs exactes, textures, âge apparent, visage, yeux, cheveux, vêtements sans logo, accessoire signature) qui se termine par \"[PHRASE DE STYLE de ma série]\". Le personnage doit être reconnaissable grâce à un accessoire signature, ne ressembler à aucune personne réelle ni à aucun personnage existant.\n```"}, {"id": "c7", "n": "7", "title": "7. Créer les expressions", "phase": 0, "sum": "Produire, pour chaque personnage, une planche de 6 expressions (neutre, heureux, triste, en colère, surpris, inquiet) qui gardent exactement la même...", "md": "**Ce que tu vas faire.** Produire, pour chaque personnage, une planche de 6 expressions (neutre, heureux, triste, en colère, surpris, inquiet) qui gardent exactement la même identité.\n\n**Pourquoi cette étape existe.** Un épisode de 70 secondes raconte tout par les visages. Si tu as déjà les bonnes expressions en réserve, tu peux les réutiliser comme références pour des plans émotionnels sans que le personnage change.\n\n**Avant de commencer.** L'image maîtresse du personnage (section 9), acceptée dans l'outil d'images. Si tu n'en as pas encore, lis d'abord la section 9.\n\n### Pas à pas\n\n1. Ouvre l'outil d'images (ChatGPT, Gemini ou Leonardo) dans une **nouvelle conversation**, une par personnage.\n2. **Joins l'image maîtresse** du personnage (bouton **+**, ou l'icône trombone, puis **Ajouter des fichiers**).\n3. Colle le prompt d'expression ci-dessous en remplaçant `[ÉMOTION]`. Demande **une seule expression à la fois**.\n4. Compare chaque résultat à l'image maîtresse : même forme, mêmes couleurs, même accessoire. Rejette toute image dont l'identité a changé, même si elle est jolie.\n5. Si l'expression est bonne mais un détail a bougé, demande une **correction ciblée** (prompt 2 ci-dessous), pas une nouvelle génération complète.\n6. Renomme le fichier retenu : `EXPR_Pomme_triste_v01.png`.\n7. Assemble les 6 expressions dans une planche (un Google Doc ou une diapositive avec les 6 images côte à côte).\n\n**À sauvegarder.** Les 6 images par personnage dans `03_PERSONNAGES/NOM/EXPRESSIONS`, et la planche.\n\n**Si le résultat est mauvais.**\n\n- Le visage change : rejoins à nouveau l'image maîtresse et ajoute « garde exactement le même personnage ».\n- L'expression est faible : demande « expression exagérée, style film d'animation ».\n- Le visage se déforme (yeux ou bouche mal placés, dents ou mains étranges) : ajoute « same face and same features as the reference » et demande un plan plus simple, de face, avec une seule expression.\n- Ne demande pas plusieurs changements dans un même prompt (expression, tenue et décor ensemble).\n\n**Prompt 1 : une expression (anglais)**\n\n```\nUse the attached reference image. Keep the character EXACTLY the same: identical shape, colors, face, clothes and accessories. Only change the facial expression to: [EMOTION]. Same pose, plain light grey background, no text, vertical format.\n```\n\nTraduction : utilise l'image de référence jointe. Garde le personnage EXACTEMENT identique : même forme, couleurs, visage, vêtements et accessoires. Change seulement l'expression du visage en : \\[ÉMOTION\\]. Même pose, fond gris clair uni, sans texte, format vertical.\n\n**Prompt 2 : correction ciblée (anglais)**\n\n```\nKeep everything identical. Only change: the eyes look to the right and the mouth is slightly open in surprise.\n```\n\nTraduction : garde tout identique. Change seulement : les yeux regardent vers la droite et la bouche est légèrement ouverte de surprise.\n\n| Émotion à demander (`[EMOTION]`) | Comment l'écrire |\n| --- | --- |\n| Neutre | calm neutral expression |\n| Heureux | warm happy smile |\n| Triste | sad, teary eyes, lowered eyebrows |\n| En colère | angry, furrowed eyebrows, tight mouth |\n| Surpris | wide open eyes, mouth open in surprise |\n| Inquiet | worried, raised eyebrows, small tense mouth |"}, {"id": "c8", "n": "8", "title": "8. Créer les décors", "phase": 0, "sum": "Produire une image maîtresse pour chacun de tes 3 à 5 lieux principaux, sans personnage, avec des objets permanents qui ne changent jamais.", "md": "> [Ouvrir l'annexe H, partie D](#mvrm72sfxts.296651) : les prompts officiels de décors et d'objets. Le choix entre photo libre de droits et image générée est à la fin de cette section.\n\n**Ce que tu vas faire.** Produire une image maîtresse pour chacun de tes 3 à 5 lieux principaux, sans personnage, avec des objets permanents qui ne changent jamais.\n\n**Pourquoi cette étape existe.** Quand la table de la cuisine change de forme d'un plan à l'autre, le spectateur sent que quelque chose cloche sans savoir pourquoi. Un décor stable donne l'impression d'un vrai monde.\n\n**Avant de commencer.** Ta fiche univers (section 4) avec la liste des lieux, ton style visuel et ta palette.\n\n### Pas à pas\n\n1. **Commence par 3 lieux** : le lieu principal, un lieu d'intimité (arrière-boutique, cuisine, bureau) et un lieu extérieur. Tu en ajouteras plus tard.\n2. **Pour chaque lieu, écris une description fixe en anglais** de 40 à 60 mots : type de lieu, matériaux, couleurs, objets permanents, heure de la journée, lumière, style. Termine par la même phrase de style que pour les personnages.\n3. **Note 3 à 5 objets permanents** par lieu (par exemple : une balance en cuivre, un panneau « Fruits du jour », une horloge, trois cagettes bleues). Ils reviendront dans chaque plan pour que le spectateur reconnaisse l'endroit.\n4. **Génère le lieu vide** avec le prompt ci-dessous. Fais 3 ou 4 essais.\n5. **Garde la meilleure image** : lisible, sans texte déformé, avec de la place pour placer des personnages.\n6. **Crée 2 angles secondaires** à partir de cette image (vue plus serrée, vue de côté), en demandant « même lieu, même mobilier, autre angle ».\n7. Renomme : `DECOR_marche_MASTER_v01.png`, `DECOR_marche_angle2_v01.png`.\n\n**À sauvegarder.** Les images dans `04_DECORS/NOM_DU_LIEU`, la liste des objets permanents dans la bible, la description anglaise dans `06_descriptions_visuelles`.\n\n**Si le résultat est mauvais.**\n\n- Les meubles changent à chaque essai : joins l'image maîtresse du lieu à chaque nouvelle demande.\n- Il y a du texte illisible sur les panneaux : demande « no text, no letters », et ajoute les vrais mots au montage.\n- Le décor est trop chargé : supprime la moitié des objets. L'animation gère mal les décors surchargés.\n- Ne demande pas un nouveau décor à chaque plan sans référence.\n\n**Prompt à copier (anglais)**\n\n```\nEstablishing shot of a small neighborhood fruit market street, cobblestones, six wooden stalls with striped awnings, three blue crates on the left, a copper scale on the central stall, a chalkboard sign on the right, warm late afternoon light, empty of characters, no text, no letters, no logos, semi-realistic 3D animated film style, soft cinematic lighting, vertical 9:16\n```\n\nTraduction : plan d'ensemble d'une petite rue de marché de fruits de quartier, pavés, six étals en bois avec des auvents rayés, trois cagettes bleues à gauche, une balance en cuivre sur l'étal central, une ardoise à droite, lumière chaude de fin d'après-midi, sans personnage, sans texte ni lettres, style film d'animation 3D stylisé, lumière douce façon film, format vertical 9:16.\n\n### Photo libre de droits ou image générée : choisir la source de chaque décor\n\nUn décor peut venir de deux sources : une photo trouvée sur une banque d'images libres de droits, ou une image générée par l'IA. Dans une série animée, une photo ne s'utilise presque jamais telle quelle : elle sert de modèle, puis l'IA la redessine dans le style de ta série.\n\n| Situation | Source conseillée | Pourquoi |\n| --- | --- | --- |\n| Lieu inventé (école magique, vaisseau, marché de ton univers) | Génération IA | Aucune photo ne peut le montrer, et tu contrôles la palette et les objets |\n| Lieu réel et reconnaissable (quai de métro, cour d'immeuble, boulangerie, plage) | Photo comme modèle, puis redessin par l'IA | La photo donne une architecture et une lumière crédibles, l'IA la met dans ton style |\n| Style réaliste ou semi-réaliste | Photo comme modèle | Les proportions et la perspective d'une vraie photo évitent les pièces qui « sonnent faux » |\n| Style dessin animé plat, poupée, jouet | Génération IA, avec une photo seulement pour l'agencement | Une photo trop détaillée casse la simplicité du style |\n| Matière ou lumière précise (bois ancien, carrelage, coucher de soleil) | Photo comme référence de texture ou de lumière | Tu montres à l'IA ce que les mots décrivent mal |\n\n**Les trois banques gratuites les plus utilisées, et ce que leur licence dit** (pages officielles lues le 30 septembre 2026) :\n\n| Banque | Ce qui est permis | Ce qui est interdit ou à surveiller |\n| --- | --- | --- |\n| [Unsplash](https://unsplash.com/license) | Télécharger, copier, modifier et utiliser gratuitement, y compris pour un usage commercial, sans demander la permission ni citer l'auteur | Compiler des images d'Unsplash pour créer un service similaire ou concurrent |\n| [Pexels](https://www.pexels.com/license/) | Utilisation gratuite, modification autorisée, usage commercial, citation facultative | Montrer une personne identifiable sous un jour défavorable ou choquant, suggérer qu'une personne ou une marque visible soutient ton produit, revendre la photo sans la modifier, l'utiliser dans une marque ou un logo |\n| [Pixabay](https://pixabay.com/service/license-summary/) | Utilisation gratuite, sans citation obligatoire, modification et adaptation autorisées | Usage commercial d'une image qui contient une marque ou un logo reconnaissable, usage trompeur, revente de l'image seule, impression sur des produits vendus |\n\nCes résumés ne remplacent pas la licence complète : relis-la au moment du téléchargement, car elle peut changer.\n\n**Les règles de prudence pour un décor photo.**\n\n1. **Pas de personnes reconnaissables.** Choisis des lieux vides, ou demande à l'IA de retirer toute personne. Tu évites ainsi toute question de droit à l'image et de ressemblance.\n2. **Pas de marques ni de logos.** Enseignes, affiches, emballages, voitures dont le logo se voit : retire-les ou choisis une autre photo. Pixabay l'interdit même pour un usage commercial.\n3. **Attention aux lieux célèbres.** Certains bâtiments ou éclairages sont protégés pour un usage commercial (l'éclairage nocturne de la tour Eiffel est l'exemple le plus connu, à vérifier avant usage). Préfère des lieux ordinaires et anonymes.\n4. **Garde une trace de chaque licence.** Dans `04_DECORS/_licences`, note pour chaque photo : le lien de la page, le nom de l'auteur, la date de téléchargement et une capture d'écran de la licence. Si une plateforme te pose la question un jour, tu as la preuve.\n5. **Cherche déjà en vertical.** Les trois sites proposent un filtre d'orientation : choisis « portrait » ou « vertical ». Sinon, demande à l'IA d'agrandir l'image en 9:16 (prompt plus bas).\n6. **Tape tes recherches en anglais** : `empty classroom`, `small kitchen morning light`, `rainy street night`, `school corridor`. Les résultats sont bien plus nombreux.\n\n**Prompt 1 : transformer une photo en décor de ta série (anglais).**\n\n```\nUsing the provided photo as a layout reference only, recreate this place in [PHRASE DE STYLE de ma série]. Keep the layout, the position of the main furniture and the direction of the light. Remove all people, text, signs and logos. Simplify small details. Use this color palette: [tes 5 couleurs]. Empty of characters, vertical 9:16.\n```\n\nTraduction : utilise la photo fournie seulement comme référence d'agencement et recrée ce lieu dans \\[ton style\\]. Garde l'agencement, la place des meubles principaux et la direction de la lumière. Retire toutes les personnes, tous les textes, panneaux et logos. Simplifie les petits détails. Utilise cette palette : \\[tes couleurs\\]. Sans personnage, vertical 9:16.\n\n**Prompt 2 : passer une photo horizontale en vertical (anglais).**\n\n```\nExtend this image to a vertical 9:16 format. Continue the floor, the walls and the ceiling naturally above and below. Keep the existing part exactly the same, same style and same lighting. Add no people and no text.\n```\n\nTraduction : agrandis cette image au format vertical 9:16. Prolonge naturellement le sol, les murs et le plafond vers le haut et vers le bas. Garde la partie existante exactement identique, même style et même lumière. N'ajoute ni personne ni texte.\n\n**Prompt 3 : utiliser une photo seulement pour la matière ou la lumière (anglais).**\n\n```\nCreate [description fixe du lieu] in [PHRASE DE STYLE de ma série]. Use the attached photo only as a reference for the [wood texture / evening light / tiles], not for the layout. Empty of characters, no text, vertical 9:16.\n```\n\nTraduction : crée \\[ton lieu\\] dans \\[ton style\\]. Utilise la photo jointe seulement comme référence pour \\[la texture du bois, la lumière du soir, le carrelage\\], pas pour l'agencement. Sans personnage, sans texte, vertical 9:16.\n\n**Régler la force de la transformation.** Certains outils ont un curseur qui dit à quel point l'image d'origine doit être respectée (il s'appelle par exemple « structure » ou « influence »). Plus il est haut, plus l'agencement de la photo est gardé ; plus il est bas, plus le style prend le dessus. Un outil de ce type conseille une valeur moyenne pour garder la composition ([Scenario, officieux](https://help.scenario.com/en/articles/restyle/)). Avance par petits pas plutôt que de pousser le curseur à fond. Si ton outil n'a pas de curseur, joue sur les mots : « keep the layout exactly » pour respecter la photo, « loosely inspired by » pour s'en éloigner.\n\n### Rendre chaque décor cohérent avec ton univers\n\nUn décor peut être beau et pourtant « sortir » de ta série. Avant de valider une image maîtresse de décor, vérifie ces huit points.\n\n- [ ] **Même style** que les personnages : même rendu (3D, 2D, poupée), même niveau de détail. Un décor plus réaliste que le personnage casse l'illusion.\n- [ ] **Même palette** : les couleurs de ta fiche univers dominent. Ajoute-les dans le prompt.\n- [ ] **Même époque et même pays** : si ta série se passe en France aujourd'hui, pas de prises électriques américaines, pas de bus scolaire jaune, pas de panneaux en anglais. Précise « in France, present day » dans le prompt.\n- [ ] **Même échelle** : les portes, les chaises et les tables ont la bonne taille pour tes personnages. Pour des personnages miniatures ou des enfants, dis-le.\n- [ ] **Même lumière** pour une même heure de la journée. Fais dès le départ une version jour et une version nuit de chaque lieu récurrent.\n- [ ] **Objets repères** présents et à la bonne place (les 3 à 5 objets permanents de l'étape 3).\n- [ ] **Aucun texte, logo ou personne** qui traîne.\n- [ ] **De la place** pour les personnages et pour les sous-titres dans le tiers bas.\n\n**Dessine le plan du lieu vu de dessus.** Un croquis très simple sur une feuille suffit : où sont la porte, la fenêtre, la table, le canapé. Garde-le dans `04_DECORS`. Quand tu décris un plan, tu sais ainsi ce qui se trouve derrière le personnage selon l'angle de caméra, et la fenêtre ne change pas de mur d'un plan à l'autre. C'est la même logique que la règle des 180 degrés au cinéma : dans une conversation, chaque personnage reste du même côté de l'écran.\n\n**La fiche décor complète** (une par lieu, dans ta bible) : nom du lieu, description fixe en anglais, image maîtresse, 2 angles secondaires, version jour et version nuit, liste des objets repères avec leur place, plan vu de dessus, source (généré ou photo, avec le lien de la licence).\n\n**Prompt 4 : faire vérifier la cohérence par ton assistant (Claude, ChatGPT ou Gemini, avec les images jointes).**\n\n```\n<task>\nCompare cette image de décor avec ma fiche univers et l'image maîtresse de mon personnage principal.\n<\/task>\n\n<context>\nFiche univers : [colle le style, la palette, l'époque, le pays]. Objets repères de ce lieu : [liste].\n<\/context>\n\n<output_format>\nPour chacun de ces points, réponds conforme ou non conforme, avec la correction à demander en anglais : style, palette, époque et pays, échelle, lumière, objets repères, texte ou logos visibles, place laissée aux personnages et aux sous-titres.\n<\/output_format>\n```\n\nPour aller plus loin sur les décors : les prompts officiels de décors et d'objets sont dans l'[annexe H, partie D](#mvrm72sfxts.296651), et la façon de joindre un décor en référence dans chaque outil dans l'[annexe K](#mvrm72sfxts.296318)."}, {"id": "c9", "n": "9", "title": "9. Construire les références maîtresses", "phase": 0, "sum": "Créer, choisir et protéger l'image officielle de chaque personnage (le « Character Reference Pack ») et de chaque lieu.", "md": "> [Ouvrir l'annexe H, partie B](#mvrm72sfxts.296565) : les modèles officiels pour créer une image.\n>\n> [Ouvrir l'annexe H, partie C](#mvrm72sfxts.296602) : les modèles officiels pour retoucher une image.\n>\n> [Ouvrir l'annexe K, partie B](#mvrm72sfxts.297056) : les nouvelles fonctions de référence des outils.\n\n**Ce que tu vas faire.** Créer, choisir et protéger l'image officielle de chaque personnage (le « Character Reference Pack ») et de chaque lieu.\n\n**Pourquoi cette étape existe.** C'est le cœur technique de tout le guide. Sans image de référence, ton héroïne aura des yeux bleus à l'épisode 1, marron à l'épisode 2 et une autre forme de visage à l'épisode 3. Avec elle, tu redonnes à l'IA la même image à chaque fois.\n\n**Avant de commencer.** Tes descriptions visuelles fixes (sections 6 et 8), un compte dans l'un des outils d'images ci-dessous, un dossier `03_PERSONNAGES`.\n\n### Quel outil d'images choisir\n\n| Outil | Gratuit ? | Prix payant (vérifié le 29 septembre 2026) | Points forts | Point d'attention |\n| --- | --- | --- | --- | --- |\n| [ChatGPT](https://chatgpt.com/fr-FR/pricing/) | Oui, quelques images par jour (chiffre non publié par OpenAI) | Offres Go, Plus, Pro (prix en euros à lire sur la page de tarifs) | Respecte bien les longs prompts, modifie une image jointe avec précision | Le quota gratuit est trop lent pour une série |\n| [Gemini (Nano Banana)](https://gemini.google/fr/subscriptions/?hl=fr) | Oui, quota quotidien variable | Google AI Plus 4,99 € par mois, AI Pro 21,99 € par mois | Comprend le français, accepte plusieurs images de référence | Le quota gratuit change sans prévenir |\n| [Leonardo](https://leonardo.ai/pricing/) | Oui, 150 jetons par jour | Essential 12 $ par mois (8 500 jetons), Premium 30 $ (25 000), Ultimate 60 $ (60 000) ; 20 % de réduction à l'année | Références d'images, modèles personnalisés | Sur l'offre gratuite, tes créations sont publiques |\n| [Midjourney](https://docs.midjourney.com/hc/en-us/articles/27870484040333-Comparing-Midjourney-Plans) | Non | Basic 10 $ par mois, Standard 30 $, Pro 60 $, Mega 120 $ ; 20 % de réduction à l'année | Rendu très soigné, images illimitées dès Standard (mode Relax) | Prompts en anglais, prise en main plus longue |\n\n**Mon conseil pour débuter :** commence gratuitement avec Gemini ou ChatGPT. Passe à un abonnement seulement quand tu es bloquée par le quota.\n\n### Pas à pas avec ChatGPT (méthode la plus simple)\n\n1. Va sur chatgpt.com et connecte-toi.\n2. Dans le menu de gauche, ouvre **Projets**, puis **Nouveau projet**. Nomme-le `Serie images`. Un projet garde tes fichiers et tes consignes ensemble.\n3. Dans le projet, démarre une nouvelle conversation.\n4. Colle la description visuelle fixe du personnage dans le prompt maître ci-dessous, puis envoie. L'image se génère dans la conversation. Si l'outil ne génère pas d'image, ajoute « Crée une image » au début ou choisis **Créer une image** dans le menu **+**.\n5. Refais 3 ou 4 essais. Clique sur l'image, puis sur le bouton de téléchargement de la fenêtre qui s'ouvre.\n6. **Choisis la meilleure** avec la grille de contrôle ci-dessous.\n7. Renomme-la `MASTER_Pomme_v01.png` et ajoute-la aux fichiers du projet (bouton **Ajouter des fichiers** dans le projet).\n\n### La même chose avec Gemini ou Leonardo\n\n- **Gemini** : va sur gemini.google.com, ouvre une conversation, clique sur le **+** pour joindre l'image, demande la création d'image. Précise « format vertical 9:16 ».\n- **Leonardo** : va sur leonardo.ai, ouvre la section de génération d'images, colle ton prompt, choisis le format vertical. Sur l'offre gratuite, tes images sont publiques : ne mets pas d'histoire secrète dans le prompt.\n\n### Grille de contrôle d'une image maîtresse\n\n1. Vue de face, personnage en pied, fond uni.\n2. Visage lisible, yeux bien placés, bouche visible.\n3. Couleurs conformes à la description.\n4. L'accessoire signature est visible.\n5. Pas de texte, pas de logo, pas de main déformée.\n6. Tu pourrais la reconnaître au milieu de 20 autres personnages.\n\n### Le Character Reference Pack\n\nPour chaque personnage, crée au minimum : vue de face, vue de trois quarts, profil, corps entier, et les 6 expressions de la section 7. Range-les dans un dossier `03_PERSONNAGES/NOM/MASTER`.\n\n**Cinq règles pour garder le même visage partout.**\n\n1. Joins toujours l'image maîtresse avec le prompt du plan.\n2. Recopie mot pour mot la même description fixe. Ne la reformule jamais.\n3. Change une seule chose à la fois : la pose, ou l'expression, ou le décor.\n4. Deux personnages au maximum par image.\n5. Ne compte jamais sur une valeur de graine (le numéro qui aide à reproduire une génération) : elle ne garantit pas l'identité.\n\n**À sauvegarder.** Les images maîtresses en version numérotée. Si tu en changes une, crée `MASTER_v02` et garde la `v01`.\n\n**Si le résultat est mauvais.**\n\n- Le personnage change d'un essai à l'autre : joins l'image, et ajoute « keep the character exactly as in the reference ».\n- Le style est instable : ajoute la même phrase de style en fin de chaque prompt.\n- L'IA refuse une consigne : reformule sans nom de personne réelle ni de marque.\n\n**Prompt maître : image de référence d'un personnage (anglais)**\n\n```\nCharacter reference sheet. [Colle la description visuelle fixe du personnage]. Full body, front view, neutral friendly expression, standing, plain light grey background, no text, vertical format. Consistent character design.\n```\n\nTraduction : planche de référence du personnage. \\[Description\\]. En pied, vue de face, expression neutre et aimable, debout, fond gris clair uni, sans texte, format vertical. Design de personnage cohérent.\n\n**Prompt : planche de vues (anglais)**\n\n```\nUsing the attached reference, create a character design sheet: front view, 3/4 view, side view and back view, same character, same outfit, plain light grey background, no text, vertical format.\n```\n\nTraduction : avec la référe
