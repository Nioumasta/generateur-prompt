tre adultes, même animée, vise un public adolescent ou adulte : réponds Non, et garde des sujets, un vocabulaire et des vignettes cohérents avec ce choix. Une série pour les petits (comptines, apprentissage, héros enfant tout doux) doit être déclarée pour enfants. Dans ce cas, certaines fonctions sont limitées sur ces vidéos, par exemple les commentaires et les publicités personnalisées, ce qui réduit les revenus : vérifie la liste exacte sur la page d'aide avant de choisir ton public. Décide ton public dès la [section 1](#mvrm72sfxts.5259), pas au moment de publier."}, {"id": "c30", "n": "30", "title": "30. Publier sur Instagram Reels", "phase": 2, "sum": "Publier ton épisode en Reel pour toucher une autre audience, avec une couverture soignée et l'étiquette IA.", "md": "**Ce que tu vas faire.** Publier ton épisode en Reel pour toucher une autre audience, avec une couverture soignée et l'étiquette IA.\n\n**Termes expliqués.**\n\n- *Reel* : le format de vidéo verticale courte d'Instagram.\n- *Compte professionnel* : un type de compte Instagram (créateur ou entreprise) qui donne accès aux statistiques.\n- *Grille* : la page de profil où s'affichent tes publications. Sa couverture doit rester cohérente.\n\n**Pourquoi cette étape existe.** Instagram sert surtout à fidéliser et à construire une image de série. Il ne verse pas de rémunération par vue (section 36), mais il ouvre la porte aux partenariats.\n\n**Avant de commencer.** Ton master, une image de couverture 9:16 avec le titre, une biographie claire.\n\n### Pas à pas\n\n1. **Crée le compte** (ou passe-le en compte professionnel de type **Créateur** dans **Paramètres**, puis **Type de compte**). Cela donne accès aux statistiques.\n2. **Biographie** : « Série de fiction animée créée avec l'IA. Un épisode par jour. » et le lien vers les autres plateformes.\n3. Appuie sur **+**, puis **Reel**, et choisis ton master dans la galerie.\n4. Instagram peut proposer d'éditer : à ce stade, ne modifie rien, ton montage est déjà terminé. Appuie sur **Suivant**.\n5. **Couverture** : choisis ou importe une image 9:16 lisible, avec le personnage et le titre. Ajuste le cadrage pour que le texte reste visible dans la grille.\n6. **Légende** : une accroche, la mention « Série de fiction créée avec l'IA », 3 à 5 hashtags.\n7. **Étiquette IA** : active l'option d'information sur l'IA si Instagram la propose au moment de la publication (elle peut s'appeler **Info IA** ou **Contenu généré par IA**). Voir la section 32.\n8. **Partage** aussi le Reel sur Facebook si l'option apparaît (fonction de partage croisé).\n9. Appuie sur **Partager**.\n\n**À sauvegarder.** L'adresse du compte, le lien de chaque Reel, la légende utilisée et une capture d'écran des statistiques après 24 heures.\n\n**Si le résultat est mauvais.**\n\n- Faible portée : Instagram met plus en avant les vidéos qui donnent envie d'envoyer à un ami. Ajoute un moment drôle ou surprenant.\n- Une musique disponible dans l'application est refusée après coup : garde toujours tes propres pistes.\n- Le compte semble s'épuiser : ne publie pas dix Reels le même jour. Un ou deux suffisent.\n\n**Prompt à copier (Claude) : légende Instagram**\n\n```\nRédige 5 légendes Instagram en français pour un Reel de ma série de fiction animée [résumé]. Chaque légende : une accroche, une question au public, la mention « Série de fiction créée avec l'IA », 4 hashtags. Ton chaleureux et drôle, sans exagération.\n```"}, {"id": "c31", "n": "31", "title": "31. Publier sur Facebook Reels", "phase": 2, "sum": "Créer une Page Facebook pour ta série et y publier tes épisodes en Reels.", "md": "**Ce que tu vas faire.** Créer une Page Facebook pour ta série et y publier tes épisodes en Reels.\n\n**Termes expliqués.**\n\n- *Page* : un profil public pour une marque, une série ou un créateur (différent de ton profil personnel).\n- *Meta Business Suite* : l'outil gratuit de Meta pour gérer les Pages et Instagram, y compris programmer des publications.\n- *Reel Facebook* : la vidéo verticale courte de Facebook.\n\n**Pourquoi cette étape existe.** Facebook reste utile pour un public plus âgé et pour le partage entre proches. Son programme de monétisation est sur invitation (section 37), donc c'est un canal de diffusion avant d'être une source de revenus.\n\n**Avant de commencer.** Un compte Facebook personnel (obligatoire pour créer une Page), ton master, la photo de profil de la série.\n\n### Pas à pas\n\n1. Sur facebook.com, ouvre le menu **Pages**, puis **Créer une nouvelle Page**.\n2. **Nom de la Page** : celui de la série. **Catégorie** : choisis une catégorie proche (Divertissement, Créateur numérique).\n3. Ajoute la photo de profil et une couverture, puis une description : « Série de fiction animée créée avec l'IA. »\n4. Ouvre **Meta Business Suite** (lien dans le menu de la Page).\n5. Clique sur **Créer un Reel**, puis importe ton master.\n6. **Description** : accroche, mention IA, 3 hashtags.\n7. **Options IA** : si Meta propose de déclarer un contenu généré par IA, coche-la (section 32).\n8. **Programme** l'heure ou publie tout de suite.\n9. **Invite** tes proches à aimer la Page : ce n'est pas de la triche, cela donne un premier public.\n\n**À sauvegarder.** L'adresse de la Page, les liens des Reels, les statistiques du premier mois.\n\n**Si le résultat est mauvais.**\n\n- Peu de vues : Facebook favorise les contenus qui suscitent des réactions. Pose une question dans la description.\n- Message d'infraction : Meta détecte parfois des contenus recyclés. Publie tes propres Reels, ne partage pas des extraits trouvés ailleurs.\n- Difficulté d'accès : une Page se gère depuis un profil personnel réel. Ne crée pas de faux profil.\n\n**Prompt à copier (Claude) : description Facebook**\n\n```\nRédige 3 descriptions Facebook en français pour un Reel de ma série de fiction animée [résumé]. Chaque description : une accroche, une question ouverte au public, la mention « Série de fiction créée avec l'IA », 3 hashtags. Ton simple et chaleureux pour un public familial.\n```"}, {"id": "c32", "n": "32", "title": "32. Étiqueter un contenu créé avec l'IA", "phase": 2, "sum": "Signaler clairement que ta série est créée avec l'intelligence artificielle, sur chaque plateforme et dans chaque épisode.", "md": "> [Ouvrir l'annexe K, partie E](#mvrm72sfxts.297155) : les précisions officielles de YouTube sur l'étiquette IA.\n\n**Ce que tu vas faire.** Signaler clairement que ta série est créée avec l'intelligence artificielle, sur chaque plateforme et dans chaque épisode.\n\n**Pourquoi cette étape existe.** C'est à la fois une règle des plateformes, une obligation qui se renforce en Europe et une question de confiance avec ton public. Ne pas signaler peut entraîner la suppression d'une vidéo ou des restrictions de monétisation.\n\n**Avant de commencer.** Ta liste de plateformes (sections 28 à 31).\n\n### Ce que chaque plateforme demande (vérifié le 29 septembre 2026, avec les limites indiquées)\n\n| Plateforme | Ce que tu fais | Fiabilité de la source |\n| --- | --- | --- |\n| TikTok | Activer le réglage de contenu généré par IA au moment de la publication | Pages officielles bloquées à la lecture, information issue de sources secondaires : à confirmer dans l'application |\n| YouTube | Répondre à la question « contenu modifié ou synthétique » dans YouTube Studio | Pages d'aide officielles Google consultées |\n| Instagram et Facebook | Utiliser l'option d'information IA de Meta quand elle est proposée | Page de transparence de Meta non lisible : à confirmer dans l'application |\n\n### La règle européenne en clair\n\n- Le règlement européen sur l'intelligence artificielle (article 50) impose la transparence sur les contenus générés ou modifiés par IA, notamment ceux qui ressemblent à des personnes, des lieux ou des événements réels (les « hypertrucages »).\n- D'après les sources consultées, l'obligation pour ceux qui diffusent (les « déployeurs ») s'applique depuis le 2 août 2026. Un délai existe jusqu'au 2 décembre 2026 pour le marquage technique à la charge des fournisseurs d'outils.\n- Pour des contenus manifestement artistiques ou fictionnels, l'obligation est allégée : la mention doit exister sans gêner l'œuvre. Mais **mieux vaut signaler**, cela coûte peu.\n- Ces règles évoluent : je ne peux pas te garantir que ce résumé reste exact dans quelques mois. Relis les sources de la fin du guide.\n\n### Pas à pas\n\n1. **Dans chaque épisode**, affiche 2 secondes de texte en fin de vidéo (ou dans le coin) : « Série de fiction créée avec l'IA ».\n2. **Dans chaque description**, écris la même phrase.\n3. **Dans la biographie** de chaque compte, écris la même phrase.\n4. **Active le réglage propre à la plateforme** au moment de la publication (voir le tableau).\n5. **Fais une capture d'écran** du réglage activé, pour prouver ta bonne foi.\n6. **Ne fais jamais passer** ton contenu pour du réel : pas de fausse interview, pas de faux témoignage, pas de personne réelle imitée.\n\n**À sauvegarder.** Les captures, la phrase standard, et la date de vérification des règles.\n\n**Si le résultat est mauvais.**\n\n- La plateforme t'ajoute elle-même une étiquette : laisse-la, ne la contourne pas.\n- Ta vidéo est retirée pour « contenu trompeur » : fais appel en montrant tes captures et ta phrase standard.\n- Tu as un doute sur un plan très réaliste : étiquette-le. Le coût d'une étiquette de trop est minime.\n\n**Prompt à copier (Claude) : phrase d'étiquetage**\n\n```\nPropose 8 formulations courtes en français (10 mots maximum) pour indiquer qu'une série de fiction est créée avec l'intelligence artificielle : une pour l'écran final, une pour la biographie, une pour la description, une pour un commentaire épinglé. Elles doivent être claires, honnêtes et ne pas décourager le public.\n```"}, {"id": "c33", "n": "33", "title": "33. Droits d'auteur, personnages et licences", "phase": 2, "sum": "Comprendre ce que tu as le droit de faire avec les images, voix et musiques générées, et protéger ta série.", "md": "**Ce que tu vas faire.** Comprendre ce que tu as le droit de faire avec les images, voix et musiques générées, et protéger ta série.\n\n**Avertissement honnête.** Je ne suis pas juriste. Cette section explique les bons réflexes et les points de vigilance. Pour un contrat, un partenariat important ou un litige, consulte un professionnel du droit.\n\n**Pourquoi cette étape existe.** Une série qui marche attire les copies, et parfois des réclamations. Se protéger dès le début coûte peu et évite de tout perdre.\n\n### Les quatre questions à se poser\n\n| Question | Ce qu'il faut savoir |\n| --- | --- |\n| Ai-je le droit d'utiliser commercialement ce que l'outil produit ? | Cela dépend de l'offre de l'outil. Les offres gratuites limitent souvent l'usage commercial (exemple : ElevenLabs Free, section 19). Vérifie les conditions de chaque outil et garde une capture d'écran avec la date |\n| Mes personnages sont-ils vraiment à moi ? | Un personnage inventé par toi, avec ton scénario, ton nom et ton histoire, est bien plus facile à défendre qu'un personnage généré sans direction. Plus ton apport créatif est visible (bible, textes, choix), mieux c'est |\n| Est-ce que je copie quelqu'un ? | Ne reproduis jamais un personnage, un logo, une marque ou une œuvre existante, même « dans le style de ». Ne copie pas non plus la série d'un autre créateur |\n| Y a-t-il une personne réelle ? | Ne reproduis ni le visage, ni la voix, ni le nom d'une personne réelle sans son accord écrit. Avec des visages humains en 3D, vérifie aussi qu'aucun personnage ne ressemble à une personne connue ou à quelqu'un de ton entourage |\n\n### Ce qu'il faut savoir sur l'IA et le droit d'auteur\n\n- Dans plusieurs pays, dont la France, la protection par le droit d'auteur suppose un apport créatif humain. Un contenu produit entièrement par une machine, sans choix humain, est plus difficile à protéger.\n- Ce point est encore discuté et évolue. Ne pars pas du principe qu'une image générée est automatiquement protégée.\n- Ton meilleur atout est la preuve de ta création : bible, textes, prompts, versions successives, choix de montage.\n\n### Pas à pas pour te protéger\n\n1. **Conserve tes preuves** : bible de série, scripts, prompts, images de référence, versions datées dans le dossier `01_CONCEPT` et `13_JURIDIQUE`.\n2. **Note les licences** de chaque outil, avec la date et une capture d'écran des conditions.\n3. **Date ta création** : envoie-toi par e-mail la bible de série (la date d'envoi sert de repère) et fais une copie dans un stockage séparé.\n4. **Vérifie ton nom** : cherche le nom de ta série sur les moteurs de recherche, sur TikTok, YouTube, Instagram et dans la base de l'INPI (institut français de la propriété industrielle) avant de le fixer.\n5. **Pense à la marque** : si tu envisages des produits dérivés (section 39), déposer le nom de la série à l'INPI est une option à étudier. Renseigne-toi sur le coût actuel sur le site de l'INPI.\n6. **Ajoute une mention** dans la description : « Personnages et univers originaux ».\n7. **Surveille les copies** : fais une recherche du nom de ta série tous les mois.\n\n**À sauvegarder.** Le dossier de preuves, les captures de licences, la recherche d'antériorité sur le nom.\n\n**Si le résultat est mauvais.**\n\n- Une réclamation arrive : ne panique pas, lis précisément ce qui est contesté. Si c'est la musique, remplace-la. Si c'est un personnage, montre tes preuves de création.\n- Quelqu'un copie ta série : garde des captures, utilise les formulaires de signalement des plateformes, puis demande conseil à un professionnel si c'est sérieux.\n- Un outil change ses conditions : relis-les et conserve les anciennes versions.\n\n**Prompt à copier (Claude) : contrôle d'originalité**\n\n```\nVoici la fiche de mon personnage [colle-la]. Analyse-la et dis-moi : quels éléments ressemblent trop à un personnage, une marque ou une série existante que tu connais ? Propose des modifications pour rendre le personnage nettement plus original (silhouette, couleurs, accessoire, nom, tic de langage). Précise que tu n'es pas juriste et que je devrai vérifier moi-même.\n```"}, {"id": "c34", "n": "34", "title": "34. Monétisation TikTok", "phase": 3, "sum": "Comprendre comment TikTok peut rémunérer une série, ce que tu dois remplir comme conditions, et ce que tu peux attendre honnêtement.", "md": "**Ce que tu vas faire.** Comprendre comment TikTok peut rémunérer une série, ce que tu dois remplir comme conditions, et ce que tu peux attendre honnêtement.\n\n**Avertissement sur les sources.** Les pages officielles de TikTok n'ont pas pu être lues pendant cette vérification (accès bloqué). Les informations ci-dessous viennent de sources secondaires récentes. Confirme chaque condition dans l'application TikTok, menu **Outils pour les créateurs**, avant de t'organiser autour d'elle.\n\n**Termes expliqués.**\n\n- *Programme de rémunération des créateurs* (Creator Rewards Program) : le programme qui paie les créateurs selon les vues qualifiées de leurs vidéos.\n- *Vue qualifiée* : une vue comptabilisée par TikTok pour le calcul, ce qui exclut par exemple les vues de robots ou les vues très courtes.\n- *RPM* : la rémunération pour 1 000 vues.\n\n**Pourquoi cette étape existe.** Beaucoup de débutants pensent que 100 000 vues rapportent un salaire. Ce n'est pas le cas. Mieux vaut connaître les conditions et les ordres de grandeur avant de te lancer.\n\n### Conditions du programme (d'après des sources secondaires, à confirmer)\n\n| Condition | Valeur indiquée |\n| --- | --- |\n| Âge | 18 ans ou plus |\n| Type de compte | compte personnel |\n| Abonnés | au moins 10 000 |\n| Vues | au moins 100 000 sur les 30 derniers jours |\n| Durée des vidéos éligibles | au moins 1 minute |\n| Originalité | contenu original, de qualité |\n| Pays | disponibilité variable : à vérifier pour la France |\n\n**Conséquence pour ta série.** Une vidéo de moins d'une minute ne compte pas pour ce programme. C'est pour cela que la section 27 conseille 65 à 90 secondes.\n\n### Ordres de grandeur honnêtes\n\nLa rémunération par 1 000 vues varie beaucoup selon le pays du public, le sujet et la saison. Les chiffres publiés par les créateurs sont souvent faibles (de quelques dixièmes d'euro à environ 1 € pour 1 000 vues qualifiées) et sans garantie. Ne prends aucune de ces valeurs comme une promesse. Dans un test de 30 jours, considère les gains comme un bonus éventuel, pas comme un objectif.\n\n### Pas à pas\n\n1. Dans l'application, ouvre **Profil**, puis le menu (trois lignes), puis **Outils pour les créateurs** ou **Creator Tools**.\n2. Cherche la rubrique **Programme de rémunération des créateurs** (le nom peut varier).\n3. Lis les conditions affichées pour ton compte : ce sont elles qui comptent.\n4. Si l'option n'apparaît pas, ton compte ne remplit pas encore les conditions. Note l'écart (abonnés, vues, âge).\n5. Publie régulièrement des vidéos de plus d'une minute, originales, avec l'étiquette IA activée.\n6. **N'achète jamais** d'abonnés ni de vues : cela fait perdre l'accès au programme.\n7. Quand tu es éligible, renseigne ton moyen de paiement dans la rubrique prévue, puis note chaque mois la rémunération reçue dans ton suivi (section 40).\n\n### Autres sources de revenus TikTok\n\nCertains créateurs reçoivent aussi des cadeaux virtuels en direct ou vendent via la boutique de TikTok. Ces options ont leurs propres conditions (âge, abonnés, pays) : vérifie-les dans l'application.\n\n**À sauvegarder.** Une capture des conditions affichées dans ton application, avec la date, et le suivi mensuel des vues et de la rémunération.\n\n**Si le résultat est mauvais.**\n\n- Le programme n'est pas disponible dans ton pays : continue à publier pour construire l'audience et les partenariats (section 38), puis concentre-toi sur YouTube.\n- Tu es proche des seuils mais tu stagnes : regarde la rétention (section 40) et améliore le hook (section 25).\n- Ton contenu est jugé répétitif : varie les intrigues et les décors (section 35).\n\n**Prompt à copier (Claude) : plan de progression vers l'éligibilité**\n\n```\nMon compte TikTok a [nombre] abonnés et [nombre] vues sur 30 jours. Les conditions du programme de rémunération sont : 10 000 abonnés, 100 000 vues sur 30 jours, vidéos d'au moins 1 minute (à vérifier dans mon application). Calcule l'écart et propose un plan sur 60 jours pour l'atteindre : nombre de vidéos, durée, types d'accroches à tester. Indique honnêtement que rien n'est garanti.\n```"}, {"id": "c35", "n": "35", "title": "35. Monétisation YouTube", "phase": 3, "sum": "Comprendre le Programme Partenaire YouTube, ses seuils, les revenus réalistes des Shorts, et la règle sur le contenu inauthentique, qui concerne...", "md": "**Ce que tu vas faire.** Comprendre le Programme Partenaire YouTube, ses seuils, les revenus réalistes des Shorts, et la règle sur le contenu inauthentique, qui concerne directement les séries générées par IA.\n\n**Sources.** Annonce officielle du blog YouTube sur les évolutions du Programme Partenaire (2027) et pages d'aide Google (support.google.com/youtube/answer/72851 et 14328491), consultées le 29 septembre 2026. Les détails peuvent changer : relis-les avant d'agir.\n\n**Termes expliqués.**\n\n- *Programme Partenaire YouTube* (YPP) : le programme qui donne accès aux revenus publicitaires et à d'autres formes de rémunération.\n- *Heures de visionnage publiques* : le temps total passé à regarder tes vidéos publiques.\n- *Vues Shorts valides* : les vues de Shorts comptabilisées par YouTube pour les seuils.\n- *Contenu inauthentique* : contenu de masse, répétitif ou produit sans valeur ajoutée. Ce contenu n'est pas éligible à la monétisation.\n\n**Pourquoi cette étape existe.** YouTube est la plateforme où les règles de monétisation sont les plus lisibles, mais aussi la plus attentive à la qualité des contenus produits en série par IA.\n\n### Les deux paliers du programme\n\n| Palier | Ce qu'il donne | Conditions principales (vérifier les valeurs à jour) |\n| --- | --- | --- |\n| Accès anticipé | Financement par les fans (abonnements de chaîne, Super Chat, etc.) | environ 500 abonnés, 3 vidéos publiques dans les 90 derniers jours, et 3 000 heures de visionnage ou 3 millions de vues Shorts sur 90 jours |\n| Palier complet | Partage des revenus publicitaires | environ 1 000 abonnés, et 4 000 heures de visionnage ou 10 millions de vues Shorts sur 12 mois ou 90 jours selon la règle en vigueur |\n\nUne évolution du programme est annoncée pour le **1er février 2027**. Lis l'annonce du blog officiel de YouTube pour connaître la nouvelle règle avant de fixer ton objectif : c'est elle qui décidera de ton calendrier réel.\n\n### Ordres de grandeur pour les Shorts\n\nLes revenus des Shorts sont bien plus faibles que ceux des vidéos longues. Les créateurs citent en général quelques centimes à quelques dixièmes d'euro pour 1 000 vues, selon le pays du public. Compte plutôt sur : un revenu modeste, mais un canal utile pour faire grandir l'audience et préparer d'autres ressources (sponsoring, produits).\n\n### La règle du contenu inauthentique\n\nYouTube précise qu'il ne monétise pas les contenus de masse ou répétitifs. Une série IA qui montre toujours la même scène avec les mêmes images, sans histoire ni travail créatif, est à risque. Ce qui te protège :\n\n- une histoire réelle qui avance d'un épisode à l'autre ;\n- ta voix, ton écriture, tes choix de montage ;\n- des personnages qui évoluent ;\n- des décors et des situations variés.\n\n### Pas à pas\n\n1. **Ouvre YouTube Studio**, puis **Monétisation** dans le menu de gauche.\n2. **Regarde la page** : elle affiche tes chiffres actuels et les conditions pour ta chaîne.\n3. **Active la validation en deux étapes** sur ton compte Google (obligatoire).\n4. **Note l'écart** avec chaque seuil.\n5. **Quand tu es éligible**, clique sur **Postuler** et accepte les conditions.\n6. **Crée un compte AdSense** (l'outil de paiement de Google) quand il te le demande, avec ton identité réelle et une adresse exacte.\n7. **Attends l'examen** de ta chaîne, qui peut durer quelques semaines.\n8. **Continue de publier** selon les règles pendant l'examen.\n\n**À sauvegarder.** La capture de la page **Monétisation**, la date des seuils, et le suivi mensuel.\n\n**Si le résultat est mauvais.**\n\n- La demande est refusée pour contenu répétitif : renforce l'histoire, varie les décors, ajoute ta voix, et repostule après le délai indiqué.\n- Les vues stagnent : regarde les statistiques de rétention (section 40).\n- Une vidéo est démonétisée : lis le motif dans YouTube Studio, corrige (souvent la musique), puis fais une demande de réexamen.\n\n**Prompt à copier (Claude) : audit anti-contenu répétitif**\n\n```\nVoici les résumés de mes 10 derniers épisodes [colle-les]. Analyse-les comme le ferait un examinateur YouTube : y a-t-il un risque de contenu répétitif ou produit en masse ? Liste les ressemblances (scènes, décors, intrigues), et propose 5 changements concrets pour montrer plus de travail créatif et d'évolution. Sois franc, ne me rassure pas.\n```"}, {"id": "c36", "n": "36", "title": "36. Monétisation Instagram", "phase": 3, "sum": "Comprendre comment on gagne (ou pas) de l'argent avec une série sur Instagram.", "md": "**Ce que tu vas faire.** Comprendre comment on gagne (ou pas) de l'argent avec une série sur Instagram.\n\n**Sources.** Comparatif de monétisation Instagram (kompozy.io) et pages Meta : la page d'aide officielle d'Instagram n'a pas pu être lue. Information à confirmer dans ton application.\n\n**Pourquoi cette étape existe.** Instagram est souvent présenté comme une plateforme de revenus, mais elle ne rémunère pas directement chaque vue de Reel comme TikTok ou YouTube. Il vaut mieux le savoir avant d'y investir du temps.\n\n### Les sources de revenus possibles\n\n| Source | Principe | Disponibilité |\n| --- | --- | --- |\n| Partenariats de marque | Une marque te paie pour parler de son produit | Aucune condition officielle, mais il faut une audience et une image cohérente |\n| Abonnements | Des abonnés paient chaque mois pour du contenu exclusif | Soumis à des conditions de Meta et de pays |\n| Cadeaux (Gifts) | Des spectateurs envoient des cadeaux virtuels | Programme sélectif, à vérifier |\n| Produits et affiliation | Tu vends ou recommandes un produit avec un lien | Dépend du pays et du type de compte |\n| Bonus Reels | Meta a déjà proposé des programmes temporaires | Programmes changeants et souvent sur invitation |\n\n**Ce qui est solide.** Il n'y a pas de rémunération « par vue » garantie sur Instagram. Les revenus viennent surtout des partenariats et des ventes.\n\n### Pas à pas\n\n1. **Passe en compte professionnel** de type **Créateur** (Paramètres, **Type de compte et outils**).\n2. **Ouvre le tableau de bord professionnel** et cherche la rubrique **Outils de monétisation** (ou **Gains**).\n3. **Regarde ce qui est disponible** pour ton pays et ton compte. Note les conditions affichées.\n4. **Mets à jour ta biographie** : ajoute une adresse e-mail professionnelle pour recevoir des propositions.\n5. **Crée un kit de présentation** (section 38).\n6. **N'achète jamais** d'abonnés, de mentions ou de commentaires.\n\n**À sauvegarder.** La capture des outils disponibles, avec la date, et le suivi des messages de marques.\n\n**Si le résultat est mauvais.**\n\n- Aucun outil de monétisation n'apparaît : c'est normal pour un petit compte ou dans certains pays. Concentre-toi sur l'audience et les partenariats.\n- Tu reçois des propositions douteuses (paiement demandé avant de travailler, lien inconnu) : refuse, ce sont souvent des arnaques.\n- Peu d'engagement : varie les formats et pose des questions.\n\n**Prompt à copier (Claude) : bio et pitch pour marques**\n\n```\nRédige une biographie Instagram de 150 caractères maximum pour ma série de fiction animée, créée avec l'IA. Elle doit donner envie de suivre, mentionner la fréquence des épisodes, et inclure une adresse de contact. Ajoute une version alternative plus drôle. Reste honnête : pas de chiffres inventés.\n```"}, {"id": "c37", "n": "37", "title": "37. Monétisation Facebook", "phase": 3, "sum": "Comprendre comment Facebook rémunère les créateurs de Reels, ce qui se passe sur invitation, et comment postuler.", "md": "**Ce que tu vas faire.** Comprendre comment Facebook rémunère les créateurs de Reels, ce qui se passe sur invitation, et comment postuler.\n\n**Sources.** Annonce de Meta sur le Creator Fast Track (mars 2026), page creators.facebook.com sur la monétisation de contenu, et pages de comparaison (creatorsagency.co). Les conditions détaillées peuvent changer et dépendent du pays : confirme dans ton espace créateur.\n\n**Termes expliqués.**\n\n- *Monétisation de contenu Facebook* : le programme qui rémunère les créateurs pour leurs vidéos, Reels et publications.\n- *Sur invitation* : tu ne peux pas postuler librement, Meta t'invite quand ton compte remplit certains critères.\n- *Creator Fast Track* : un dispositif de Meta destiné à accélérer l'entrée de créateurs déjà monétisés ailleurs. Lis la page officielle pour savoir si tu es concerné.\n\n**Pourquoi cette étape existe.** Facebook peut rapporter, mais l'accès est moins prévisible que sur YouTube. Il faut le savoir pour ne pas attendre une opportunité qui ne viendra pas tout de suite.\n\n### Ce qu'il faut savoir\n\n- Le programme est principalement **sur invitation**. Aucun bouton n'est garanti pour tous.\n- Meta demande un contenu **original**, conforme aux règles de la plateforme, publié sur une Page ou un profil professionnel selon les cas.\n- Le contenu recyclé, copié ou agrégé est exclu. Une série originale avec des personnages propres est donc favorable.\n- Les conditions exactes (nombre d'abonnés, minutes de visionnage, ancienneté) changent selon les pays et les périodes.\n\n### Pas à pas\n\n1. **Vérifie ton état** : dans **Meta Business Suite**, ouvre **Monétisation** ou **Outils créateur** (le nom peut varier).\n2. **Lis les conditions** affichées pour ta Page.\n3. **Si une invitation apparaît**, suis les étapes : accepte les conditions, configure le paiement et la fiscalité.\n4. **Si ce n'est pas le cas**, note l'écart et continue à publier au moins 3 fois par semaine des Reels originaux.\n5. **Regarde si le dispositif Creator Fast Track** te concerne, en lisant la page officielle de Meta.\n6. **Ne partage pas** de contenus copiés sur ta Page : cela peut te faire perdre l'accès.\n7. **Garde un suivi mensuel** des vues, des minutes de visionnage et de la rémunération, dans ton tableau (section 40).\n\n**À sauvegarder.** Les captures des conditions et des invitations, avec la date.\n\n**Si le résultat est mauvais.**\n\n- Pas d'invitation après plusieurs mois : ce n'est pas un signal sur la qualité de ta série. Diversifie (YouTube, sponsoring).\n- Ta Page a une limite de portée : cherche un message de Meta sur le contenu, et corrige (souvent musique ou reprise d'images).\n- Tu reçois un message qui propose de payer pour « débloquer la monétisation » : c'est une arnaque.\n\n**Prompt à copier (Claude) : plan Facebook**\n\n```\nMa Page Facebook a [nombre] abonnés et mes Reels font en moyenne [nombre] vues. Je n'ai pas encore d'invitation à la monétisation. Propose un plan de 30 jours pour augmenter la régularité et l'engagement (fréquence, heures, questions au public), en restant sur du contenu 100 % original. Indique honnêtement ce qui ne dépend pas de moi.\n```"}, {"id": "c38", "n": "38", "title": "38. Sponsoring et partenariats", "phase": 3, "sum": "Préparer ce qu'il faut pour être contacté par des marques, négocier calmement et respecter les règles françaises de la publicité par les influenceurs.", "md": "**Ce que tu vas faire.** Préparer ce qu'il faut pour être contacté par des marques, négocier calmement et respecter les règles françaises de la publicité par les influenceurs.\n\n**Avertissement.** Cette section explique les bases. Pour un contrat important, fais-toi relire par un professionnel.\n\n**Termes expliqués.**\n\n- *Sponsoring* : une marque te paie ou t'offre un produit pour que tu parles d'elle.\n- *Kit de présentation* (ou *media kit*) : un document d'une page qui présente ta série, ton audience et tes offres.\n- *Placement de produit* : un produit apparaît dans ton épisode (par exemple, un personnage tient une bouteille de marque).\n\n**Pourquoi cette étape existe.** Sur un petit compte, le sponsoring rapporte souvent plus que la monétisation directe. Mais il exige de la méthode et de la transparence.\n\n**Avant de commencer.** Au moins 10 épisodes publiés, des statistiques de vues, une adresse e-mail professionnelle.\n\n### Ce que la loi française demande (d'après des sources spécialisées en droit, à vérifier auprès d'un professionnel)\n\n- Tu dois signaler clairement toute collaboration commerciale, par exemple avec les mentions **« Publicité »** ou **« Collaboration commerciale »**, visibles pendant le contenu.\n- Une **image créée ou retouchée par IA** dans un contenu d'influence doit être signalée (mention type **« Image virtuelle »**). Dans ta série de fiction, garde la mention IA en plus.\n- Un **contrat écrit** est obligatoire pour une collaboration rémunérée importante, avec les missions, la rémunération et les mentions.\n- Les détails varient selon le montant et la nature de l'accord : renseigne-toi sur un site officiel ou auprès d'un professionnel.\n\n### Pas à pas\n\n1. **Crée ton kit de présentation** sur une page : nom de la série, concept en 2 phrases, plateformes, nombre d'abonnés et de vues moyennes, profil de l'audience (statistiques réelles), exemples d'épisodes, formats proposés, coordonnées.\n2. **N'invente aucun chiffre.** Une marque vérifie facilement.\n3. **Choisis 10 marques** dont l'univers va bien avec ta série (cuisine, jardinage, alimentation, papeterie pour enfants, etc.). Évite les produits inadaptés à un public familial.\n4. **Envoie un message court et personnalisé** à chaque marque, avec le lien de ta série et ton kit.\n5. **Quand une marque répond**, demande son objectif, sa durée, sa cible et son budget.\n6. **Propose un prix ferme** avec des livrables clairs (par exemple 1 épisode + 1 reprise par plateforme).\n7. **Écris un devis**, puis un contrat avec les mentions obligatoires.\n8. **Publie avec les mentions** exigées, garde les preuves de publication.\n9. **Ne fais jamais** de promesse de résultat (« tu vendras 1 000 produits »).\n\n### Combien demander\n\nLes tarifs varient très fortement. Au début, cherche un accord modeste avec un produit et un petit paiement pour construire des références, plutôt que d'annoncer un tarif élevé sans historique.\n\n**À sauvegarder.** Le kit de présentation, les échanges avec chaque marque, les devis, contrats et factures.\n\n**Si le résultat est mauvais.**\n\n- Aucune réponse : c'est courant. Améliore le kit, cible mieux, relance une fois après 10 jours.\n- Une marque veut plus que ce qui a été convenu : renvoie au devis écrit.\n- Un partenaire demande de l'argent avant le travail : refuse, c'est presque toujours une arnaque.\n\n**Prompt à copier (Claude) : message à une marque**\n\n```\nRédige un message de prospection en français de 120 mots maximum pour proposer un partenariat à la marque [nom]. Ma série : [description en 2 phrases], créée avec l'IA, [nombre] vues moyennes par épisode (chiffre réel). Propose un format concret (placement dans un épisode) et indique que la collaboration sera signalée conformément à la loi. Ton poli, direct, sans exagération.\n```"}, {"id": "c39", "n": "39", "title": "39. Produits dérivés", "phase": 3, "sum": "Tester si ton public est prêt à acheter des produits liés à ta série, sans risque financier important.", "md": "**Ce que tu vas faire.** Tester si ton public est prêt à acheter des produits liés à ta série, sans risque financier important.\n\n**Termes expliqués.**\n\n- *Produit dérivé* (ou *merchandising*) : un objet ou un contenu vendu autour d'une série (t-shirts, autocollants, mugs, fonds d'écran).\n- *Impression à la demande* : un service qui imprime chaque commande à l'unité, sans stock à préparer.\n- *Produit numérique* : un fichier vendu ou offert (coloriages, affiches à imprimer, fonds d'écran).\n\n**Pourquoi cette étape existe.** Les produits dérivés peuvent devenir la source de revenus la plus importante d'une série, mais seulement quand il y a un public attaché aux personnages. Trop tôt, ils coûtent du temps pour rien.\n\n**Avant de commencer.** Une audience qui commente et cite tes personnages, au moins 20 épisodes, et un nom vérifié (section 33).\n\n### La progression conseillée\n\n| Étape | Produit | Risque | Signal pour continuer |\n| --- | --- | --- | --- |\n| 1 | Coloriages et fonds d'écran gratuits | Nul | Téléchargements et partages |\n| 2 | Pack numérique payant (coloriages, affiches) | Très faible | Premières ventes |\n| 3 | Autocollants ou affiches en impression à la demande | Faible | Ventes répétées |\n| 4 | T-shirts, mugs, tasses | Moyen | Demandes spontanées du public |\n| 5 | Petit stock d'un produit choisi | Élevé | Commandes en prévente |\n\n### Pas à pas\n\n1. **Demande à ton public** quel produit l'intéresse (sondage en commentaire ou en story).\n2. **Crée un produit numérique** d'abord : coloriages ou fonds d'écran avec tes personnages, en te servant de tes images de référence (section 9).\n3. **Vérifie les licences** de tes outils d'images pour la vente de produits (section 33).\n4. **Choisis une plateforme de vente** adaptée à ton pays et compare les frais.\n5. **Fais un test** avec 5 à 10 ventes avant de développer la gamme.\n6. **Pour les produits imprimés**, commande un exemplaire à toi pour vérifier la qualité.\n7. **Ne stocke rien** avant d'avoir des commandes ferme ou une prévente.\n8. **Renseigne-toi** sur ta situation fiscale et ton statut dès la première vente (voir la note sur les revenus à la fin du guide).\n\n**À sauvegarder.** Les fichiers de chaque produit, les captures de licences, les ventes par produit.\n\n**Si le résultat est mauvais.**\n\n- Personne n'achète : c'est un signal, pas un échec. Retourne construire l'audience.\n- Le produit imprimé est de mauvaise qualité : change de prestataire.\n- Un client se plaint d'une ressemblance avec une autre marque : reprends la vérification d'originalité (section 33).\n\n**Prompt à copier (Claude) : idées de produits**\n\n```\nMa série de fiction animée a [nombre] abonnés et [nombre] épisodes. Personnages : [liste courte]. Propose 10 produits dérivés classés du moins risqué au plus risqué, avec pour chacun : le public visé, le coût de test, un signal précis pour continuer ou arrêter. Commence par des produits numériques.\n```"}, {"id": "c40", "n": "40", "title": "40. Analyser ses statistiques", "phase": 3, "sum": "Lire les chiffres de chaque épisode pour comprendre ce qui marche, et décider quoi améliorer sans te fier à l'intuition seule.", "md": "**Ce que tu vas faire.** Lire les chiffres de chaque épisode pour comprendre ce qui marche, et décider quoi améliorer sans te fier à l'intuition seule.\n\n**Termes expliqués.**\n\n- *Vues* : le nombre de fois où la vidéo a été lue (la définition exacte change selon la plateforme).\n- *Rétention* : la part du public qui reste jusqu'à un moment donné. C'est le chiffre le plus utile.\n- *Taux de visionnage complet* : le pourcentage de personnes qui regardent l'épisode jusqu'à la fin.\n- *Engagement* : les j'aime, commentaires, partages et enregistrements.\n- *Abonnés gagnés* : les nouvelles personnes qui suivent le compte grâce à l'épisode.\n\n**Pourquoi cette étape existe.** Sans mesure, tu recommences les mêmes erreurs. Avec un tableau simple, tu vois en deux semaines quel type de hook, de durée ou d'intrigue fonctionne.\n\n**Avant de commencer.** Au moins 5 épisodes publiés, un compte pro ou créateur sur chaque plateforme (pour accéder aux statistiques).\n\n### Ce qu'il faut relever pour chaque épisode\n\n| Colonne | Explication |\n| --- | --- |\n| Épisode | numéro et titre |\n| Date et heure de publication | pour comparer les horaires |\n| Type de hook | question, action, phrase choc, etc. |\n| Durée | en secondes |\n| Vues à 24 h, 7 jours | pour comparer avec les autres |\n| Rétention à 3 secondes | est-ce que le hook accroche ? |\n| Rétention à la moitié | est-ce que l'intrigue tient ? |\n| Visionnage complet (%) | est-ce que la fin arrive jusqu'aux gens ? |\n| Partages | le signal le plus fort de diffusion |\n| Abonnés gagnés | est-ce que la série fidélise ? |\n| Note | ce que tu as changé dans cet épisode |\n\n### Pas à pas\n\n1. **Crée un tableau** (tableur gratuit) avec ces colonnes, dans le dossier `14_STATS`.\n2. **Remplis-le** à J+1 et à J+7 pour chaque épisode.\n3. **Trouve les statistiques** de chaque plateforme :\n   - TikTok : ton profil, **Outils pour les créateurs**, **Analyses**.\n   - YouTube : YouTube Studio, **Analyses**, puis **Contenu**, puis ta vidéo.\n   - Instagram : le tableau de bord professionnel ou **Statistiques** sous le Reel.\n   - Facebook : Meta Business Suite, **Statistiques**.\n4. **Compare** les 3 meilleurs et les 3 moins bons épisodes. Cherche ce qu'ils ont de différent (hook, durée, personnage, sujet).\n5. **Change une seule chose** à la fois dans les épisodes suivants (le hook, ou la durée, ou l'heure), pour savoir ce qui a produit l'effet.\n6. **Attends 10 épisodes** avant de conclure : un seul chiffre est trop aléatoire.\n7. **Fais un bilan** chaque dimanche de 15 minutes.\n\n### Comment lire les chiffres\n\n| Ce que tu vois | Ce que cela signifie probablement | Ce que tu testes |\n| --- | --- | --- |\n| Beaucoup de départs en 3 secondes | Le hook n'accroche pas | Un autre type de hook (section 25) |\n| Chute au milieu | L'intrigue ralentit | Couper plus court, ajouter un rebondissement |\n| Beaucoup de vues, peu d'abonnés | Les gens ne savent pas que c'est une série | Mettre le numéro et « suite demain » à l'écran |\n| Peu de vues, forte rétention | Bon contenu, mauvaise diffusion | Titre, couverture, heure |\n| Beaucoup de partages | Le sujet touche | Faire plus de ce type d'épisode |\n\n**À sauvegarder.** Le tableau à jour, une capture mensuelle des statistiques de chaque plateforme.\n\n**Si le résultat est mauvais.**\n\n- Les statistiques sont indisponibles : vérifie le type de compte (professionnel ou créateur).\n- Tout baisse d'un coup : ne change pas dix choses. Reviens à la formule des épisodes qui marchaient.\n- Tu n'arrives pas à interpréter : copie le tableau dans Claude avec le prompt ci-dessous.\n\n**Prompt à copier (Claude) : lecture des statistiques**\n\n```\nVoici mon tableau de statistiques pour mes [nombre] derniers épisodes [colle-le]. Analyse : quels épisodes marchent le mieux et pourquoi (hook, durée, personnage, heure) ? Quelle est ma plus grosse fuite d'audience ? Propose 3 expériences pour les 10 prochains épisodes, en ne changeant qu'un seul paramètre par expérience. Sois honnête si les données sont insuffisantes pour conclure.\n```"}, {"id": "c41", "n": "41", "title": "41. Budget 0 € : ce qui est possible", "phase": 4, "sum": "Produire un premier épisode et un test complet sans payer d'abonnement, en connaissant les limites réelles de cette voie.", "md": "**Ce que tu vas faire.** Produire un premier épisode et un test complet sans payer d'abonnement, en connaissant les limites réelles de cette voie.\n\n**Pourquoi cette étape existe.** Tu dois pouvoir tester l'idée sans risque. Mais un budget nul a un coût caché : du temps, des limites de quotas et parfois l'impossibilité d'un usage commercial. Il faut le savoir dès le départ.\n\n**Avertissement.** Les quotas gratuits changent sans prévenir. Les descriptions ci-dessous sont des ordres de grandeur à confirmer sur chaque outil, le jour où tu les utilises.\n\n### Ce que tu peux faire sans payer\n\n| Étape | Outil gratuit possible | Limite à connaître |\n| --- | --- | --- |\n| Idées, bible, scripts, prompts | Claude, ChatGPT ou Grok en version gratuite | Nombre de messages limité par période |\n| Images de personnages | Nano Banana dans Gemini (gratuit) | Quota quotidien variable, pas de garantie de cohérence |\n| Animation | Essais gratuits ponctuels sur les outils vidéo | Très peu de clips, parfois avec filigrane |\n| Voix | Version gratuite d'ElevenLabs ou ta propre voix | **Free : pas d'usage commercial** (section 19) |\n| Musique | Bibliothèque audio de YouTube, sites de musique libre | Vérifier chaque licence |\n| Montage | CapCut version gratuite | Certaines fonctions et exports peuvent être limités |\n| Publication | TikTok, YouTube, Instagram, Facebook | Gratuit |\n\n### Ce qui est réaliste\n\n- Un **épisode test** de 45 à 60 secondes, avec des plans fixes ou très peu animés.\n- Une série en **voix off et sous-titres** (section 18, méthode A), avec des images animées simplement au montage (zoom lent, glissement).\n- Un **test de 5 à 7 épisodes** pour voir si l'idée accroche.\n\n### Ce qui ne l'est pas\n\n- Des animations longues et fluides, tous les jours.\n- Une cohérence parfaite entre les plans sur une longue saison.\n- Une exploitation commerciale sûre si un outil interdit cet usage dans sa version gratuite.\n\n### Pas à pas\n\n1. **Crée ta bible et tes personnages** avec un assistant gratuit (sections 4 à 7).\n2. **Génère les images** dans Gemini (section 16), en gardant une seule scène par image.\n3. **Choisis la méthode A** (voix off ou ta propre voix, sous-titres).\n4. **Anime au montage** : dans CapCut, ajoute un zoom lent (section 23, option d'animation d'image), des glissements et des coupes.\n5. **Ajoute une musique libre de droits** avec licence notée (section 21).\n6. **Publie 5 épisodes** et regarde les chiffres (section 40).\n7. **Décide** : si l'idée accroche, passe au budget suivant (section 42).\n\n**À sauvegarder.** Les captures des quotas et des conditions gratuites, avec la date, et le tableau de suivi.\n\n**Si le résultat est mauvais.**\n\n- Le quota est épuisé : reprends demain, ou passe à l'offre à 4,99 € par mois de la section 42 pour un mois.\n- Le rendu paraît trop simple : c'est normal, la méthode A mise sur l'histoire, pas sur l'animation.\n- Tu bloques sur la licence d'un outil : ne monétise pas ces épisodes, refais-les avec une offre qui l'autorise.\n\n**Prompt à copier (Claude) : plan à zéro euro**\n\n```\nJe veux tester ma série de fiction animée avec un budget de 0 €. Voici mon concept [colle-le]. Propose un plan de 2 semaines : 5 épisodes de 45 à 60 secondes, utilisant uniquement des images fixes animées au montage, une voix off et des sous-titres. Indique pour chaque épisode le nombre d'images à générer, la durée de travail estimée, et ce que je dois vérifier côté licences avant de monétiser.\n```"}, {"id": "c42", "n": "42", "title": "42. Budget 30 € par mois", "phase": 4, "sum": "Construire une chaîne de production sobre, avec un seul abonnement vidéo et une voix commerciale, pour publier régulièrement sans dépenser plus de 30...", "md": "**Ce que tu vas faire.** Construire une chaîne de production sobre, avec un seul abonnement vidéo et une voix commerciale, pour publier régulièrement sans dépenser plus de 30 € par mois.\n\n**Pourquoi cette étape existe.** Le budget de 30 € est le premier niveau où tu obtiens à la fois de la vraie animation, une voix utilisable commercialement et une production régulière.\n\n**Prix relevés le 29 septembre 2026** (pages officielles quand elles étaient lisibles, taux approximatif entre euro et dollar) :\n\n| Poste | Offre | Prix indicatif par mois |\n| --- | --- | --- |\n| Image et vidéo | Google AI Plus (comprend Nano Banana et 200 crédits Flow) | 4,99 € |\n| Voix | ElevenLabs Starter (usage commercial, 30 000 crédits) | 6 $, soit environ 5,5 € |\n| Écriture | Claude, ChatGPT ou Grok en version gratuite | 0 € |\n| Montage | CapCut gratuit (ou Pro, prix à confirmer dans l'application) | 0 € à quelques euros |\n| Musique | Bibliothèques libres | 0 € |\n| **Total de base** |  | **environ 10,5 €** |\n\nIl te reste donc environ 19 € de marge, que tu peux utiliser pour l'une des options ci-dessous.\n\n### Trois façons d'utiliser la marge\n\n| Option | Ce que tu ajoutes | Quand la choisir |\n| --- | --- | --- |\n| A | Un mois de Google AI Pro (21,99 €) à la place d'AI Plus, pour 1 000 crédits Flow | Quand tu veux plus de clips vidéo d'un coup |\n| B | Un abonnement de base à un assistant d'écriture (environ 20 €, prix à confirmer sur claude.com/pricing ou chatgpt.com/fr-FR/pricing) | Quand la version gratuite ne suffit plus |\n| C | Une réserve de 15 à 20 € pour les ratés (régénérations, essais) | Toujours utile au début |\n\n**Mon conseil.** Choisis l'option C pendant les 2 premiers mois. Le vrai coût caché d'une série IA est le nombre d'essais avant d'obtenir une bonne image ou un bon clip (section 44).\n\n### Ce que ce budget permet\n\n- Environ 2 à 3 épisodes par semaine, avec quelques plans animés par épisode et le reste en images fixes animées au montage.\n- Des voix constantes pour 3 à 5 personnages.\n- Un usage commercial des voix (ElevenLabs Starter).\n\n### Pas à pas\n\n1. **Prends un abonnement à la fois.** Commence par Google AI Plus, teste un mois.\n2. **Note ton nombre de clips** par crédit consommé dans un tableau (section 44).\n3. **Ajoute ElevenLabs Starter** seulement quand tu as un premier épisode terminé.\n4. **Pas d'abonnement annuel** au début : la réduction n'en vaut pas le risque.\n5. **Note la date de renouvellement** de chaque abonnement dans ton agenda.\n6. **Fais le point chaque mois** : garde ce qui te sert, résilie le reste (section 44).\n\n**À sauvegarder.** Les factures et confirmations dans `13_JURIDIQUE`, avec la date et l'offre exacte.\n\n**Si le résultat est mauvais.**\n\n- Les crédits sont épuisés en quelques jours : tu génères trop de clips. Passe plus de plans en images fixes.\n- Le coût dépasse le budget : résilie un abonnement, ne dépasse pas ta limite.\n- Un outil change ses prix : les prix ci-dessus sont ceux du 29 septembre 2026, contrôle-les avant chaque achat.\n\n**Prompt à copier (Claude) : tableau de budget**\n\n```\nCrée un tableau de budget mensuel pour ma production de série de fiction animée, avec un plafond de 30 €. Colonnes : poste, outil, prix mensuel, date de renouvellement, crédits inclus, crédits utilisés, coût par épisode. Ajoute une ligne de réserve pour les essais ratés et une formule de total. Formate le tout pour un tableur.\n```"}, {"id": "c43", "n": "43", "title": "43. Budget 100 € par mois", "phase": 4, "sum": "Passer à une production plus soignée et plus régulière, avec plus de crédits vidéo, un assistant d'écriture payant et un outil d'image complémentaire.", "md": "**Ce que tu vas faire.** Passer à une production plus soignée et plus régulière, avec plus de crédits vidéo, un assistant d'écriture payant et un outil d'image complémentaire.\n\n**Pourquoi cette étape existe.** Quand la série a un public, le manque de crédits devient ton principal frein. Ce budget réduit les ratés et permet un épisode par jour.\n\n**Quand y passer.** Quand tu as publié au moins 15 épisodes, que tes statistiques montrent une progression (section 40), et que le budget de 30 € te limite réellement.\n\n**Prix indicatifs relevés le 29 septembre 2026** (taux dollar approximatif, à confirmer sur les pages officielles) :\n\n| Poste | Offre | Prix indicatif par mois |\n| --- | --- | --- |\n| Image et vidéo | Google AI Pro (Nano Banana Pro et 1 000 crédits Flow) | 21,99 € |\n| Voix | ElevenLabs Creator (121 000 crédits, clonage professionnel de ta voix) | 22 $ après le premier mois, environ 20 € |\n| Écriture | Un abonnement Claude ou ChatGPT | environ 20 € (voir claude.com/pricing et chatgpt.com/fr-FR/pricing) |\n| Vidéo complémentaire | Un second outil vidéo au choix (section 17) | 10 à 30 € selon l'offre |\n| Montage | CapCut Pro si utile | à confirmer dans l'application |\n| **Total** |  | **environ 75 à 95 €** |\n\nCe total laisse une petite marge avant la limite de 100 €. Si le total dépasse, retire d'abord le second outil vidéo.\n\n### Quand ajouter le second outil vidéo\n\nAjoute-le seulement si un plan précis échoue avec ton outil principal (mouvement, style, voix). Ne paye pas pour deux outils faisant la même chose.\n\n### Ce que ce budget permet\n\n- Un épisode par jour avec plusieurs plans animés.\n- Des plans plus longs et de meilleure qualité (mode Quality de Flow, plus coûteux en crédits).\n- Plus d'essais par plan, donc moins de compromis.\n\n### Pas à pas\n\n1. **Passe de Google AI Plus à AI Pro** au moment où tu épuises les crédits.\n2. **Ajoute un assistant d'écriture payant** quand la limite de messages ralentit ton travail.\n3. **Passe ElevenLabs Starter à Creator** si tu veux cloner **ta propre voix** ou utiliser beaucoup de crédits.\n4. **Mesure chaque mois** le coût par épisode (section 44). Si le coût monte sans que les vues montent, reviens au budget de 30 €.\n5. **Ne signe aucun engagement annuel** tant que tu n'as pas 3 mois de statistiques stables.\n\n**À sauvegarder.** Le tableau de budget et les factures du mois.\n\n**Si le résultat est mauvais.**\n\n- Les vues n'augmentent pas malgré l'investissement : le problème n'est pas l'outil, c'est l'histoire, le hook ou la régularité. Reviens à la section 40.\n- Tu ne consommes pas tous tes crédits : redescends d'un palier.\n- Un outil réduit ses avantages : compare avec une alternative avant de renouveler.\n\n**Prompt à copier (Claude) : arbitrage d'abonnements**\n\n```\nVoici mes abonnements actuels avec leur prix et l'usage réel du mois [colle le tableau]. Mon plafond est de 100 € par mois. Indique : ce que je devrais garder, ce que je devrais résilier, ce qui fait double emploi, et le coût par épisode avant et après ces changements. Sois direct.\n```"}, {"id": "c44", "n": "44", "title": "44. Le coût réel d'un épisode", "phase": 4, "sum": "Calculer ce que te coûte vraiment un épisode, en incluant les essais ratés, pour savoir si la série est tenable.", "md": "**Ce que tu vas faire.** Calculer ce que te coûte vraiment un épisode, en incluant les essais ratés, pour savoir si la série est tenable.\n\n**Pourquoi cette étape existe.** Le prix d'un abonnement ne dit rien du coût d'un épisode. Un épisode « qui n'a coûté que 5 clips » en a souvent nécessité 15.\n\n### La formule\n\n**Coût d'un épisode = (coût mensuel de tous les abonnements) divisé par (nombre d'épisodes finis dans le mois).**\n\nPuis compare avec la version « par crédits » :\n\n**Crédits par épisode = nombre de plans animés x nombre moyen d'essais par plan x crédits par clip.**\n\n### Exemple chiffré (illustration, pas une garantie)\n\nAvec Google AI Pro (1 000 crédits par mois, un clip Fast à environ 20 crédits, un clip Quality à environ 100 crédits d'après le comparatif consulté) :\n\n| Paramètre | Valeur |\n| --- | --- |\n| Plans animés par épisode | 8 |\n| Essais moyens par plan | 2 |\n| Crédits par clip Fast | 20 |\n| Crédits par épisode | 8 x 2 x 20 = 320 |\n| Épisodes possibles par mois avec 1 000 crédits | 3 |\n\nIl faut donc plus de crédits, moins de plans animés, ou moins d'essais pour tenir un épisode par jour. Les valeurs de crédits par clip viennent d'un comparatif secondaire et peuvent changer : regarde le coût affiché dans ton outil avant de générer.\n\n### Pas à pas\n\n1. **Crée un tableau** `COUT_EPISODES` dans `14_STATS`.\n2. **Note pour chaque épisode** : nombre de plans, nombre d'essais, crédits dépensés, temps passé.\n3. **Additionne** tes abonnements du mois.\n4. **Divise** par le nombre d'épisodes finis.\n5. **Compare** le résultat avec ce que tu gagnes (encore proche de zéro au début, et c'est normal).\n6. **Décide** : est-ce que je peux tenir ce coût pendant 3 mois sans revenu ?\n7. **Réduis les essais** en améliorant tes prompts et tes références (sections 9 et 16).\n\n### Les leviers pour baisser le coût\n\n| Levier | Effet |\n| --- | --- |\n| Moins de plans animés, plus d'images fixes animées au montage | Forte baisse |\n| Mode Fast plutôt que Quality pour les essais | Baisse |\n| Des références maîtresses solides (moins d'essais) | Baisse |\n| Réutiliser des décors et des plans | Baisse |\n| Plans plus courts | Baisse |\n\n**À sauvegarder.** Le tableau `COUT_EPISODES`, mis à jour après chaque épisode.\n\n**Si le résultat est mauvais.**\n\n- Le coût par épisode dépasse ton budget : baisse le nombre de plans animés d'abord.\n- Tu ne sais pas combien de crédits tu as consommé : note-les après chaque session.\n- Le temps passé est démesuré : voir la section 45.\n\n**Prompt à copier (Claude) : calcul du coût**\n\n```\nVoici mes données du mois [abonnements, nombre d'épisodes finis, crédits dépensés, heures passées]. Calcule : le coût par épisode en argent, le coût par épisode en heures, le nombre moyen d'essais par plan, et propose 3 changements pour réduire ce coût de 30 % sans baisser la qualité. Montre ton calcul.\n```"}, {"id": "c45", "n": "45", "title": "45. Le temps de production réel", "phase": 4, "sum": "Estimer honnêtement le temps que demande un épisode, pour construire un planning que tu peux tenir.", "md": "**Ce que tu vas faire.** Estimer honnêtement le temps que demande un épisode, pour construire un planning que tu peux tenir.\n\n**Pourquoi cette étape existe.** La plupart des séries IA s'arrêtent parce que leur créatrice a sous-estimé le temps de travail, pas parce que l'idée était mauvaise.\n\n### Ordres de grandeur (estimations personnelles, à ajuster avec ton propre chronomètre)\n\n| Situation | Temps par épisode |\n| --- | --- |\n| Tout premier épisode (apprentissage des outils) | 8 à 20 heures |\n| Épisodes 2 à 5 | 5 à 8 heures |\n| Épisodes suivants, chaîne rodée | 3 à 5 heures |\n| Saison de 10 épisodes | 40 à 70 heures au total |\n\n### Où passe le temps, pour un épisode rodé de 3 à 5 heures\n\n| Étape | Temps indicatif |\n| --- | --- |\n| Écriture et storyboard | 30 à 60 minutes |\n| Images plan par plan | 60 à 90 minutes |\n| Images en vidéos | 45 à 90 minutes |\n| Voix et lip-sync | 30 à 60 minutes |\n| Montage, musique, bruitages | 45 à 90 minutes |\n| Sous-titres, export, publication | 20 à 40 minutes |\n\n### Pas à pas pour tenir le rythme\n\n1. **Chronomètre** ton premier épisode, étape par étape.\n2. **Note** le temps dans le tableau `COUT_EPISODES` (section 44).\n3. **Travaille en lots** : écris 3 épisodes d'un coup, génère toutes les images de la semaine ensemble, monte plusieurs épisodes dans la même session.\n4. **Garde une avance** de 5 épisodes finis avant de publier chaque jour.\n5. **Prévois un jour sans production** par semaine.\n6. **Programme les publications** à l'avance quand la plateforme le permet.\n7. **Réutilise ce qui marche** : décors, plans de transition, modèle CapCut (section 23).\n\n**À sauvegarder.** Le tableau des temps, et ton planning de la semaine.\n\n**Si le résultat est mauvais.**\n\n- Tu dépasses le temps prévu de moitié : réduis le nombre de plans par épisode.\n- Tu te sens épuisée : baisse la fréquence. Trois épisodes réguliers valent mieux que sept épisodes puis un arrêt.\n- Tu as du retard : ne publie pas un épisode bâclé, saute un jour et annonce-le simplement.\n\n**Prompt à copier (Claude) : planning de production**\n\n```\nJe dispose de [nombre] heures par semaine pour ma série. Un épisode me prend environ [nombre] heures. Crée un planning hebdomadaire réaliste qui répartit l'écriture, les images, les vidéos, les voix, le montage et la publication, avec un jour de repos et une avance de production. Indique combien d'épisodes je peux tenir par semaine.\n```"}, {"id": "c46", "n": "46", "title": "46. Organiser ses fichiers", "phase": 4, "sum": "Créer une arborescence de dossiers et une règle de nommage pour ne jamais perdre un fichier ni un prompt.", "md": "**Ce que tu vas faire.** Créer une arborescence de dossiers et une règle de nommage pour ne jamais perdre un fichier ni un prompt.\n\n**Termes expliqués.**\n\n- *Arborescence* : l'organisation des dossiers en niveaux (un dossier principal, des sous-dossiers).\n- *Convention de nommage* : une règle unique pour écrire les noms de fichiers.\n- *Sauvegarde* : une copie de secours dans un autre endroit.\n\n**Pourquoi cette étape existe.** Une saison contient des centaines de fichiers. Sans ordre, tu perds des heures à chercher une image, et tu ne retrouves plus le prompt qui avait donné le bon résultat.\n\n### L'arborescence conseillée\n\n```\nSERIE_NOM/\n  01_CONCEPT/        (bible de série, arc de saison)\n  02_TENDANCES/      (études de référence, notes)\n  03_PERSONNAGES/    (fiches, images maîtresses, voix)\n  04_DECORS/         (décors maîtres)\n  05_SCRIPTS/        (saison, épisodes, dialogues)\n  06_STORYBOARDS/\n  07_IMAGES/         (par épisode et par plan)\n  08_VIDEOS/         (clips générés)\n  09_AUDIO/          (voix, musique, sfx)\n  10_MONTAGES/       (projets CapCut)\n  11_SOUS_TITRES/\n  12_EXPORTS/        (masters et versions)\n  13_JURIDIQUE/      (licences, factures, preuves, contrats)\n  14_STATS/          (suivi, budget, coûts)\n```\n\nAdapte les noms des dossiers à ta série si tu veux, mais garde toujours le même ordre partout.\n\n### La convention de nommage\n\n| Type | Modèle | Exemple |\n| --- | --- | --- |\n| Personnage | PERSO\\_nom\\_version | PERSO\\_pomme\\_v3.png |\n| Décor | DECOR\\_nom\\_version | DECOR\\_marche\\_v2.png |\n| Image de plan | EPxx\\_Pyy\\_vN.png | EP01\\_P03\\_v2.png |\n| Clip | EPxx\\_Pyy\\_clip\\_vN.mp4 | EP01\\_P03\\_clip\\_v1.mp4 |\n| Voix | EPxx\\_Pyy\\_perso.mp3 | EP01\\_P03\\_pomme.mp3 |\n| Master | SERIE\\_Sxx\\_EPxx\\_MASTER.mp4 | RDV\\_S01\\_EP01\\_MASTER.mp4 |\n\nRègles : pas d'accent, pas d'espace (utilise le tiret bas), toujours un numéro de version, jamais « final » ou « nouveau » dans un nom.\n\n### Pas à pas\n\n1. **Crée le dossier principal** sur ton ordinateur ou ton stockage en ligne.\n2. **Crée les 14 sous-dossiers**.\n3. **Crée un fichier `PROMPTS.txt`** (ou un document) dans `05_SCRIPTS` : à chaque bon résultat, colle le prompt exact et le nom du fichier obtenu.\n4. **Renomme chaque fichier** dès son téléchargement, pas plus tard.\n5. **Sauvegarde** dans un second endroit une fois par semaine (disque externe ou stockage en ligne).\n6. **Garde toujours** les images de référence maîtresses (section 9) dans un dossier facile d'accès.\n7. **Supprime les essais ratés** seulement après la publication de l'épisode.\n\n**À sauvegarder.** Toute l'arborescence, avec une copie hebdomadaire.\n\n**Si le résultat est mauvais.**\n\n- Tu ne retrouves plus un fichier : cherche par son nom d'épisode. Si le nom n'est pas dans le modèle, renomme-le tout de suite.\n- Un disque tombe en panne : c'est pour cela que la sauvegarde existe. Restaure la dernière copie.\n- Tu mélanges des versions : garde seulement la dernière et déplace les autres dans un sous-dossier `ARCHIVES`.\n\n**Prompt à copier (Claude) : modèle de journal de prompts**\n\n```\nCrée un modèle de journal de prompts pour ma série de fiction animée : colonnes date, épisode, plan, outil utilisé, prompt exact, nom du fichier obtenu, note de qualité de 1 à 5, ce que je dois changer la prochaine fois. Formate-le pour un tableur.\n```\n\n### Le carnet de production : noter ce qui a marché\n\nUne série ne fonctionne que si l'épisode 8 ressemble à l'épisode 1. Les guides de production recommandent de consigner, à chaque épisode, les réglages et les prompts qui ont donné le bon résultat ([CineV, officieux](https://cinev.com/insights/how-to-create-ai-animation-series-ip-holders)). Crée un tableur `00_carnet_de_production` avec une ligne par plan réussi :\n\n| Colonne | Exemple |\n| --- | --- |\n| Épisode et plan | EP03, plan 05 |\n| Outil et modèle | Outil vidéo X, modèle Y, 1080p, 6 s |\n| Images de référence jointes | Fiche du personnage v02, décor cuisine nuit v01 |\n| Prompt exact | Copié mot pour mot |\n| Réglages | Durée, format, force de la référence, graine si l'outil en a une |\n| Nombre d'essais | 3 |\n| Remarque | Ajouter « fixed camera » a supprimé le tremblement |\n\nAvant chaque nouvel épisode, relis les remarques : c'est ta méthode personnelle qui se construit. Quand un outil change de version, note-le aussi, car les mêmes prompts peuvent donner des résultats différents."}, {"id": "c47", "n": "47", "title": "47. Checklist avant publication", "phase": 4, "sum": "Vérifier en 5 minutes que l'épisode est prêt, légal et propre avant d'appuyer sur Publier.", "md": "**Ce que tu vas faire.** Vérifier en 5 minutes que l'épisode est prêt, légal et propre avant d'appuyer sur Publier.\n\n**Pourquoi cette étape existe.** Une erreur visible (faute, musique protégée, mention oubliée) est publique, et sur certaines plateformes elle est difficile à corriger après coup.\n\n### La checklist\n\n**Image**\n\n- [ ] Les personnages ressemblent à leurs références maîtresses dans tous les plans.\n- [ ] Aucun défaut visible (main déformée, texte illisible, membre en trop).\n- [ ] Aucun logo, marque ou personnage existant n'apparaît.\n- [ ] Aucune personne réelle n'est reconnaissable.\n\n**Son**\n\n- [ ] Les voix sont claires et gardent le même timbre.\n- [ ] La musique ne couvre pas les dialogues.\n- [ ] La musique et les bruitages ont une licence notée.\n- [ ] Le son est cohérent à l'écoute sur téléphone.\n\n**Texte**\n\n- [ ] Les sous-titres sont relus, sans faute.\n- [ ] Les sous-titres restent dans la zone sûre.\n- [ ] Le hook apparaît dans les 3 premières secondes.\n- [ ] La fin a un cliffhanger ou une conclusion claire.\n\n**Technique**\n\n- [ ] Format 9:16, 1080 x 1920, 30 images par seconde.\n- [ ] Durée conforme à l'objectif de la plateforme (section 27).\n- [ ] Aucun filigrane ni logo de plateforme.\n- [ ] Le master est sauvegardé dans deux endroits.\n\n**Publication et légal**\n\n- [ ] La mention « Série de fiction créée avec l'IA » est à l'écran, dans la description et dans la biographie.\n- [ ] Le réglage IA de la plateforme est activé (section 32).\n- [ ] Le titre et la description sont honnêtes et fidèles à l'épisode.\n- [ ] Si un produit ou une marque est cité avec contrepartie, la mention « Collaboration commerciale » est visible (section 38).\n- [ ] La couverture est nette et lisible.\n- [ ] L'épisode suivant existe déjà en brouillon.\n\n### Pas à pas\n\n1. **Regarde l'épisode en entier** sur ton téléphone, avec le son.\n2. **Coche chaque ligne** de la checklist.\n3. **Corrige** tout ce qui n'est pas coché.\n4. **Sauvegarde** une copie de la checklist remplie dans le dossier de l'épisode.\n5. **Publie**, puis reste 15 minutes pour répondre aux premiers commentaires.\n\n**À sauvegarder.** La checklist remplie de chaque épisode.\n\n**Si le résultat est mauvais.**\n\n- Tu découvres une faute après publication : sur YouTube tu peux modifier certains éléments (titre, description), mais pas la vidéo. Sur TikTok et Instagram, il faut souvent supprimer et republier.\n- Tu as un doute sur un plan : retire-le ou remplace-le, ne publie pas en espérant que personne ne le verra.\n- Tu n'as pas le temps de tout vérifier : publie plus tard. Un jour de retard coûte moins qu'une vidéo retirée.\n\n**Prompt à copier (Claude) : checklist personnalisée**\n\n```\nAdapte cette checklist à ma série [nom, personnages, style visuel]. Ajoute 10 vérifications spécifiques à mes personnages (traits qui changent souvent d'un plan à l'autre, accessoires à vérifier, couleurs de référence). Formate chaque point comme une case à cocher.\n```"}, {"id": "c48", "n": "48", "title": "48. Les erreurs à éviter", "phase": 4, "sum": "Repérer d'avance les erreurs les plus fréquentes des débutantes, pour ne pas perdre des semaines dessus.", "md": "**Ce que tu vas faire.** Repérer d'avance les erreurs les plus fréquentes des débutantes, pour ne pas perdre des semaines dessus.\n\n**Pourquoi cette étape existe.** Presque toutes les séries IA qui échouent tombent dans les mêmes pièges. Les connaître te fait gagner du temps et de l'argent.\n\n### Les erreurs de conception\n\n| Erreur | Conséquence | Correction |\n| --- | --- | --- |\n| Commencer par les outils avant l'idée | Beaucoup de belles images sans histoire | Termine ta bible de série d'abord (sections 4 à 7) |\n| Trop de personnages | Confusion, incohérences | 3 à 5 personnages au départ |\n| Copier une série à succès | Risque de copie, aucune identité | Étudie les mécanismes, pas les personnages (section 3) |\n| Pas d'arc de saison | Les épisodes se ressemblent | Un fil qui avance d'épisode en épisode (section 13) |\n\n### Les erreurs de production\n\n| Erreur | Conséquence | Correction |\n| --- | --- | --- |\n| Changer plusieurs choses à la fois dans un prompt | Impossible de savoir ce qui a changé le résultat | Un seul changement à la fois |\n| Pas de références maîtresses jointes | Personnages différents d'un plan à l'autre | Joins toujours les images de référence (section 9) |\n| Trop de personnages dans une image | Déformations | 2 personnages maximum par image |\n| Payer plusieurs outils dès le départ | Argent perdu | Un abonnement à la fois (section 42) |\n| Ne pas noter les prompts | Impossible de refaire un bon résultat | Journal de prompts (section 46) |\n| Générer avant d'avoir écrit le storyboard | Plans inutiles, crédits gaspillés | Écris le storyboard d'abord (section 15) |\n\n### Les erreurs de publication\n\n| Erreur | Conséquence | Correction |\n| --- | --- | --- |\n| Musique connue | Vidéo coupée ou retirée | Musique libre de droits avec licence (section 21) |\n| Oublier l'étiquette IA | Retrait ou restrictions | Sections 32 et 47 |\n| Publier sans relire les sous-titres | Fautes visibles | Relecture systématique (section 24) |\n| Juger après 2 vidéos | Découragement prématuré | Attendre au moins 10 épisodes |\n| Changer de style tous les jours | Aucune identité | Garde un style stable pour la saison |\n| Acheter des abonnés ou des vues | Perte d'accès aux programmes de monétisation | Jamais |\n\n### Les erreurs juridiques et financières\n\n| Erreur | Conséquence | Correction |\n| --- | --- | --- |\n| Utiliser une voix de célébrité ou un proche sans accord | Problème juridique sérieux | Voix créées par description, ou ta voix (section 19) |\n| Ignorer les licences gratuites | Impossible de monétiser | Note la licence de chaque outil (section 33) |\n| Promettre des revenus à ton entourage | Déception, pression | Traite les gains comme un bonus incertain (sections 34 à 37) |\n| Payer pour « débloquer » la monétisation | Arnaque | Aucune plateforme ne demande cela |\n| Ne pas déclarer les revenus | Problème avec l'administration | Voir la note sur les revenus à la fin du guide |\n\n### Pas à pas pour utiliser cette section\n\n1. **Relis ce tableau** avant de commencer ta première semaine.\n2. **Relis-le** à chaque fin de mois, avec tes statistiques.\n3. **Note** les erreurs que tu as faites dans un fichier `LECONS.txt`.\n4. **Ajoute** tes propres erreurs et leur correction.\n\n**À sauvegarder.** Le fichier `LECONS.txt`.\n\n**Si le résultat est mauvais.**\n\n- Tu as fait plusieurs de ces erreurs : normal. Corrige-les une par une, en commençant par les erreurs juridiques.\n- Tu ne sais pas laquelle te touche : demande à Claude un audit avec le prompt ci-dessous.\n\n**Prompt à copier (Claude) : audit de mes erreurs**\n\n```\nVoici mon processus actuel [décris tes étapes], mes outils, mon rythme de publication et mes statistiques [colle-les]. Fais l'audit de mes erreurs probables : conception, production, publication, juridique, budget. Classe-les de la plus grave à la moins grave, propose une correction pour chacune, et dis-moi celle que je dois traiter cette semaine.\n```"}, {"id": "c49", "n": "49", "title": "49. Plan de lancement sur 30 jours", "phase": 4, "sum": "Suivre un calendrier simple qui t'amène de la préparation au dixième épisode publié et à un premier bilan.", "md": "**Ce que tu vas faire.** Suivre un calendrier simple qui t'amène de la préparation au dixième épisode publié et à un premier bilan.\n\n**Pourquoi cette étape existe.** Un plan te dit quoi faire chaque jour, ce qui évite la paralysie du débutant. Ce plan est un test limité (10 épisodes en 5 semaines maximum, budget maximum de 30 €) avant de décider si tu continues.\n\n**Avant de commencer.** Avoir lu l'introduction, installé CapCut, créé les comptes (sections 28 à 31), fixé ton budget (sections 41 à 43).\n\n### Semaine 1 : concept et univers\n\n| Jour | Travail | Livrable |\n| --- | --- | --- |\n| 1 | Section 1 et 2 : comprendre et choisir une idée | Une phrase de concept |\n| 2 | Section 3 : étudier 10 séries sans copier | Notes de mécanismes |\n| 3 | Sections 4 et 5 : univers et bible | Bible de série de 2 pages |\n| 4 | Section 6 : personnages | 3 à 5 fiches |\n| 5 | Sections 7 et 8 : expressions et décors | Planches d'expressions, 2 décors |\n| 6 | Section 9 : références maîtresses | Images de référence validées |\n| 7 | Repos et relecture | Rien de nouveau |\n\n### Semaine 2 : premier épisode complet\n\n| Jour | Travail | Livrable |\n| --- | --- | --- |\n| 8 | Sections 13 et 14 : arc de saison et épisode 1 | Script |\n| 9 | Section 15 : storyboard | Liste de plans |\n| 10 | Section 16 : images plan par plan | Images validées |\n| 11 | Section 17 : images en vidéos | Clips validés |\n| 12 | Sections 18 à 22 : voix, musique, bruitages | Pistes audio |\n| 13 | Sections 23 à 27 : montage, sous-titres, export | Master de l'épisode 1 |\n| 14 | Section 47 : checklist, puis publication du 1er épisode | Épisode 1 en ligne |\n\n### Semaine 3 : rythme de croisière\n\n| Jour | Travail |\n| --- | --- |\n| 15 à 17 | Produire les épisodes 2, 3 et 4 (travail en lots) |\n| 18 | Publication des épisodes 2 et 3, réponses aux commentaires |\n| 19 | Premier tableau de statistiques (section 40) |\n| 20 | Publication de l'épisode 4 |\n| 21 | Repos et relecture des chiffres |\n\n### Semaine 4 : ajustement et bilan\n\n| Jour | Travail |\n| --- | --- |\n| 22 à 24 | Produire les épisodes 5 à 7, en changeant un seul paramètre (hook ou heure) |\n| 25 à 27 | Publier les épisodes 5 à 7 |\n| 28 | Bilan chiffré : vues, rétention, abonnés, coût par épisode (sections 40 et 44) |\n| 29 | Produire les épisodes 8 à 10 (jusqu'à la semaine 5) |\n| 30 | Décision : continuer, ajuster ou arrêter |\n\nLes 10 épisodes s'étalent donc jusqu'à la 5e semaine : c'est voulu, pour que le test reste réaliste.\n\n### Critères de décision au jour 30\n\n| Signal | Décision |\n| --- | --- |\n| Rétention en progression, commentaires demandant la suite | Continuer, passer à la saison 2 |\n| Peu de vues mais rétention correcte | Améliorer titres, couvertures, horaires |\n| Faible rétention et peu de vues | Retravailler hook et intrigue avant de continuer |\n| Fatigue ou coût trop élevé | Réduire la fréquence ou le budget (sections 42 et 45) |\n\n**À sauvegarder.** Le plan rempli, les bilans hebdomadaires, la décision du jour 30 et ses raisons.\n\n**Si le résultat est mauvais.**\n\n- Tu as du retard : décale le plan d'une semaine, ne saute pas la relecture.\n- Un épisode n'est pas au niveau : ne le publie pas, garde-le comme test.\n- Le découragement arrive vers le jour 15 : c'est fréquent. Relis tes premiers épisodes et compare-les avec les derniers.\n\n**Prompt à copier (Claude) : plan personnalisé**\n\n```\nJ'ai [nombre] heures par semaine et un budget de [montant] € par mois. Ma série : [concept en 2 phrases]. À partir de ce plan de 30 jours [colle le plan], adapte le calendrier à mes disponibilités réelles, réduis-le si nécessaire, et indique les jours où je risque de manquer de temps. Sois réaliste, pas optimiste.\n```"}, {"id": "c50", "n": "50", "title": "50. Tous les prompts maîtres prêts à copier", "phase": 4, "sum": "Retrouver en un seul endroit les prompts essentiels du guide, dans l'ordre de la production, pour les copier, remplacer les crochets et les utiliser.", "md": "**Ce que tu vas faire.** Retrouver en un seul endroit les prompts essentiels du guide, dans l'ordre de la production, pour les copier, remplacer les crochets et les utiliser.\n\n**Comment les utiliser.**\n\n1. Copie le prompt en entier.\n2. Remplace chaque texte entre crochets `[comme ceci]` par tes informations.\n3. Pour les prompts d'image et de vidéo, **joins tes images de référence** (section 9).\n4. Note le résultat dans ton journal de prompts (section 46).\n5. Change une seule chose à la fois si le résultat ne convient pas.\n\n**Rappel.** Les prompts pour Claude, ChatGPT ou Grok sont en français. Les prompts pour les générateurs d'images et de vidéos sont en anglais, car les outils comprennent mieux l'anglais, et chaque prompt anglais est suivi de sa traduction.\n\n### A. Concept et univers\n\n**1. Trouver une idée originale (Claude, ChatGPT ou Grok)**\n\n```\nJe veux créer une série de fiction courte en français, dans le style suivant : [ton style et ton type de personnages, voir les annexes A et B], pour TikTok, YouTube Shorts, Instagram et Facebook. Propose 10 concepts originaux. Pour chacun : le lieu, le conflit central, 3 personnages, le ton, la promesse faite au public, et en quoi ce concept ne ressemble à aucune série connue. Classe-les du plus original au plus risqué.\n```\n\n**2. Créer la bible de série**\n\n```\nVoici mon concept [colle-le]. Rédige la bible de ma série en 2 pages : univers, règles du monde, ton, style visuel, public cible, 5 personnages avec leur personnalité et leur secret, 3 lieux, et l'arc de la première saison en 10 épisodes. Reste simple et cohérent.\n```\n\n**3. Fiche personnage complète**\n\n```\nCrée la fiche du personnage [nom, signe visuel, rôle]. Donne : personnalité en 5 mots, défaut principal, secret, tic de langage, relation avec chaque autre personnage, et une description visuelle fixe en anglais de 40 à 60 mots (forme, couleur, yeux, bouche, vêtements, accessoire signature) que je pourrai coller dans chaque prompt d'image.\n```\n\n### B. Images\n\n**4. Image maîtresse d'un personnage (générateur d'images)**\n\n```\nCharacter reference sheet of [description fixe du personnage]. Front view, three-quarter view and side view, neutral expression, plain light grey background, soft even lighting, consistent proportions, [PHRASE DE STYLE de ma série], high detail. No text, no logo.\n```\n\nTraduction : Planche de référence du personnage \\[description\\]. Vue de face, de trois quarts et de profil, expression neutre, fond gris clair uni, lumière douce et égale, proportions constantes, style animé 3D propre, très détaillé. Aucun texte, aucun logo.\n\n**5. Planche d'expressions**\n\n```\nUsing the attached reference image, create an expression sheet of the same character with six expressions: joy, surprise, anger, sadness, suspicion, embarrassment. Same face, same colors, same style, plain light grey background, no text.\n```\n\nTraduction : À partir de l'image de référence jointe, crée une planche de six expressions du même personnage : joie, surprise, colère, tristesse, méfiance, gêné. Même visage, mêmes couleurs, même style, fond gris clair uni, sans texte.\n\n**6. Décor maître**\n\n```\nEstablishing shot of [description du lieu] in [PHRASE DE STYLE de ma série], vertical 9:16 composition, empty of characters, soft golden light, clear foreground and background, no text, no logo.\n```\n\nTraduction : Plan d'ensemble de \\[lieu\\] dans \\[PHRASE DE STYLE de ma série\\], composition verticale 9:16, sans personnage, lumière dorée douce, avant-plan et arrière-plan nets, sans texte ni logo.\n\n**7. Image d'un plan de l'épisode**\n\n```\nUsing the attached character and set references, [personnage] is [action] in [décor], [type de plan], [émotion], vertical 9:16, same style as the references, consistent colors and proportions. No text, no logo.\n```\n\nTraduction : À partir des références jointes du personnage et du décor, \\[personnage\\] fait \\[action\\] dans \\[décor\\], \\[type de plan\\], \\[émotion\\], vertical 9:16, même style que les références, couleurs et proportions constantes. Sans texte ni logo.\n\n**8. Corriger une seule chose dans une image**\n\n```\nKeep everything in the attached image exactly the same, and change only [élément à changer]. Do not modify the character's face, colors, proportions, or the background.\n```\n\nTraduction : Garde tout identique dans l'image jointe et change seulement \\[élément\\]. Ne modifie ni le visage, ni les couleurs, ni les proportions du personnage, ni le décor.\n\n### C. Écriture d'épisode\n\n**9. Écrire l'arc d'une saison**\n\n```\nVoici ma bible de série [colle-la]. Écris l'arc d'une saison de 10 épisodes de 70 à 90 secondes. Pour chaque épisode : titre, résumé en 2 phrases, conflit, hook, cliffhanger, et lien avec l'arc principal. Alterne épisodes légers et épisodes forts.\n```\n\n**10. Écrire un épisode**\n\n```\nRédige le script de l'épisode [numéro] de ma série [résumé de l'épisode]. Format : 70 à 90 secondes, 10 à 14 plans, hook dans les 3 premières secondes, dialogues de 20 mots maximum par réplique, cliffhanger final. Donne pour chaque plan : la durée, l'action, la réplique, et l'émotion.\n```\n\n**11. Storyboard plan par plan**\n\n```\nVoici le script de mon épisode [colle-le]. Transforme-le en storyboard : pour chaque plan, le type de plan (large, moyen, gros plan), le décor, les personnages présents (2 maximum), l'action, et le prompt d'image en anglais prêt à copier. Garde la description fixe de chaque personnage.\n```\n\n### D. Vidéo et son\n\n**12. Animer une image (générateur vidéo)**\n\n```\nAnimate the attached image. [Personnage] [mouvement simple], subtle camera push in, soft background movement, keep the character's face, colors and proportions unchanged. 6 seconds. AUDIO: [ambiance discrète]. No text.\n```\n\nTraduction : Anime l'image jointe. \\[Personnage\\] \\[mouvement simple\\], léger travelling avant, mouvement doux en arrière-plan, garde le visage, les couleurs et les proportions du personnage inchangés. 6 secondes. Son : \\[ambiance discrète\\]. Sans texte.\n\n**13. Plan avec réplique parlée**\n\n```\n[Personnage] looks at the camera and speaks, lips moving in sync with the words. Static close-up. AUDIO: says in Fren
