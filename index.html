nce jointe, crée une planche de design : vue de face, de trois quarts, de profil et de dos, même personnage, même tenue, fond gris clair uni, sans texte, format vertical."}, {"id": "c10", "n": "10", "title": "10. ChatGPT : rôle et prompts", "phase": 0, "sum": "Utiliser ChatGPT comme dessinateur (images de personnages, décors, plans) et comme assistant de rédaction.", "md": "> [Ouvrir l'annexe J](#mvrm72sfxts.296252) : écrire un prompt que ChatGPT, Claude, Gemini et Grok comprennent tous.\n\n**Ce que tu vas faire.** Utiliser ChatGPT comme dessinateur (images de personnages, décors, plans) et comme assistant de rédaction.\n\n**Pourquoi cette étape existe.** ChatGPT est l'un des outils les plus simples pour créer des images à partir d'un long prompt et pour modifier une image que tu joins. Il ne fait plus de vidéo : OpenAI a arrêté Sora (l'application en avril 2026, l'accès pour développeurs en septembre 2026), et la page de tarifs actuelle de ChatGPT ne mentionne aucune génération vidéo. Ignore donc les tutoriels de 2025 qui parlent de Sora.\n\n### Les offres (vérifiées le 29 septembre 2026)\n\n| Offre | Ce que dit la [page de tarifs](https://chatgpt.com/fr-FR/pricing/) | Pour ton projet |\n| --- | --- | --- |\n| Free | Images limitées et plus lentes | Suffisant pour créer quelques références et tester |\n| Go | Plus d'images et de messages | Première offre payante utile si le quota gratuit te bloque |\n| Plus | Images avancées, modèles étendus | Confortable pour produire plusieurs épisodes par semaine |\n| Pro | Usage très élevé (5 fois Plus) | Inutile pour débuter |\n\nLa page française ne rendait pas les montants en euros au moment de ma vérification. Les comparatifs récents donnent environ 8 € par mois pour Go et 23 € pour Plus : lis le prix exact sur ton écran de paiement. OpenAI ne publie aucun nombre d'images par jour : le compteur affiché dans l'application fait foi.\n\n### Pas à pas : préparer ChatGPT\n\n1. Va sur chatgpt.com, crée un compte ou connecte-toi.\n2. Dans le menu de gauche, clique sur **Projets**, puis **Nouveau projet**. Nomme-le `Serie images`.\n3. Dans le projet, ajoute les fichiers de référence : bible en résumé (`05_bible_resume`), descriptions visuelles (`06_descriptions_visuelles`), images maîtresses.\n4. Dans les **instructions du projet**, colle la consigne ci-dessous. Elle s'appliquera à toutes les conversations du projet.\n5. **Une nouvelle conversation par épisode.** Les conversations trop longues finissent par dériver.\n6. Pour chaque image : joins les images maîtresses des personnages présents (bouton **+**), colle le prompt du plan, envoie.\n7. Pour corriger : demande une modification précise dans la même conversation (« garde tout, change seulement... »).\n\n**Ce que ChatGPT fait bien :** suivre un long prompt, modifier une image jointe, garder un style. **Ce qu'il fait mal :** le texte écrit dans l'image (souvent faux), plus de deux personnages qui interagissent, les images vraiment verticales (il produit souvent du 2:3, tu recadreras en 9:16 au montage).\n\n**À sauvegarder.** Les consignes du projet, les prompts qui ont donné de bons résultats dans `PROMPTS_valides`, chaque image téléchargée immédiatement (l'historique n'est pas une sauvegarde).\n\n**Si le résultat est mauvais.**\n\n- Le quota est atteint : attends le renouvellement ou passe à Gemini ou Leonardo pour les images restantes.\n- Le personnage change : ajoute « identical to the attached reference » et joins l'image.\n- L'outil refuse : retire tout nom de personne réelle ou de marque de ton prompt.\n\n**Consigne à coller dans les instructions du projet**\n\n```\nTu m'aides à créer les images d'une série animée. Les fichiers du projet sont la source de vérité : bible, descriptions visuelles, images maîtresses. Ne change jamais l'apparence d'un personnage. Quand je te donne un plan, utilise la description visuelle fixe des personnages présents, joins l'image maîtresse comme référence, et génère une image verticale sans texte. Si un détail manque, demande-moi avant d'inventer.\n```\n\n**Prompt : image d'un plan avec références jointes (anglais)**\n\n```\nUse the attached reference images. Keep both characters EXACTLY as in their reference: same shape, colors, face, clothes and accessories. Scene: [colle la description du plan]. Medium shot. Vertical format, no text, no watermark.\n```\n\nTraduction : utilise les images de référence jointes. Garde les deux personnages EXACTEMENT comme sur leur référence : même forme, couleurs, visage, vêtements et accessoires. Scène : \\[description du plan\\]. Plan moyen. Format vertical, sans texte, sans filigrane."}, {"id": "c11", "n": "11", "title": "11. Claude : rôle et prompts", "phase": 0, "sum": "Utiliser Claude comme scénariste, directeur artistique et contrôleur de continuité : il écrit, structure, vérifie et prépare tous tes prompts.", "md": "**Ce que tu vas faire.** Utiliser Claude comme scénariste, directeur artistique et contrôleur de continuité : il écrit, structure, vérifie et prépare tous tes prompts.\n\n**Pourquoi cette étape existe.** Claude est fort quand il travaille sur un long texte de référence : il relit ta bible à chaque conversation d'un projet et repère les contradictions. Il ne génère ni vidéo ni voix. Pour les images de tes personnages, utilise plutôt ChatGPT, Gemini, Leonardo ou Midjourney.\n\n### Les offres ([claude.com/pricing](https://claude.com/pricing), vérifié le 29 septembre 2026)\n\n| Offre | Prix | Ce que ça te donne |\n| --- | --- | --- |\n| Free | 0 € | Recherche web, fichiers, mémoire, création de documents. Largement suffisant pour débuter. |\n| Pro | 17 $ par mois en paiement annuel, 20 $ par mois en mensuel (HT) | Usage nettement plus élevé, projets, utile pour écrire 10 épisodes d'un coup. |\n| Max | à partir de 100 $ par mois | Inutile ici. |\n\n### Pas à pas : créer ton projet\n\n1. Va sur claude.ai et connecte-toi.\n2. Dans le menu de gauche, clique sur **Projets**, puis **Nouveau projet**. Nomme-le `Ma serie`.\n3. Ajoute les connaissances du projet : `02_concept_final`, `04_univers`, `05_bible_v01`, `06_descriptions_visuelles` (bouton pour ajouter du contenu au projet).\n4. Dans les **instructions du projet**, colle la consigne ci-dessous.\n5. Démarre une conversation dans le projet. Chaque conversation hérite de la bible.\n6. Travaille toujours en trois temps : **contexte** (ce qui est verrouillé), **demande** (ce que tu veux), **format** (tableau, liste, texte prêt à copier).\n7. Fais toujours une passe de **contrôle de continuité** avant de produire des images (prompt 3 ci-dessous).\n\n**Ce que Claude fait bien :** analyser un tableau de veille, garder la cohérence d'un long récit, minuter un épisode, écrire des prompts pour les autres outils, préparer titres et descriptions, analyser tes statistiques. **Ce qu'il ne fait pas :** te montrer ce que TikTok affiche, ni voir tes vidéos à ta place. L'observation reste ton travail.\n\n**À sauvegarder.** Le projet lui-même, et chaque sortie utile copiée dans ton dossier (le texte d'une conversation n'est pas un fichier de travail).\n\n**Si le résultat est mauvais.**\n\n- Il oublie une règle : recopie la règle critique dans le prompt.\n- Le contexte devient trop long : donne seulement ce qui sert à la tâche, avec le résumé d'une page de la bible.\n- Les dialogues sonnent génériques : demande trois versions et réécris toi-même les répliques finales. C'est ta signature, et c'est ce que les plateformes attendent d'une vraie série.\n\n**Prompt 1 : consigne du projet**\n\n```\nTu es le scénariste et le directeur artistique de ma série animée. Les fichiers du projet (concept, univers, bible, descriptions visuelles) sont la source de vérité. N'invente aucun personnage, lieu ou règle qui contredit ces fichiers. Quand tu proposes une idée, indique si elle respecte la bible. Les dialogues sont en français, courts, naturels. Les prompts pour les générateurs d'images et de vidéos sont en anglais. Pas de violence, pas de contenu suggestif, pas de personne réelle.\n```\n\n**Prompt 2 : idées d'épisodes**\n\n```\nEn utilisant exclusivement la bible du projet, propose 10 idées d'épisodes. Pour chacune : hook en une phrase, conflit, escalade, révélation, cliffhanger. Aucun élément d'une série existante.\n```\n\n**Prompt 3 : contrôle de continuité**\n\n```\nCompare le scénario ci-dessous avec la bible du projet. Liste uniquement les contradictions concernant personnages, apparence, lieux, chronologie et règles. Ne réécris pas le scénario. Scénario : [colle].\n```"}, {"id": "c12", "n": "12", "title": "12. Grok : rôle et prompts", "phase": 0, "sum": "Comprendre ce que Grok apporte à ta chaîne : un troisième assistant pour brainstormer, un lecteur de tendances sur le réseau X, et surtout un...", "md": "**Ce que tu vas faire.** Comprendre ce que Grok apporte à ta chaîne : un troisième assistant pour brainstormer, un lecteur de tendances sur le réseau X, et surtout un générateur de vidéo (Grok Imagine).\n\n**Pourquoi cette étape existe.** Grok est le seul des trois assistants (Claude, ChatGPT, Grok) qui anime des images. Mais l'accès gratuit aux images et aux vidéos a été retiré en mars 2026 : il faut un abonnement payant.\n\n### Les offres (d'après un comparatif récent, les prix exacts étant à confirmer sur l'écran de paiement)\n\n| Offre | Prix | Grok Imagine | Limites |\n| --- | --- | --- | --- |\n| Gratuit | 0 $ | Non | Chat limité |\n| SuperGrok Lite | 10 $ par mois | Oui | Vidéo en 480p, clips de 6 secondes, petite réserve d'usage |\n| SuperGrok | 30 $ par mois | Oui | Vidéo en 720p, clips plus longs, réserve d'usage standard |\n| SuperGrok Heavy | 300 $ par mois | Oui | 1080p, très grosse réserve. Inutile pour débuter. |\n\nSource : [Fello AI, tarifs Grok](https://felloai.com/grok-pricing/) (comparatif secondaire : xAI ne publie pas ses quotas). La réserve d'usage est hebdomadaire et partagée entre le chat, les images et les vidéos. Une vidéo consomme beaucoup plus qu'une image, et la résolution peut retomber en 480p quand tu approches de ta limite. Selon les sources, les images et vidéos portent un filigrane Grok que la politique d'utilisation interdit de retirer : laisse-le visible.\n\n### Pas à pas : premier contact\n\n1. Va sur grok.com (ou ouvre l'application Grok) et connecte-toi.\n2. Pour **brainstormer**, écris dans la zone de discussion, comme avec Claude ou ChatGPT. Colle ton résumé de bible et demande des variantes.\n3. Pour **lire les tendances**, demande-lui ce qui se dit sur le réseau X au sujet des feuilletons IA en français. C'est son avantage : l'accès direct à X. Rappelle-toi qu'il ne voit pas TikTok à ta place.\n4. Pour **animer**, cherche l'onglet **Imagine**. Le détail des clics se trouve à la section 17.\n5. **Ne copie jamais dans ta bible** une proposition de Grok sans l'avoir comparée à ce qui est déjà verrouillé. Ta bible reste la source de vérité.\n\n**Comment répartir les rôles entre les trois assistants.**\n\n| Besoin | Premier choix | Secours |\n| --- | --- | --- |\n| Concept, bible, scénario, continuité | Claude | ChatGPT |\n| Images de personnages et de plans | ChatGPT | Gemini, Leonardo |\n| Animation image vers vidéo | Grok Imagine ou un outil vidéo dédié | Google Flow, Kling, Runway |\n| Variantes d'idées, tendances sur X | Grok | Claude |\n| Montage | CapCut (aucun des trois) | Montage intégré de TikTok |\n\n**À sauvegarder.** Les propositions retenues dans un fichier `IDEES_retenues`, avec la date.\n\n**Si le résultat est mauvais.**\n\n- Grok invente des éléments qui contredisent ta bible : rappelle-lui que la bible prime et colle la règle.\n- Le quota fond vite : garde Grok pour l'animation et laisse le brainstorming à Claude ou ChatGPT.\n- Vérifie toujours les prix et les fonctions directement chez xAI, ils changent souvent.\n\n**Prompt : variantes d'idées**\n\n```\nVoici ma bible de série (résumé) : [colle]. Propose 5 variantes du même épisode : [résumé de l'épisode]. Chaque variante change la révélation ou le cliffhanger, mais respecte les personnages, les lieux et les règles. Indique pour chacune ce qu'elle risque de contredire dans la bible.\n```\n\n**Prompt : tendances**\n\n```\nQuels sujets et quels formats de feuilletons animés par IA en français reviennent le plus sur X cette semaine ? Cite des exemples de posts, sans reprendre leurs histoires, et dis-moi ce qui manque encore comme angle.\n```"}, {"id": "c13", "n": "13", "title": "13. Écrire une saison", "phase": 0, "sum": "Passer d'une idée isolée à une saison de 10 épisodes dans laquelle chaque épisode répond à une question et en ouvre une nouvelle.", "md": "**Ce que tu vas faire.** Passer d'une idée isolée à une saison de 10 épisodes dans laquelle chaque épisode répond à une question et en ouvre une nouvelle.\n\n**Pourquoi cette étape existe.** Sans plan de saison, tu inventes chaque épisode au dernier moment, l'histoire tourne en rond et tu ne sais plus quoi révéler quand. Une saison donne aussi une raison de suivre le compte : les gens reviennent pour l'épisode suivant.\n\n**Avant de commencer.** Ta bible (section 5) et 1 heure.\n\n### Le principe\n\nChaque épisode a une **mini-intrigue** (un petit problème résolu à la fin) et il avance **le grand mystère** de la saison (une question qui reste ouverte jusqu'au finale). Le spectateur obtient une réponse partielle et une nouvelle question.\n\n### Pas à pas\n\n1. **Écris le grand mystère** en une phrase (exemple : qui a vendu la moitié du marché, et à qui ?).\n2. **Choisis 10 épisodes** pour ta première saison. Plus court, tu ne verras pas si le public accroche. Plus long, tu t'épuises.\n3. **Place les révélations** progressivement : petit indice à l'épisode 2, faux coupable à l'épisode 4, retournement à l'épisode 6, aveu à l'épisode 9, finale à l'épisode 10.\n4. **Varie les types de conflit** : secret, rivalité, fausse accusation, alliance, conflit d'équipe, réconciliation. Si chaque épisode a le même conflit, YouTube peut considérer ta chaîne comme répétitive (section 35).\n5. **Prépare la fin de saison** avant de commencer : tu sais où tu vas.\n6. **Vérifie** que chaque épisode donne envie de voir le suivant.\n\n| N° | Titre | Question posée | Réponse partielle | Nouvelle question |\n| --- | --- | --- | --- | --- |\n| 1 | La lettre | Que contient la lettre ? | Une vente secrète | Qui a fait tomber la cagette ? |\n| 2 | Le témoin | Qui écoutait ? | C'était Cerise | Va-t-elle parler ? |\n| 3 | Le comptable | Que cache le bureau de M. Citron ? | Des factures truquées | Pour qui ? |\n| 4 | Le faux coupable | Qui a signé ? | Basile est accusé | Est-il innocent ? |\n| 5 | La rumeur | D'où vient la fuite ? | Prune a tout répété | Qui l'a informée ? |\n| 6 | Le retournement | Qui ment ? | Madame Pomme | Pourquoi a-t-elle vendu ? |\n| 7 | L'étal fermé | Le marché survivra-t-il ? | Un acheteur apparaît | Qui est-il ? |\n| 8 | L'alliance | Peut-on s'unir ? | Cerise et Basile s'associent | Que veut le comptable ? |\n| 9 | L'aveu | Pourquoi ce secret ? | Une dette ancienne | Qui l'a contractée ? |\n| 10 | La réouverture | Le marché est-il sauvé ? | Oui, mais … | Saison 2 |\n\n**À sauvegarder.** Le tableau de saison dans `05_scenarios/SAISON_01`, avec une ligne par épisode. Ajoute une colonne **Statut** (à écrire, écrit, image, vidéo, monté, publié).\n\n**Si le résultat est mauvais.**\n\n- L'intrigue est trop compliquée : retire des sous-intrigues. Une seule question principale suffit.\n- Chaque épisode se ressemble : change le type de conflit d'un épisode à l'autre.\n- Tu ne sais pas comment finir : écris le finale d'abord, puis remonte.\n\n**Prompt à copier (Claude)**\n\n```\nEn utilisant la bible du projet, écris l'arc de la saison 1 en 10 épisodes. Donne d'abord le grand mystère en une phrase. Puis pour chaque épisode : titre, question posée, mini-intrigue, réponse partielle, nouvelle question, personnages présents, lieu principal. Varie les types de conflit. Place un faux coupable, un retournement et un aveu. Le finale doit répondre au grand mystère et ouvrir une saison 2.\n```"}, {"id": "c14", "n": "14", "title": "14. Écrire un épisode", "phase": 1, "sum": "Écrire le script complet d'un épisode de 65 à 75 secondes, avec ses dialogues, avant de produire la moindre image.", "md": "> [Ouvrir l'annexe L, partie D](#mvrm72sfxts.297318) : les formules d'accroche.\n>\n> [Ouvrir l'annexe K, partie D](#mvrm72sfxts.297125) : l'identité de série et l'écriture pour la caméra.\n\n**Ce que tu vas faire.** Écrire le script complet d'un épisode de 65 à 75 secondes, avec ses dialogues, avant de produire la moindre image.\n\n**Pourquoi cette étape existe.** Le scénario guide la production, pas l'inverse. Modifier une phrase coûte 10 secondes. Modifier un plan déjà animé coûte des crédits et une heure de travail.\n\n**Avant de commencer.** Le résumé de l'épisode (tableau de saison), la durée cible, les personnages présents (deux par plan au maximum).\n\n### La structure d'un épisode de 60 à 75 secondes\n\n| Moment | Durée | Contenu |\n| --- | --- | --- |\n| Hook | 0 à 3 s | Une image choc ou une phrase qui pose une question |\n| Rappel | 3 à 8 s | Une phrase ou un sous-titre « Précédemment » (sauf épisode 1) |\n| Mise en place | 8 à 15 s | Qui, où, pourquoi |\n| Montée | 15 à 45 s | Le conflit, 2 ou 3 échanges, un indice |\n| Retournement | 45 à 60 s | La révélation |\n| Cliffhanger | 60 à 75 s | Une question sans réponse, un visage figé, un carton « À suivre » |\n\nPourquoi viser plus d'une minute : le programme de rémunération de TikTok ne prend en compte que les vidéos d'au moins une minute (section 34). Vise 65 à 75 secondes plutôt que 60 pile.\n\n### Pas à pas\n\n1. **Écris la dernière phrase en premier** : le cliffhanger. Ensuite tu remontes.\n2. **Écris le hook** : 1 à 3 secondes, une question ou un choc (section 25).\n3. **Écris 3 phrases de résumé** de l'épisode, puis développe chaque phrase en 2 ou 3 répliques.\n4. **Garde des répliques courtes** : 20 mots au maximum par plan. Une réplique de 10 secondes ne dépasse pas 20 à 25 mots.\n5. **Lis à voix haute avec un chronomètre** (celui de ton téléphone). Si tu dépasses 75 secondes, coupe les répétitions avant de supprimer une scène importante.\n6. **Réécris toi-même les dialogues finaux.** C'est ta patte, ce qui distingue ta série d'une production automatique.\n7. **Fais la passe de continuité** (prompt 3 de la section 11).\n\n**Exemple : épisode 1, La lettre (extrait avec minutage)**\n\n```\n0:00  HOOK (voix off, sombre) : \"Une lettre. Et le marché ne sera plus jamais le même.\"\n0:04  Madame Pomme trouve l'enveloppe sous la porte de son étal. Silence.\n0:10  MADAME POMME (à elle-même) : \"Ils ont fini par l'envoyer.\"\n0:17  Basile Banane entre, sourire figé. BASILE : \"Vous avez lu ?\"\n0:25  MADAME POMME : \"Sortez.\"\n0:33  Cerise, cachée derrière les cagettes, écoute, son carnet à la main.\n0:45  BASILE : \"Vous avez vendu la moitié des étals. Sans nous le dire.\"\n0:55  Une cagette tombe. Tout le monde se fige.\n1:03  Carton : \"Qui a fait tomber la cagette ? Épisode 2, demain 19 h.\"\n```\n\n**À sauvegarder.** Le script final `EP01_script_v01`, la version avec minutage, la liste des dialogues seule.\n\n**Si le résultat est mauvais.**\n\n- Le script est trop long : coupe la mise en place, garde le conflit.\n- Il n'y a pas de tension : ajoute un obstacle ou un indice qui contredit ce que le spectateur croit.\n- Les dialogues sonnent artificiels : lis-les à voix haute, et remplace toute phrase que tu ne dirais jamais.\n\n**Prompt à copier (Claude)**\n\n```\nEn utilisant la bible du projet, écris le script de l'épisode [numéro] : [résumé en 3 phrases]. Durée cible : 70 secondes. Structure : hook de 3 secondes, rappel de 5 secondes (sauf épisode 1), conflit, révélation, cliffhanger. Deux personnages maximum par scène. Répliques en français, 20 mots maximum. Donne le minutage. Ne résous pas le conflit principal de la saison.\n```"}, {"id": "c15", "n": "15", "title": "15. Transformer l'épisode en storyboard", "phase": 1, "sum": "Découper le script en 8 à 12 plans numérotés, chacun avec son image de départ, son mouvement, son dialogue et sa durée.", "md": "**Ce que tu vas faire.** Découper le script en 8 à 12 plans numérotés, chacun avec son image de départ, son mouvement, son dialogue et sa durée.\n\n**Pourquoi cette étape existe.** Un générateur vidéo produit des clips de 5 à 10 secondes, pas un film de 70 secondes. Le storyboard transforme ton histoire en une liste de commandes précises, et évite de générer des images inutiles.\n\n**Avant de commencer.** Le script final, tes images maîtresses, la durée maximale d'un clip dans ton outil vidéo (section 17).\n\n### La règle d'or : une action principale par plan\n\nMauvais plan : « Cerise entre, s'assoit, pleure, se lève, court et ouvre la porte. » Six actions, l'IA cassera la continuité.\n\nBons plans : « Cerise regarde vers Basile. » Puis : « Cerise tourne lentement la tête vers la lettre. » Puis : « La lettre glisse de sa main. »\n\n### Pas à pas\n\n1. Ouvre un tableur (Google Sheets) et crée les colonnes du tableau ci-dessous.\n2. **Découpe l'action en plans** : un nouveau plan quand le lieu, le personnage, l'émotion ou l'action change.\n3. **Numérote** de 01 à 12, et ajoute 2 plans de réserve (environ un plan sur trois à refaire).\n4. **Décris chaque plan** : cadrage (gros plan, plan moyen, plan large), action visible, qui parle, émotion, durée.\n5. **Ajoute le prompt image** (l'image de départ) et le **prompt vidéo** (seulement ce qui bouge).\n6. **Vérifie que chaque plan est animable** : pas plus de deux personnages, aucune foule, pas de petits objets manipulés avec les mains.\n7. **Fusionne** deux plans qui racontent la même chose.\n\n| N° | Durée | Lieu | Personnages | Action visible | Cadrage | Dialogue | Prompt image | Prompt vidéo |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 01 | 5 s | Marché | Pomme | Elle trouve l'enveloppe | Plan moyen | Voix off : « Une lettre. » | Description fixe + scène | La pomme se penche et ramasse l'enveloppe |\n| 02 | 6 s | Marché | Pomme | Elle lit, inquiète | Gros plan | « Ils ont fini par l'envoyer. » | Référence + expression inquiète | Son regard descend lentement, ses sourcils se rapprochent |\n| 03 | 7 s | Marché | Pomme, Basile | Basile entre | Plan moyen | « Vous avez lu ? » | Deux références jointes | Basile entre par la droite, Madame Pomme se retourne |\n\n**À sauvegarder.** `EP01_storyboard_v01`, la liste des plans avec leurs durées et le total (doit faire environ 65 à 75 secondes).\n\n**Si le résultat est mauvais.**\n\n- Un plan contient trop d'actions : sépare-le en deux.\n- Le total dépasse 80 secondes : supprime les plans qui répètent une information.\n- Trop de plans de groupe : privilégie des plans avec un ou deux visages.\n\n**Prompt à copier (Claude)**\n\n```\nÀ partir du script de l'épisode [numéro] ci-joint, crée un storyboard de 10 plans plus 2 plans de réserve. Rends un tableau avec les colonnes : n°, durée (5 à 8 secondes), lieu, personnages (2 maximum), action visible (une seule action principale), cadrage, dialogue en français (20 mots maximum), émotion. Ajoute deux colonnes en anglais : \"Prompt image\" (description de l'image de départ qui reprend MOT POUR MOT la description visuelle fixe des personnages et du lieu) et \"Prompt vidéo\" (uniquement ce qui bouge : un mouvement, une expression, un seul mouvement de caméra). Le plan 1 doit accrocher en 3 secondes. Le dernier plan est le cliffhanger.\n```"}, {"id": "c16", "n": "16", "title": "16. Créer les images plan par plan", "phase": 1, "sum": "Produire l'image de départ de chaque plan du storyboard, avec des personnages et des décors identiques à tes références maîtresses.", "md": "> [Ouvrir l'annexe H, partie B](#mvrm72sfxts.296565) : les modèles officiels d'images.\n>\n> [Ouvrir l'annexe H, partie C](#mvrm72sfxts.296602) : les retouches ciblées.\n\n**Ce que tu vas faire.** Produire l'image de départ de chaque plan du storyboard, avec des personnages et des décors identiques à tes références maîtresses.\n\n**Pourquoi cette étape existe.** Une vidéo IA part toujours d'une image. Si l'image est fausse (mauvaise couleur, main déformée), l'animation amplifiera l'erreur. Corriger une image coûte quelques secondes, corriger un clip coûte des crédits.\n\n**Avant de commencer.** Le storyboard (section 15), les images maîtresses des personnages et des lieux, ton outil d'images ouvert dans un projet ou une conversation dédiée à l'épisode.\n\n### Pas à pas\n\n1. Crée une **nouvelle conversation** pour l'épisode (dans ton projet ChatGPT, ou une conversation Gemini). Nomme-la `EP01 images`.\n2. Pour le **plan 01** : joins l'image maîtresse du décor et celle des personnages présents (maximum deux personnages).\n3. Colle le **prompt image** du storyboard, qui contient déjà les descriptions fixes. Envoie.\n4. **Génère 2 ou 3 versions** du même plan. Ne t'arrête pas à la première.\n5. **Contrôle chaque image** avec la grille ci-dessous.\n6. **Corrige plutôt que recommencer** : si le visage est bon mais la pose ne va pas, demande une modification précise.\n7. **Télécharge** l'image retenue et renomme-la selon la convention `E01_P01_pomme_enveloppe_v01.png`.\n8. Répète pour chaque plan, en gardant le même ordre que le storyboard.\n9. **Affiche toutes les images côte à côte** (un Google Doc ou un dossier en vignettes) et regarde la suite comme un roman-photo : les couleurs, la tenue et le décor doivent s'enchaîner.\n\n### Grille de contrôle d'une image de plan\n\n| Point à vérifier | Ce que tu regardes |\n| --- | --- |\n| Identité | Forme, couleur, visage et accessoire signature identiques à la référence |\n| Tenue | Aucune pièce de vêtement ne change |\n| Décor | Objets permanents présents et au bon endroit |\n| Mains et bouches | Pas de doigts en trop, bouche bien placée |\n| Texte | Aucune lettre parasite ou illisible |\n| Format | Vertical, avec de l'espace en haut et en bas pour les sous-titres |\n| Animabilité | Pas plus de deux personnages, pas de petits objets complexes |\n\n**Combien d'images prévoir.** Un épisode demande environ 10 images de plans et 5 essais ratés, soit environ 15 images. Si ton quota gratuit est de 2 ou 3 images par jour, cela fait une semaine par épisode : c'est la limite du budget 0 € (section 41).\n\n**Points de vigilance propres à certains styles (exemple : humains à peau ou tête de fruit).**\n\n- **La peau de fruit dérive.** La couleur, la brillance et la texture (pépins, écailles, taches) changent facilement d'un plan à l'autre. Ajoute à chaque prompt la couleur exacte et la texture, mot pour mot, et joins l'image maîtresse.\n- **Les mains et les dents.** Ce sont les défauts les plus visibles sur des humains en 3D. Demande des mains simples (« hands relaxed, five fingers ») ou cadre en plan poitrine quand la main n'est pas utile.\n- **Les vêtements.** Demande « plain clothing, no logo, no brand, no printed text » pour éviter les marques et les lettres parasites.\n- **Les corps.** Garde des proportions réalistes et des tenues de la vie quotidienne (voir l'annexe A, « Le style de ta série », à la fin du guide).\n- **Les tiges et les feuilles.** Sur une tête de fruit, la tige doit rester au même endroit et de la même forme. Note-la dans la description fixe.\n\n**À sauvegarder.** Les images finales dans `07_IMAGES/EP01`, le prompt exact qui a donné chaque image (un tableur avec le numéro du plan et le texte), et l'image source utilisée.\n\n**Si le résultat est mauvais.**\n\n- Le personnage est incohérent : ne valide pas l'image parce qu'elle est jolie. Recommence en joignant la référence.\n- Les deux personnages se mélangent : génère chacun séparément sur le même décor, puis assemble-les dans un plan large au montage.\n- La composition ne convient pas : demande un cadrage précis (« close-up », « medium shot », « wide shot »).\n\n**Prompt : plan à deux personnages (anglais)**\n\n```\nUse the attached reference images for the characters and the location. Keep everything EXACTLY as in the references. Scene: [colle la description du plan]. [Cadrage : close-up / medium shot / wide shot]. Madame Pomme on the left, Basile on the right, warm late afternoon light. Vertical format, no text, no watermark.\n```\n\nTraduction : utilise les images de référence jointes pour les personnages et le lieu. Garde tout EXACTEMENT comme sur les références. Scène : \\[description\\]. \\[Cadrage\\]. Madame Pomme à gauche, Basile à droite, lumière chaude de fin d'après-midi. Format vertical, sans texte, sans filigrane.\n\n### L'animatic : tester l'épisode avant d'animer\n\nL'animatic est un montage provisoire fait uniquement avec des images fixes, avant de dépenser le moindre crédit vidéo. Les guides de production d'animation l'appellent le « filtre à coûts » : il montre si le rythme tient, s'il manque un plan ou si une scène est confuse ([Neolemon, officieux](https://www.neolemon.com/blog/ai-storyboard-to-animation-pipeline-workflow/)).\n\n1. Quand tu as toutes tes images de plans ([section 16](#mvrm72sfxts.58456)), importe-les dans CapCut dans l'ordre du storyboard.\n2. Donne à chaque image la durée prévue du plan (5 à 8 secondes).\n3. Enregistre les répliques avec ta propre voix, au téléphone, sans chercher la qualité. C'est une voix provisoire.\n4. Regarde l'animatic en entier, sur ton téléphone, comme un spectateur. Pose-toi trois questions : l'accroche marche-t-elle en 3 secondes ? Comprend-on qui parle et où on est ? La fin donne-t-elle envie de voir la suite ?\n5. Corrige le storyboard (plan en trop, plan manquant, réplique trop longue), puis seulement lance l'animation ([section 17](#mvrm72sfxts.61953)).\n\nÀ sauvegarder : `EP01_animatic_v01.mp4` dans le dossier de l'épisode. Compte 20 à 30 minutes : c'est souvent la demi-heure qui économise le plus de crédits."}, {"id": "c17", "n": "17", "title": "17. Transformer les images en vidéos", "phase": 1, "sum": "Animer chaque image de plan pour obtenir un clip de 5 à 10 secondes où le personnage bouge, change d'expression et éventuellement parle.", "md": "> [Ouvrir l'annexe G](#mvrm72sfxts.296035) : les techniques des guides officiels.\n>\n> [Ouvrir l'annexe H, partie A](#mvrm72sfxts.296509) : les prompts d'animation.\n>\n> [Ouvrir l'annexe K, partie A](#mvrm72sfxts.296985) : les défauts d'animation et leurs solutions.\n>\n> Pense à faire l'animatic juste avant cette section.\n\n**Ce que tu vas faire.** Animer chaque image de plan pour obtenir un clip de 5 à 10 secondes où le personnage bouge, change d'expression et éventuellement parle.\n\n**Pourquoi cette étape existe.** C'est l'étape qui transforme ton roman-photo en série animée. C'est aussi la plus coûteuse en crédits, parce qu'il faut souvent 2 à 4 essais par plan, et les essais ratés sont facturés.\n\n**Avant de commencer.** Les images finales de l'épisode (section 16) et la colonne « prompt vidéo » du storyboard.\n\n### Les outils comparés (vérifié le 29 septembre 2026)\n\n| Outil | Gratuit | Abonnements | Ce qu'il faut savoir |\n| --- | --- | --- | --- |\n| [Google Flow](https://gemini.google/fr/subscriptions/?hl=fr) (modèle Veo 3.1) | 50 crédits par jour d'après un comparatif | Google AI Plus 4,99 € par mois (200 crédits Flow), AI Pro 21,99 € (1 000 crédits), AI Ultra à partir de 99,99 € | Interface simple, son intégré. Un clip Fast coûte environ 20 crédits et un clip Quality environ 100, d'après [CostGoat](https://costgoat.com/pricing/google-flow). Un clip Lite coûte environ 10 crédits selon d'autres comparatifs. |\n| Kling | Version gratuite sans usage commercial | Standard environ 9 $ par mois (660 crédits), Pro environ 33 $ (3 000), Premier environ 81 $ (8 000), Ultra environ 160 $ (26 000). Le premier mois est souvent réduit. | Les offres payantes autorisent l'usage commercial et retirent le filigrane. 6 à 12 crédits par seconde selon la qualité et le son. Prix relevés dans un [comparatif](https://magichour.ai/blog/kling-ai-pricing) : la page officielle de Kling n'était pas consultable pour ma vérification, contrôle le prix sur ton écran. |\n| [Runway](https://runway.com/pricing) | 125 crédits une seule fois | Standard 15 $ par mois (12 $ en paiement annuel), Pro 35 $ (28 $), Max 95 $ (76 $) | Modèle Gen-4.5 à 12 crédits par seconde : l'offre Standard (625 crédits) donne environ 52 secondes de vidéo par mois. Pas de filigrane sur les offres payantes. |\n| Grok Imagine | Non | SuperGrok Lite 10 $ (480p, 6 s), SuperGrok 30 $ (720p) | Le seul des trois assistants qui anime. Voir la section 12. |\n| [Midjourney](https://docs.midjourney.com/hc/en-us/articles/27870484040333-Comparing-Midjourney-Plans) | Non | Vidéo SD sur Basic, HD dès Standard | Utile si tu fais déjà tes images dessus. |\n\n**Mon conseil pour débuter :** teste Google Flow avec les crédits gratuits quotidiens. Quand tu es sûre de ta série, prends un seul abonnement : Google AI Pro (il couvre aussi les images) ou Kling Standard. Vérifie dans les conditions de Google si l'usage commercial est autorisé avec les crédits gratuits avant de monétiser.\n\n### Pas à pas dans Google Flow\n\n1. Va sur flow.google.com et connecte-toi avec ton compte Google.\n2. Crée un **nouveau projet**. Nomme-le `EP01`.\n3. Choisis le mode **image vers vidéo** (le libellé peut être « Frames to video » ou similaire).\n4. **Importe** l'image du plan 01.\n5. Colle le **prompt vidéo** du plan (voir les exemples ci-dessous).\n6. Règle le **format vertical 9:16** et le modèle. Pour tester, choisis la version la moins chère (Lite ou Fast). Garde Quality pour les plans importants.\n7. Lance la génération. Elle prend 1 à 5 minutes.\n8. **Regarde le clip en entier**, puis regarde les mains, le visage et le décor. Si le personnage se déforme, relance une fois, puis simplifie le mouvement.\n9. **Télécharge** le clip retenu et renomme-le `E01_P01.mp4`.\n\n### Pas à pas dans Kling, Runway ou Grok\n\nLe principe est identique : ouvre le mode **Image to Video**, importe l'image, colle le prompt de mouvement, choisis la durée et le format 9:16, commence en qualité rapide ou standard, puis télécharge le clip. Dans Grok, ouvre l'onglet **Imagine**, ajoute l'image avec l'icône d'import, choisis la vidéo et le format vertical.\n\n### Le calcul réel pour un épisode\n\nUn épisode de 70 secondes représente environ 10 plans. Avec 2 à 3 essais par plan, compte **20 à 30 générations**.\n\n| Outil | Calcul | Crédits par épisode |\n| --- | --- | --- |\n| Google Flow, Veo Lite | 20 à 30 clips × 10 crédits | 200 à 300 |\n| Google Flow, Veo Fast | 20 à 30 clips × 20 crédits | 400 à 600 |\n| Kling, 1080p avec son | 20 à 30 clips de 5 s × 60 crédits | 1 200 à 1 800 |\n| Runway Gen-4.5 | 20 à 30 clips de 6 s × 72 crédits | 1 440 à 2 160 |\n\nAvec 1 000 crédits Flow par mois (Google AI Pro), cela donne 3 à 5 épisodes en Lite ou environ 2 épisodes en Fast. Ce sont des estimations de production, pas des quotas officiels.\n\n**À sauvegarder.** Chaque clip retenu dans `08_VIDEOS/EP01`, le prompt vidéo utilisé dans ton tableur, la version de l'outil.\n\n**Si le résultat est mauvais.**\n\n- Le personnage se déforme : réduis le mouvement, demande « minimal movement », garde une caméra fixe.\n- Le décor bouge trop : écris « static camera ».\n- Il y a plusieurs actions dans le clip : garde une seule action par plan.\n- Le clip dépasse ton budget : teste en qualité basse, ne passe en haute qualité que pour la version finale.\n- Les mouvements qui marchent bien : tourner la tête, cligner, sourire qui se fige, larme, lent zoom avant. Ceux qui marchent mal : deux personnages qui se touchent, mains qui manipulent de petits objets, longue marche, foule.\n\n**Prompt vidéo : émotion sans parole (anglais)**\n\n```\nSlow cinematic push-in. Madame Pomme slowly turns her head toward the camera, her smile freezes, a single tear rolls down her cheek. Subtle eye movement and natural breathing. No body deformation. Keep the character design identical to the reference image. AUDIO: soft market ambience, one low piano note at the end. No music. No dialogue.\n```\n\nTraduction : lent zoom cinématographique vers l'avant. Madame Pomme tourne lentement la tête vers la caméra, son sourire se fige, une larme coule sur sa joue. Léger mouvement des yeux et respiration naturelle. Aucune déformation du corps. Garde le design du personnage identique à l'image de référence. Son : ambiance de marché douce, une note grave de piano à la fin. Pas de musique, pas de dialogue.\n\n**Prompt vidéo : révélation (anglais)**\n\n```\nBasile drops the letter, which falls to the floor; his eyes widen in panic. Static camera, slight shake when the letter lands. AUDIO: paper rustle, a sharp gasp. No music.\n```\n\nTraduction : Basile lâche la lettre qui tombe au sol, ses yeux s'écarquillent de panique. Caméra fixe, légère secousse quand la lettre touche le sol. Son : froissement de papier, souffle coupé. Pas de musique."}, {"id": "c18", "n": "18", "title": "18. Faire parler les personnages", "phase": 1, "sum": "Choisir comment tes personnages parlent : voix intégrée au générateur vidéo, voix off avec sous-titres, ou voix IA séparée avec synchronisation des...", "md": "> [Ouvrir l'annexe I](#mvrm72sfxts.296171) : garder la même voix et faire parler un seul personnage à la fois.\n\n**Ce que tu vas faire.** Choisir comment tes personnages parlent : voix intégrée au générateur vidéo, voix off avec sous-titres, ou voix IA séparée avec synchronisation des lèvres.\n\n**Pourquoi cette étape existe.** Une image animée ne parle pas toute seule. Si tu écris une réplique dans un prompt sans avoir prévu de piste vocale, elle ne sera pas forcément prononcée, ou elle le sera avec une voix différente à chaque clip.\n\n**Avant de commencer.** Les dialogues finaux (section 14) et ton storyboard.\n\n### Les trois méthodes, de la plus simple à la plus soignée\n\n| Méthode | Principe | Coût | Rendu |\n| --- | --- | --- | --- |\n| A. Voix off et sous-titres | Un narrateur raconte, les personnages réagissent sans parler, les répliques importantes s'affichent en gros sous-titres | Gratuit à quelques euros | Très utilisé, aucune synchronisation à gérer |\n| B. Voix intégrée au générateur | Veo, Kling ou Grok génèrent la voix avec l'animation | Inclus dans les crédits vidéo | Rapide, mais la voix change parfois d'un clip à l'autre et le français est inégal |\n| C. Voix IA séparée et lip-sync | Tu crées une voix fixe par personnage (ElevenLabs), puis un outil synchronise les lèvres | 5 à 30 $ par mois en plus | Le plus cohérent et le plus professionnel |\n\n**Mon conseil.** Commence par la méthode A pour tes 3 premiers épisodes. Passe à la méthode C quand tu sais que la série plaît. La méthode B convient aux essais.\n\n### Pas à pas\n\n1. **Teste la méthode B sur 3 plans** avec une réplique courte. Écris le dialogue en français entre guillemets dans le prompt vidéo, avec une description de voix (voir le prompt ci-dessous).\n2. **Écoute** : la voix est-elle la même d'un clip à l'autre ? Le français est-il correct ? Les lèvres suivent-elles ?\n3. Si oui, garde cette méthode pour ce personnage. Si non, passe à la méthode A ou C.\n4. **N'utilise qu'une méthode par personnage** dans un même épisode. Mélanger la voix Grok et ta voix pour un même personnage se remarque tout de suite.\n5. **Génère les clips sans dialogue** quand tu choisis la méthode A ou C, en demandant « no dialogue » dans le prompt vidéo. Tu ajouteras les voix au montage.\n6. **Écris ton texte parlé** en lignes courtes : une ligne par réplique, 20 mots au maximum.\n\n**À sauvegarder.** Le dialogue final `EP01_dialogues`, un profil de voix par personnage dans la bible (section 19), et les clips test.\n\n**Si le résultat est mauvais.**\n\n- La vidéo ne parle pas : vérifie que tu as fourni une piste audio ou utilisé une fonction de lip-sync. Ne suppose pas qu'un texte écrit dans un prompt sera prononcé.\n- La voix change d'un clip à l'autre : passe à la méthode A ou C pour ce personnage.\n- Le français est mal prononcé : raccourcis la phrase, évite les liaisons difficiles, ou génère la voix séparément.\n\n**Prompt vidéo avec dialogue français (anglais)**\n\n```\nMadame Pomme looks straight at the camera and speaks calmly, lips moving in sync with the words. Static close-up. AUDIO: she says in French, with a deep, calm, mature female voice: \"Au marché, tout se sait.\" Soft market ambience. No music.\n```\n\nTraduction : Madame Pomme regarde la caméra et parle calmement, les lèvres synchronisées avec les mots. Gros plan fixe. Son : elle dit en français, d'une voix féminine grave, calme et mûre : « Au marché, tout se sait. » Ambiance douce de marché. Pas de musique.\n\n**Prompt vidéo pour poser ta propre voix après coup (anglais)**\n\n```\nMadame Pomme talks animatedly for the whole clip, mouth opening and closing as if speaking, small head movements. Static medium shot. AUDIO: silence.\n```\n\nTraduction : Madame Pomme parle avec animation pendant tout le clip, la bouche s'ouvre et se ferme comme si elle parlait, petits mouvements de tête. Plan moyen fixe. Son : silence."}, {"id": "c19", "n": "19", "title": "19. Voix IA", "phase": 1, "sum": "Donner à chaque personnage une voix reconnaissable et constante, avec ElevenLabs ou avec ta propre voix.", "md": "**Ce que tu vas faire.** Donner à chaque personnage une voix reconnaissable et constante, avec ElevenLabs ou avec ta propre voix.\n\n**Pourquoi cette étape existe.** La voix est aussi importante que l'apparence pour reconnaître un personnage. Trois à cinq voix très distinctes valent mieux que douze voix proches.\n\n**Avant de commencer.** Les fiches personnages, une phrase test identique pour tous (par exemple : « Au marché, tout se sait, et personne ne l'oublie. »), un casque ou des écouteurs.\n\n### ElevenLabs : les offres (page officielle, vérifiée le 29 septembre 2026)\n\n| Offre | Prix | Crédits par mois | Usage commercial | Clonage |\n| --- | --- | --- | --- | --- |\n| [Free](https://elevenlabs.io/pricing) | 0 $ | 10 000 | Non | Non |\n| Starter | 6 $ par mois | 30 000 | Oui | Clonage instantané |\n| Creator | 11 $ le premier mois, puis 22 $ | 121 000 | Oui | Clonage professionnel |\n| Pro | 99 $ | 600 000 | Oui | Clonage professionnel |\n\nEn général, un caractère de texte coûte un crédit (cela varie selon le modèle). Un épisode contient 600 à 1 000 caractères de dialogue, donc l'offre Starter suffit largement pour une série de début. **L'offre gratuite interdit l'usage commercial** : dès que tu vises une rémunération, prends au moins Starter.\n\n### Pas à pas avec ElevenLabs\n\n1. Va sur elevenlabs.io et crée un compte.\n2. Ouvre la bibliothèque de voix (menu **Voices**). Cherche l'outil de création de voix à partir d'une description (**Voice Design**, ou un nom proche).\n3. **Décris la voix** d'un personnage : par exemple « femme de 60 ans, voix grave et calme, légère autorité, phrases courtes, français de France ». Génère quelques propositions.\n4. **Écoute chaque proposition** avec la phrase test. Garde celle qui correspond au personnage.\n5. **Enregistre la voix** dans ta bibliothèque et donne-lui le nom du personnage. Elle restera identique pendant toute la série.\n6. Ouvre l'outil de synthèse vocale (**Text to Speech**), choisis la voix, colle une réplique, choisis la langue française et génère. Ajoute une indication d'émotion quand le modèle le permet (par exemple « en chuchotant »).\n7. **Télécharge** chaque réplique en fichier séparé : `EP01_P03_pomme.mp3`.\n8. Répète pour les autres personnages avec leur voix.\n\n### Sans ElevenLabs : ta propre voix\n\n1. Dans CapCut, utilise le bouton d'enregistrement de voix (nommé **Voix off** ou **Enregistrer**).\n2. Lis chaque réplique dans un endroit calme, à 10 centimètres du micro.\n3. Applique ensuite un effet de voix (plus grave, plus aigu) pour distinguer les personnages.\n\n### Règle juridique importante : ne clone jamais une voix sans droit\n\n- ElevenLabs limite le clonage professionnel à **ta propre voix**. Le clonage instantané exige que tu confirmes avoir les droits et le consentement.\n- **Autorisé :** une voix créée par description, ta propre voix, la voix d'une personne qui te donne son accord clair et écrit.\n- **Interdit :** la voix d'une célébrité, d'un influenceur, d'un acteur de doublage, d'un proche sans accord, ou tout ordre du type « fais exactement la voix de X ».\n\n**À sauvegarder.** Le nom de chaque voix, les réglages utilisés, la phrase test audio de chaque personnage, la date et l'offre au moment de la génération (pour prouver que tu avais la licence commerciale).\n\n**Si le résultat est mauvais.**\n\n- La voix sonne trop adulte ou trop jeune : change de voix plutôt que de forcer le texte.\n- Elle est monotone : retravaille le texte (phrases plus courtes, ponctuation expressive) et le rythme.\n- Deux voix se ressemblent : change la hauteur, l'âge ou l'accent d'un des deux personnages.\n\n**Prompt à copier (Claude) : profil de voix**\n\n```\nCrée un profil de voix pour le personnage [nom, rôle, caractère]. Donne : âge fictif, hauteur, débit, énergie, articulation, tic de langage, émotion dominante, et une description de 25 mots en français que je pourrai coller dans un outil de création de voix. Ne demande l'imitation d'aucune personne réelle. Ajoute une phrase test de 15 mots dans la voix du personnage.\n```"}, {"id": "c20", "n": "20", "title": "20. Lip-sync (synchroniser les lèvres)", "phase": 1, "sum": "Faire en sorte que la bouche du personnage bouge au rythme de la voix que tu as créée.", "md": "**Ce que tu vas faire.** Faire en sorte que la bouche du personnage bouge au rythme de la voix que tu as créée.\n\n**Terme expliqué.** Le *lip-sync* (de l'anglais « lip synchronization ») est la synchronisation entre le mouvement des lèvres et le son. Sans lui, la voix paraît collée sur l'image.\n\n**Pourquoi cette étape existe.** Quand la voix vient d'un autre outil que la vidéo, rien ne relie les deux. Un outil de lip-sync prend une vidéo (ou une image) et un fichier audio, et anime la bouche pour qu'elle suive.\n\n**Avant de commencer.** Les fichiers audio de la section 19, et des clips vidéo où le personnage regarde vers la caméra, bouche visible, générés avec la consigne « talking, mouth moving » (section 18).\n\n### Les options\n\n| Option | Principe | Remarque |\n| --- | --- | --- |\n| Fonction lip-sync de l'outil vidéo (Kling, Runway, Hedra ou équivalent) | Tu envoies vidéo ou image et audio, l'outil synchronise | Les noms et les prix changent souvent : vérifie la page de l'outil avant de payer |\n| Image parlante directe | Tu donnes une image du personnage et un audio, l'outil génère un clip parlant | Pratique pour les gros plans |\n| Sous-titres seulement | Tu ne synchronises rien | C'est la solution la plus sûre pour un débutant |\n\nMon conseil honnête : avec des visages humains en 3D, le lip-sync donne en général un meilleur résultat qu'avec un fruit sans visage, mais il reste fragile. Utilise-le pour les gros plans et les plans poitrine, de face ou de trois quarts. Pour les plans larges ou les plans à deux personnages, garde la voix off ou les sous-titres.\n\n### Pas à pas générique\n\n1. **Choisis le plan** : un gros plan ou un plan poitrine, personnage de face ou de trois quarts. Évite les profils stricts et les plans où deux personnages parlent en même temps.\n2. **Envoie l'image ou le clip** dans l'outil (bouton **Upload**, ou **Importer**).\n3. **Envoie l'audio** de la réplique correspondante, de 3 à 8 secondes.\n4. **Lance la génération**, puis regarde le résultat **avec le son**, en plein écran.\n5. **Vérifie trois points** : la bouche s'ouvre bien sur les voyelles, le visage garde son aspect (couleur, yeux), aucune déformation.\n6. **Télécharge** le résultat : `EP01_P03_lipsync_v1.mp4`.\n7. Garde le meilleur essai et supprime les autres après le montage.\n\n**À sauvegarder.** L'audio d'origine, la vidéo d'origine, le résultat, et le nom de l'outil avec la date.\n\n**Si le résultat est mauvais.**\n\n- La bouche ne bouge pas : elle est peut-être cachée (main, cheveux, ombre) ou le plan est trop large. Recrée l'image en gros plan de face, bouche bien visible (section 7).\n- Le visage se déforme : raccourcis l'audio, ou change de plan.\n- Le décalage est visible : décale l'audio de quelques images dans CapCut (section 23).\n- Trop de coût : repasse à la méthode A de la section 18.\n\n**Prompt à copier (Claude) : plan pensé pour le lip-sync**\n\n```\nPour chaque réplique de cet épisode [colle les dialogues], indique : le type de plan idéal pour un lip-sync (gros plan de face, plan poitrine), la durée de la réplique en secondes, et une consigne visuelle en anglais pour que la bouche du personnage soit bien visible. Signale les répliques trop longues (plus de 8 secondes) et propose de les couper.\n```"}, {"id": "c21", "n": "21", "title": "21. Musique", "phase": 1, "sum": "Choisir une musique de fond qui respecte les droits et renforce l'ambiance.", "md": "**Ce que tu vas faire.** Choisir une musique de fond qui respecte les droits et renforce l'ambiance.\n\n**Pourquoi cette étape existe.** La musique change complètement l'émotion d'une scène. Mais c'est aussi la cause la plus fréquente de vidéos réduites au silence ou démonétisées : une chanson connue, même courte, n'est pas libre de droits.\n\n**Avant de commencer.** Le ton de l'épisode (drôle, mystérieux, tendre) et la certitude que tu publieras dans un cadre où tu as le droit d'utiliser la musique choisie.\n\n### Où trouver de la musique sûre\n\n| Source | Ce qu'il faut savoir |\n| --- | --- |\n| Bibliothèque de musique commerciale de TikTok | Prévue pour les comptes professionnels. Un compte Créateur classique n'a accès qu'à la musique « standard », qui n'est pas autorisée pour les contenus commerciaux ou sponsorisés |\n| Bibliothèque audio de YouTube (YouTube Studio) | Gratuite pour les créateurs YouTube. Lis la licence de chaque morceau (certains demandent une mention de crédit) |\n| Sites de musique libre de droits (Pixabay et similaires) | Lis la licence du morceau au moment du téléchargement, et vérifie qu'elle couvre l'usage commercial et la monétisation |\n| Musique générée par IA (Suno, Udio ou équivalent) | Les conditions commerciales dépendent de l'offre choisie et changent souvent : vérifie avant d'utiliser sur un compte monétisé |\n| Musiques de CapCut | Attention : certaines sont réservées à un usage personnel. Vérifie l'indication d'usage commercial sur chaque morceau |\n\n**Ne fais jamais :** utiliser une chanson connue, un extrait de film, un jingle, ou une musique récupérée sur une autre vidéo. Ne te fie pas au fait que d'autres créateurs le font.\n\n### Pas à pas\n\n1. **Choisis 2 ou 3 morceaux** qui correspondent à l'ambiance (une piste joyeuse, une piste de suspense, une piste douce).\n2. **Écoute-les avec ta voix** : la musique ne doit jamais couvrir les dialogues.\n3. **Télécharge** et range le fichier dans `09_AUDIO/musique/`.\n4. **Note dans un tableau** : titre, artiste, site, lien, licence, date de téléchargement, usage commercial (oui ou non).\n5. **Règle le volume** au montage : musique à environ 10 à 20 % du volume de la voix (section 23 ; Kling indique 20 à 30 %, voir la partie « Astuces récentes »).\n6. **Garde la même musique** de signature au début de chaque épisode : c'est une marque de reconnaissance.\n\n**À sauvegarder.** Le fichier audio, la capture d'écran de la licence, et le tableau de suivi.\n\n**Si le résultat est mauvais.**\n\n- Ta vidéo est mise en sourdine : la musique est protégée. Remplace-la et republie.\n- La musique écrase les voix : baisse le volume ou choisis un morceau plus simple.\n- La même musique lasse : garde la signature, et change seulement la piste d'ambiance.\n\n**Prompt à copier (Claude) : brief musical**\n\n```\nJe crée une série de fiction animée dans le style [ton style]. Ambiance : [chaleureuse, drôle, légère tension]. Donne-moi 5 mots-clés de recherche en anglais pour trouver de la musique libre de droits dans une bibliothèque, la durée idéale (60 à 90 secondes), le tempo approximatif (battements par minute) et les instruments à chercher. Ne cite aucun titre ni artiste réel.\n```"}, {"id": "c22", "n": "22", "title": "22. Bruitages", "phase": 1, "sum": "Ajouter de petits sons (pas, porte, rire, pop) qui donnent de la vie à l'image.", "md": "**Ce que tu vas faire.** Ajouter de petits sons (pas, porte, rire, pop) qui donnent de la vie à l'image.\n\n**Terme expliqué.** Un *bruitage* (ou SFX, pour *sound effects*) est un son court lié à une action : un objet qui tombe, un souffle, un « pop ».\n\n**Pourquoi cette étape existe.** Une animation IA est souvent silencieuse ou avec un son générique. Quelques bruitages bien placés masquent les défauts visuels et créent l'humour.\n\n**Avant de commencer.** Ton storyboard, avec les moments où un son aide (chute, surprise, entrée d'un personnage).\n\n### Pas à pas\n\n1. **Liste** 8 à 12 bruitages pour l'épisode dans un tableau : plan, action, son voulu.\n2. **Cherche** dans la bibliothèque d'effets sonores de CapCut (menu **Audio**, puis **Effets sonores**) ou dans une banque libre, en vérifiant la licence.\n3. **Place chaque son** sur la timeline, exactement sur l'action (la seconde de l'impact, pas avant).\n4. **Ajoute une ambiance** continue et discrète (marché, vent, cuisine) sous tout l'épisode.\n5. **Écoute avec un casque**, puis avec le haut-parleur d'un téléphone : c'est ainsi que ton public l'entendra.\n6. **N'en mets pas trop** : un son par action importante suffit.\n\n**À sauvegarder.** Le tableau des bruitages et le dossier `09_AUDIO/sfx/`, avec la licence.\n\n**Si le résultat est mauvais.**\n\n- Le son paraît en retard : avance-le de quelques images.\n- Trop de bruit : supprime la moitié des effets.\n- Un effet ne sonne pas juste : essaie 3 variantes avant de le garder.\n\n**Prompt à copier (Claude) : plan sonore**\n\n```\nVoici le storyboard de mon épisode [colle-le]. Crée un tableau avec : numéro de plan, moment exact, bruitage nécessaire, mots-clés de recherche en anglais pour le trouver dans une banque de sons, et volume relatif (faible, moyen, fort). Limite-toi à 12 bruitages et ajoute une ambiance continue pour tout l'épisode.\n```"}, {"id": "c23", "n": "23", "title": "23. Montage CapCut, clic par clic", "phase": 1, "sum": "Assembler tous tes clips, voix, musique et bruitages dans un seul épisode vertical.", "md": "> [Ouvrir l'annexe K, partie C](#mvrm72sfxts.297107) : harmoniser les couleurs et régler le son.\n\n**Ce que tu vas faire.** Assembler tous tes clips, voix, musique et bruitages dans un seul épisode vertical.\n\n**Termes expliqués.**\n\n- *Timeline* : la bande horizontale en bas de l'écran où tu places tes éléments dans l'ordre du temps.\n- *Piste* : une ligne de la timeline (une pour la vidéo, une pour les voix, une pour la musique, une pour les bruitages).\n- *Coupe* : le moment où on passe d'un plan au suivant.\n- *Rythme* : la fréquence des coupes. En Short, un changement toutes les 3 à 6 secondes maintient l'attention.\n\n**Pourquoi cette étape existe.** Les clips générés sont des matériaux bruts. C'est le montage qui crée l'histoire, le rythme et la cohérence sonore.\n\n**Avant de commencer.** Tous tes clips téléchargés et nommés (`EP01_P01_v2.mp4`), tes audios, ta musique, ton script.\n\n**Sur CapCut et son prix.** CapCut existe en application mobile, sur ordinateur et en version web. Une version gratuite existe, avec des fonctions limitées, et une offre Pro payante dont le prix varie selon le pays et la période. Je n'ai pas pu vérifier le montant actuel sur la page officielle : regarde-le dans l'application avant de t'abonner. Certaines fonctions ou exports peuvent être limités selon l'offre, et les contenus **Pro** (effets, musiques) ne s'exportent pas toujours avec la version gratuite.\n\n### Pas à pas\n\n1. **Crée le projet.** Ouvre CapCut, clique sur **Nouveau projet** (ou **Créer un projet**).\n2. **Importe** tous les clips : bouton **Importer**, sélectionne le dossier `08_VIDEOS`.\n3. **Règle le format vertical.** Cherche le bouton du ratio (souvent **Ratio** ou **Format**) et choisis **9:16**.\n4. **Place les clips dans l'ordre** du storyboard : glisse chaque clip sur la piste vidéo principale, dans l'ordre des numéros de plan.\n5. **Coupe l'inutile.** Pose la tête de lecture (la barre verticale) là où tu veux couper, puis clique sur **Diviser** (icône ciseaux). Supprime les premières et dernières secondes molles de chaque clip (souvent 0,3 à 1 seconde).\n6. **Ajuste la vitesse** si un mouvement est trop lent : sélectionne le clip, puis **Vitesse**, et essaie 1,1 à 1,3.\n7. **Ajoute les voix** : bouton **Audio** ou **Importer**, glisse chaque fichier sur une piste dédiée, aligne-le sur le plan.\n8. **Ajoute la musique** sur une autre piste et baisse son volume (glisse la ligne de volume vers le bas, ou règle à 10 à 20 %).\n9. **Ajoute les bruitages** à leur moment exact (section 22).\n10. **Ajoute les transitions** avec modération : une simple coupe franche suffit dans 80 % des cas. Garde la même transition partout.\n11. **Enregistre le projet** et duplique-le pour l'épisode suivant : tu gardes ton modèle (titre, logo, sous-titres, musique signature) et tu ne remplaces que les clips.\n\n**Astuce modèle.** Crée un projet nommé `MODELE_SERIE` avec ton intro courte, ton style de sous-titres, ton logo, et ta musique de signature. Chaque nouvel épisode commence par une copie de ce projet.\n\n**À sauvegarder.** Le projet CapCut, une copie `EP01_montage_v1`, et la liste des ressources utilisées.\n\n**Si le résultat est mauvais.**\n\n- L'épisode paraît lent : coupe plus court, retire les silences, accélère légèrement.\n- Les personnages ne se ressemblent pas d'un plan à l'autre : remplace le plan concerné (section 16), ne tente pas de le corriger au montage.\n- La voix est trop basse par rapport à la musique : baisse la musique avant de monter la voix.\n- CapCut bloque l'export : vérifie si un élément Pro est utilisé et remplace-le.\n\n**Prompt à copier (Claude) : plan de montage**\n\n```\nVoici le storyboard et la durée de chaque clip [colle les infos]. Crée un plan de montage pour CapCut : ordre des plans, durée conservée pour chacun, moment des coupes, endroits pour les bruitages, endroits pour les sous-titres, et un point de tension à la moitié. Objectif : une vidéo verticale de 70 à 90 secondes.\n```"}, {"id": "c24", "n": "24", "title": "24. Sous-titres", "phase": 1, "sum": "Afficher le texte des dialogues à l'écran, lisible sur téléphone, sans toucher les zones cachées par l'interface.", "md": "> [Ouvrir l'annexe L, partie A](#mvrm72sfxts.297212) : où placer le texte sur un écran 9:16.\n>\n> [Ouvrir l'annexe L, partie B](#mvrm72sfxts.297252) : les réglages précis des sous-titres.\n\n**Ce que tu vas faire.** Afficher le texte des dialogues à l'écran, lisible sur téléphone, sans toucher les zones cachées par l'interface.\n\n**Pourquoi cette étape existe.** Beaucoup de gens regardent sans le son. Les sous-titres aident aussi la compréhension et le rythme, et ils permettent d'utiliser la méthode A (voix off) de la section 18.\n\n**Avant de commencer.** Ton montage terminé (section 23) et les dialogues écrits.\n\n### Les règles de lisibilité\n\n| Règle | Valeur conseillée |\n| --- | --- |\n| Nombre de lignes | 2 au maximum |\n| Longueur par ligne | environ 35 caractères |\n| Police | grosse, simple, sans fioriture |\n| Contraste | texte clair avec contour ou fond sombre |\n| Zone à éviter en haut | environ 15 % de la hauteur |\n| Zone à éviter en bas | environ 20 % de la hauteur (description, boutons) |\n| Côté droit | évite l'extrême droite (icônes j'aime, commentaires, partage) |\n\nCes pourcentages sont des repères prudents : l'interface change selon la plateforme et le modèle de téléphone. Fais un test de publication en privé pour vérifier.\n\n### Pas à pas dans CapCut\n\n1. Ouvre ton projet et clique sur **Texte**, puis **Sous-titres automatiques** (ou **Légendes automatiques**, le nom varie).\n2. Choisis la langue **Français** et lance la génération.\n3. **Relis chaque sous-titre.** La reconnaissance automatique se trompe sur les noms propres, les mots inventés et les expressions. Corrige tout, sans exception.\n4. Applique **un seul style** à tous les sous-titres : police, taille, couleur, contour. Enregistre-le comme préréglage.\n5. Place les sous-titres dans la zone sûre, un peu au-dessus du bas.\n6. **Mets en couleur** le nom du personnage ou le mot clé (un mot par phrase maximum).\n7. **Fais correspondre** chaque sous-titre à la parole : il apparaît au moment où la phrase commence et disparaît quand elle se termine.\n\n**À sauvegarder.** Le style de sous-titres (préréglage) et un fichier texte `EP01_soustitres.txt`.\n\n**Si le résultat est mauvais.**\n\n- Les mots sont faux : corrige à la main. Pour les noms de personnages, tape-les une fois et copie-colle.\n- Le texte est caché par l'interface : remonte-le ou raccourcis-le.\n- Le texte est trop dense : coupe la phrase en deux sous-titres.\n\n**Prompt à copier (Claude) : découpage des sous-titres**\n\n```\nVoici les dialogues de mon épisode [colle-les]. Découpe-les en sous-titres de 2 lignes maximum, 35 caractères par ligne maximum, en gardant les phrases naturelles. Indique pour chaque sous-titre la réplique correspondante et le mot à mettre en couleur. Ne modifie pas le sens.\n```"}, {"id": "c25", "n": "25", "title": "25. Le hook (l'accroche des 3 premières secondes)", "phase": 1, "sum": "Créer un début qui pousse à rester, avant que le spectateur ne fasse défiler.", "md": "> [Ouvrir l'annexe L, partie D](#mvrm72sfxts.297318) : les formules d'accroche et la façon de les mesurer.\n\n**Ce que tu vas faire.** Créer un début qui pousse à rester, avant que le spectateur ne fasse défiler.\n\n**Terme expliqué.** Un *hook* (de l'anglais « crochet ») est le tout premier plan d'une vidéo : image, son ou phrase qui donne envie de voir la suite.\n\n**Pourquoi cette étape existe.** Sur une application de vidéos courtes, la décision de rester ou de partir se prend en quelques secondes. Un épisode excellent mais lent au début sera peu vu.\n\n**Avant de commencer.** Le résumé de l'épisode et son moment le plus fort.\n\n### Cinq types de hook qui marchent pour une série de fiction\n\n| Type | Exemple avec la série « Rue des Vergers » |\n| --- | --- |\n| La question qui intrigue | « Qui a volé la dernière tarte de Madame Pomme ? » |\n| Le milieu de l'action | Basile Banane glisse sur le marché, tout tombe |\n| La phrase choc | « Cerise, tu m'as menti. » |\n| Le rappel de l'épisode d'avant | « Hier, Prune a découvert un secret. Aujourd'hui, tout le monde le sait. » |\n| Le détail bizarre | Monsieur Citron sourit alors qu'il pleure |\n\n### Pas à pas\n\n1. **Relis ton épisode** et repère la seconde la plus forte.\n2. **Place cette seconde tout au début** (ou une partie), puis reviens en arrière si besoin.\n3. **Crée 3 hooks** différents pour le même épisode.\n4. **Choisis-en un** après lecture à voix haute : est-ce qu'on veut savoir la suite ?\n5. **Écris-le en gros** sur l'image, pendant les 2 premières secondes.\n6. **Ne fais pas** de générique long, de logo qui tourne ou de « Bonjour tout le monde ».\n\n**À sauvegarder.** Les 3 hooks proposés et celui retenu, avec la performance mesurée après publication (section 40).\n\n**Si le résultat est mauvais.**\n\n- Les gens partent dès le début : le hook est trop lent ou trop flou. Teste un autre type.\n- Le hook promet trop : le spectateur se sent trompé à la fin. Rends-le fidèle à l'épisode.\n- Il ne marche qu'une fois : évite de le répéter à l'identique dans chaque épisode.\n\n**Prompt à copier (Claude) : hooks**\n\n```\nVoici le résumé de mon épisode [colle-le] et son moment le plus fort [décris-le]. Propose 5 hooks de 3 secondes maximum : phrase parlée, texte à l'écran, et image d'ouverture en anglais pour un générateur d'images. Chaque hook doit être fidèle à l'épisode, sans mensonge sur la suite. Classe-les de celui qui intrigue le plus à celui qui intrigue le moins, et explique pourquoi.\n```"}, {"id": "c26", "n": "26", "title": "26. Le cliffhanger (la fin qui donne envie de la suite)", "phase": 1, "sum": "Terminer chaque épisode sur une question ouverte pour que le public revienne, s'abonne et regarde l'épisode suivant.", "md": "**Ce que tu vas faire.** Terminer chaque épisode sur une question ouverte pour que le public revienne, s'abonne et regarde l'épisode suivant.\n\n**Terme expliqué.** Un *cliffhanger* (de l'anglais « suspendu à une falaise ») est une fin qui laisse l'histoire en suspens.\n\n**Pourquoi cette étape existe.** Une série ne fonctionne que si le spectateur veut la suite. Le cliffhanger transforme un spectateur en abonné.\n\n**Avant de commencer.** L'arc de la saison (section 13) : chaque cliffhanger doit servir cet arc.\n\n### Six formes de cliffhanger\n\n| Forme | Exemple |\n| --- | --- |\n| La révélation | Cerise découvre une lettre au nom de Prune |\n| Le danger | Un panier de fruits s'écroule au-dessus de Basile |\n| L'arrivée | Une silhouette inconnue entre dans le marché |\n| La mauvaise décision | Madame Pomme accepte le marché de Monsieur Citron |\n| La question sans réponse | « Et si ce n'était pas lui ? » |\n| Le retournement | Le meilleur ami est en réalité celui qui a trahi |\n\n### Pas à pas\n\n1. **Choisis la forme** qui convient à l'épisode.\n2. **Coupe juste avant la réponse** : le spectateur doit voir la question, pas la solution.\n3. **Dure 3 à 5 secondes** au maximum pour la dernière image.\n4. **Ajoute une phrase de suite** à l'écran, par exemple « Épisode 5 demain » (seulement si tu tiens la promesse).\n5. **Alterne** : un cliffhanger fort tous les 2 ou 3 épisodes, pas à chaque fois, pour ne pas fatiguer le public.\n6. **Réponds** à la question au début de l'épisode suivant, en la traitant vite.\n\n**À sauvegarder.** La liste des cliffhangers de la saison dans un tableau : épisode, forme, question posée, réponse prévue.\n\n**Si le résultat est mauvais.**\n\n- Le public ne réagit pas : la question n'était pas assez personnelle. Ajoute un enjeu pour un personnage aimé.\n- Les commentaires disent « on a compris » : la fin est trop prévisible. Change la forme.\n- Tu ne sais pas comment résoudre le cliffhanger : ne le publie pas avant d'avoir la suite.\n\n**Prompt à copier (Claude) : cliffhangers**\n\n```\nVoici l'arc de ma saison [colle-le] et le résumé de l'épisode [colle-le]. Propose 5 cliffhangers de 5 secondes maximum, chacun dans une forme différente (révélation, danger, arrivée, mauvaise décision, question, retournement). Pour chacun, donne : la dernière image, la dernière phrase, et comment l'épisode suivant y répond. Évite les cliffhangers artificiels qui ne sont jamais résolus.\n```"}, {"id": "c27", "n": "27", "title": "27. Export : sortir la vidéo finale", "phase": 1, "sum": "Transformer ton montage en un fichier vidéo propre, aux bons réglages, prêt à être publié partout.", "md": "**Ce que tu vas faire.** Transformer ton montage en un fichier vidéo propre, aux bons réglages, prêt à être publié partout.\n\n**Termes expliqués.**\n\n- *Export* : la génération du fichier vidéo final à partir du projet de montage.\n- *Résolution* : le nombre de points de l'image. 1080 x 1920 signifie 1080 points de large et 1920 de haut (format vertical).\n- *Fréquence d'images* : le nombre d'images par seconde (30 est un standard courant).\n- *Master* : ton fichier de référence, sans logo de plateforme, dont tu tires toutes les versions.\n\n**Pourquoi cette étape existe.** Une vidéo mal exportée est recompressée par les plateformes et perd en qualité. Un seul bon fichier principal évite de tout refaire.\n\n**Avant de commencer.** Un montage relu en entier, avec le son, sur ton téléphone.\n\n### Réglages conseillés\n\n| Réglage | Valeur |\n| --- | --- |\n| Format | vertical 9:16 |\n| Résolution | 1080 x 1920 |\n| Fréquence d'images | 30 images par seconde |\n| Format de fichier | MP4 (vidéo H.264, audio AAC) |\n| Durée conseillée | 65 à 90 secondes (voir la section 34 pour la règle de 1 minute sur TikTok) |\n| Durée maximale YouTube Shorts | jusqu'à 3 minutes |\n| Logo de plateforme | aucun (ne télécharge pas ta vidéo depuis TikTok pour la republier ailleurs) |\n\n### Pas à pas dans CapCut\n\n1. Rejoue l'épisode entièrement, en cherchant les erreurs : faute dans un sous-titre, coupure trop brusque, son saturé.\n2. Clique sur **Exporter** (en haut à droite sur ordinateur).\n3. **Réglage de résolution :** choisis 1080p.\n4. **Réglage de fréquence :** 30 fps.\n5. **Nom du fichier :** `RDV_S01_EP01_MASTER.mp4` (initiales de la série, saison, épisode).\n6. **Dossier :** `12_EXPORTS` de ton organisation de fichiers (section 46).\n7. Clique sur **Exporter** et attends la fin.\n8. **Regarde le fichier exporté**, pas seulement le projet : ouvre-le sur ton téléphone, avec le son.\n9. **Fais une copie** vers ton stockage de secours.\n\n**À sauvegarder.** Le fichier master, le projet CapCut, et les fichiers audio et vidéo sources dans un dossier `EP01_SOURCES`.\n\n**Si le résultat est mauvais.**\n\n- L'export est flou : vérifie la résolution choisie et la qualité des clips de départ (une vidéo générée en 720p agrandie restera un peu douce).\n- Le fichier est trop lourd : baisse légèrement la qualité ou raccourcis la durée.\n- Il y a un filigrane : un élément Pro ou une fonction d'une application gratuite en est la cause. Remplace-le.\n- Le son est décalé : réexporte après avoir vérifié toutes les pistes.\n\n**Prompt à copier (Claude) : check-list d'export**\n\n```\nCrée une check-list d'export pour une vidéo verticale de série de fiction de 70 à 90 secondes destinée à TikTok, YouTube Shorts, Instagram Reels et Facebook Reels. Inclure : réglages techniques, vérifications visuelles, vérifications sonores, vérifications des sous-titres, nom de fichier, sauvegardes. Une case à cocher par point.\n```\n\n### Améliorer la netteté avant l'export\n\nUne vidéo générée en 720p puis agrandie reste un peu douce. Deux solutions, dans cet ordre : génère directement tes plans définitifs dans la meilleure résolution que ton outil propose (souvent 1080p, parfois réservée aux offres payantes), et garde les résolutions basses pour les essais. Il existe aussi des logiciels d'agrandissement par IA, la plupart payants : ne les utilise que sur les plans déjà validés, jamais sur des essais. Un filtre de lissage peut enlever un léger scintillement, mais il ne corrige pas un visage déformé ([annexe K, partie A](#mvrm72sfxts.296985))."}, {"id": "c28", "n": "28", "title": "28. Publier sur TikTok", "phase": 2, "sum": "Créer ton compte de série, publier ton premier épisode avec un titre, une description, des hashtags et l'étiquette IA.", "md": "> [Ouvrir l'annexe L, partie C](#mvrm72sfxts.297286) : les couvertures.\n>\n> [Ouvrir la section 3](#mvrm72sfxts.12651) : les hashtags.\n\n**Ce que tu vas faire.** Créer ton compte de série, publier ton premier épisode avec un titre, une description, des hashtags et l'étiquette IA.\n\n**Termes expliqués.**\n\n- *Compte personnel* : le type de compte standard. Pour le programme de rémunération des créateurs (section 34), TikTok demande un compte personnel, pas un compte professionnel.\n- *Hashtag* : un mot précédé de # qui classe ta vidéo par thème.\n- *Collection* (ou playlist) : un regroupement de vidéos dans l'ordre, pratique pour une série.\n\n**Pourquoi cette étape existe.** Publier n'est pas juste envoyer un fichier : le titre, la description et les réglages influencent la portée, la légalité (étiquette IA) et l'ordre de visionnage.\n\n**Avant de commencer.** Ton master (section 27), ton nom de série, une photo de profil (l'image de ton personnage principal), une description courte du compte.\n\n### Préparer le compte\n\n1. **Crée un compte dédié** à la série, avec une adresse e-mail que tu contrôles. Ne mélange pas avec un autre usage.\n2. **Choisis un nom clair** : le nom de la série ou du personnage principal.\n3. **Photo de profil** : le visage de ton personnage principal, en gros plan, sur fond uni.\n4. **Biographie** (courte) : par exemple « Série de fiction animée créée avec l'IA. Un épisode par jour. » Elle sert aussi d'étiquetage.\n5. **Reste sur un compte personnel** si tu vises le programme de rémunération (section 34).\n\n### Publier un épisode\n\n1. Dans l'application, appuie sur **+** en bas, puis sur **Importer** pour choisir ton fichier exporté.\n2. **Description** : une phrase d'accroche (pas un résumé complet), le numéro de l'épisode, 3 à 5 hashtags.\n3. **Couverture** : choisis une image nette avec le personnage et le titre de l'épisode.\n4. **Étiquette IA** : active l'option qui indique un contenu généré par IA (souvent nommée **Contenu généré par l'IA** dans **Plus d'options**). Voir la section 32.\n5. **Collection** : ajoute l'épisode à une collection nommée comme ta saison, si l'option est disponible sur ton compte.\n6. **Réglages** : laisse les commentaires ouverts au début, ils aident la portée.\n7. Appuie sur **Publier**.\n8. **Écris un premier commentaire** avec une question au public (« Qui a volé la tarte ? »).\n9. **Reste 15 à 30 minutes** pour répondre aux premiers commentaires.\n\n### Le rythme\n\nUn épisode par jour convient pour un test de 30 jours (section 49). Ce rythme est exigeant : commence par 3 à 4 épisodes par semaine si tu manques de temps, mais ne change pas de jour d'une semaine à l'autre.\n\n### Horaires\n\nTeste deux créneaux pendant deux semaines : 12 h à 14 h et 18 h 30 à 21 h 30 (heure de France). Puis garde celui où les premières heures de visionnage sont les meilleures. Ce sont des hypothèses de départ, pas une règle : ton public décidera.\n\n**Modèle de description.**\n\n```\n[Phrase d'accroche] 🍎 Série de fiction créée avec l'IA | Épisode [numéro] #feuilleton #ia #animation #serie\n```\n\n**À sauvegarder.** L'adresse du compte, le lien du profil, la description publiée, l'heure de publication, et une capture d'écran de l'étiquette IA activée.\n\n**Si le résultat est mauvais.**\n\n- Peu de vues au début : c'est normal sur un compte neuf. Publie au moins 10 épisodes avant de juger.\n- Vidéo bloquée ou retirée : lis le motif dans les notifications. Souvent c'est la musique ou l'étiquette IA.\n- Baisse brutale : vérifie que tu ne republies pas des contenus quasi identiques (voir la section 35 sur le contenu répétitif).\n\n**Prompt à copier (Claude) : description TikTok**\n\n```\nRédige 5 descriptions TikTok en français pour l'épisode [numéro] de ma série de fiction animée [résumé en une phrase]. Chaque description : une phrase d'accroche de 12 mots maximum, la mention « Série de fiction créée avec l'IA », et 4 hashtags pertinents en français. Pas de promesse trompeuse.\n```\n\n### Faire vivre les commentaires\n\nPour une série, les commentaires sont aussi un outil d'écriture. Ce sont des conseils de méthode, pas une règle officielle de TikTok :\n\n- Réponds aux premiers commentaires dans l'heure qui suit la publication, quand tu le peux.\n- Pose une question à la fin de la description (« Tu crois que c'est elle qui a menti ? ») pour lancer la discussion.\n- Note dans ton tableau de statistiques les théories et les personnages dont on parle le plus : ils t'indiquent quoi développer dans les épisodes suivants.\n- Supprime ou masque les commentaires insultants ; ne réponds jamais à une provocation."}, {"id": "c29", "n": "29", "title": "29. Publier sur YouTube Shorts", "phase": 2, "sum": "Créer ta chaîne, publier un Short avec titre, description et paramètres de contenu synthétique, et ranger tes épisodes en playlist.", "md": "**Ce que tu vas faire.** Créer ta chaîne, publier un Short avec titre, description et paramètres de contenu synthétique, et ranger tes épisodes en playlist.\n\n**Termes expliqués.**\n\n- *Short* : une vidéo verticale courte publiée sur YouTube. Les Shorts peuvent aujourd'hui aller jusqu'à 3 minutes si le format est vertical ou carré.\n- *YouTube Studio* : l'espace de gestion de ta chaîne (application ou site).\n- *Playlist* : une liste de vidéos dans l'ordre choisi.\n\n**Pourquoi cette étape existe.** YouTube est la plateforme dont les règles de monétisation sont les plus claires et les plus stables (section 35). C'est aussi celle où un épisode reste trouvable longtemps.\n\n**Avant de commencer.** Un compte Google, ton master, une bannière simple, une description de chaîne.\n\n### Créer la chaîne\n\n1. Ouvre YouTube et connecte-toi. Clique sur ta photo, puis **Créer une chaîne**.\n2. Choisis le nom de la série. Ajoute la photo de profil et une bannière.\n3. Dans **YouTube Studio**, ouvre **Personnalisation** et écris la description : « Série de fiction animée créée avec l'IA. Nouvel épisode chaque jour. »\n4. **Vérifie ton compte** avec ton numéro de téléphone (cela débloque les fonctions avancées).\n\n### Publier un Short\n\n1. Dans YouTube Studio, clique sur **Créer**, puis **Importer des vidéos** (ou sur l'application : **+**, puis **Importer**).\n2. Sélectionne ton master. Il doit être vertical et de moins de 3 minutes pour être classé en Short.\n3. **Titre** : 60 caractères environ, avec le nom de la série et l'accroche. Exemple : « Rue des Vergers, épisode 5 : qui a volé la tarte ? ».\n4. **Description** : une phrase d'accroche, le résumé en une ligne, « Série de fiction créée avec l'IA », le lien de la playlist, 3 hashtags.\n5. **Public** : choisis **Non, ce contenu n'est pas destiné aux enfants** ou **Oui** selon le cas. C'est une obligation, réponds honnêtement (si le contenu s'adresse clairement aux enfants, réponds oui, avec les limites que cela implique sur les commentaires et certaines fonctions).\n6. **Contenu modifié ou synthétique** : réponds **Oui** si l'audio ou l'image montre des scènes réalistes créées par IA. D'après la page d'aide officielle de YouTube, un contenu clairement irréaliste (dessin animé, fruits ou animaux qui parlent) ne demande pas de déclaration, mais une 3D qui pourrait passer pour une vraie scène en demande une. En cas de doute, réponds Oui (section 32 et annexe K, partie E).\n7. **Playlist** : ajoute l'épisode à la playlist de ta saison.\n8. **Visibilité** : choisis **Public** (ou **Programmé** pour fixer l'heure).\n9. Clique sur **Publier**.\n\n**À sauvegarder.** L'adresse de la chaîne, le lien de chaque Short, le titre et la description utilisés, et la capture des choix de contenu synthétique.\n\n**Si le résultat est mauvais.**\n\n- Le Short n'apparaît pas comme Short : la vidéo n'est pas verticale ou dépasse la durée permise.\n- Une réclamation de droits d'auteur apparaît : c'est la musique. Remplace-la par une piste de la bibliothèque audio de YouTube.\n- Peu de vues : joue sur le titre et la miniature d'épisode, publie régulièrement, surveille le taux de rétention (section 40).\n\n**Prompt à copier (Claude) : titres YouTube**\n\n```\nPropose 10 titres YouTube Shorts de 60 caractères maximum pour l'épisode [numéro] de ma série de fiction [résumé]. Chaque titre inclut le nom de la série ou le numéro de l'épisode, donne envie de cliquer sans mentir, et ne contient ni majuscules excessives ni promesse fausse.\n```\n\n### Ta série est-elle « conçue pour les enfants » ?\n\nC'est une question obligatoire sur YouTube, et elle concerne directement les séries animées. D'après la [page d'aide officielle de YouTube](https://support.google.com/youtube/answer/9528076), une vidéo est conçue pour les enfants quand les enfants en sont le public principal, ou quand elle s'adresse à eux par ses éléments : personnages, jouets ou personnages animés qui plaisent aux enfants, sujets pour les tout-petits, langage et activités pensés pour les enfants. YouTube rappelle que c'est au créateur de faire ce choix, que c'est sa responsabilité légale au regard de la loi américaine sur la protection des enfants en ligne (COPPA), et qu'un mauvais réglage peut entraîner des sanctions sur YouTube ou des conséquences légales.\n\nCe que ça change pour toi : un dessin animé n'est pas automatiquement « pour enfants ». Une série de trahisons et de secrets en
